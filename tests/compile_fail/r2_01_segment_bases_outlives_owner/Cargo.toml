# Compile-fail fixture — compiled ONLY by root
# tests/regression_r2_01_segment_bases_lifetime.rs (never by the workspace:
# the detached [workspace] table below opts it out, and cargo does not
# auto-discover nested test dirs, mirroring the established
# crates/primitives/tagged-index-stack/tests/compile_fail/*/Cargo.toml pattern).
# Deliberately dependency-free apart from the path dep, so
# `cargo build --offline` needs no network. Note: P1.2's weak root forwards
# (`internals`/`bench-internals` -> `sefer-concurrent?/…`) still put
# sefer-concurrent's registry deps (arc-swap, crossbeam-epoch,
# crossbeam-utils, rustversion, pinned to the root Cargo.lock versions) into
# this fixture's lock graph, so the offline child build requires them in the
# cargo cache; CI provides them via `cargo fetch --locked` steps in the test
# jobs.
[workspace]

[package]
name = "r2_01_segment_bases_outlives_owner_fixture"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
sefer-alloc = { path = "../../..", features = ["alloc-global", "internals"] }
