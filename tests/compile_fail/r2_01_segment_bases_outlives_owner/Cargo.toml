# tests/regression_r2_01_segment_bases_lifetime.rs (never by the workspace:
# the detached [workspace] table below opts it out, and cargo does not
# auto-discover nested test dirs, mirroring the established
# crates/tagged-index-stack/tests/compile_fail/*/Cargo.toml pattern).
# Deliberately dependency-free apart from the path dep, so
# `cargo build --offline` needs no network.
[workspace]

[package]
name = "r2_01_segment_bases_outlives_owner_fixture"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
sefer-alloc = { path = "../../..", features = ["alloc-global"] }
