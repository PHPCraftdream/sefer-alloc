name: test-impact-map

# CI-T1 stage 2 (docs/CI_TIERS.md): nightly map "integration test -> repository files its instrumented
# binary executes", published as the artifacts test-impact-map-<row>.json. Generation and validation only; no
# job of ci.yml reads the map yet (stage 3). Two rows: `production internals` and
# `--all-features`. A test the row compiles to nothing (crate-level cfg) or that its required-features exclude
# is listed as unmapped in that row; stage 3 unions the rows.
#
# Each test is built and run alone (cargo test --test <name>) under -C instrument-coverage and its binary
# is deleted right after its coverage is exported, so the runner disk holds one instrumented binary at a time.
permissions:
  contents: read

on:
  schedule:
    - cron: '0 4 * * *'   # nightly 04:00 UTC, after the 03:00 full tier of ci.yml
  workflow_dispatch:
  pull_request:
    types: [labeled, synchronize, reopened]   # only with the label `test-impact-map` (a dispatch needs the file on main first)

concurrency:
  group: test-impact-map-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  collect:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'test-impact-map')
    name: collect (${{ matrix.row }}, shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        row: [production-internals, all-features]
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: node scripts/test-impact-map.mjs --selftest
      - run: node scripts/test-impact-map.mjs collect --features "${{ matrix.row == 'all-features' && 'all' || 'production internals' }}" --shard ${{ matrix.shard }}/4 --out part-${{ matrix.shard }}.json
      - uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: test-impact-part-${{ matrix.row }}-${{ matrix.shard }}
          path: part-${{ matrix.shard }}.json
          if-no-files-found: error
          retention-days: 7

  merge:
    name: merge and check (${{ matrix.row }})
    needs: collect
    strategy:
      fail-fast: false
      matrix:
        row: [production-internals, all-features]
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'test-impact-map')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/download-artifact@v6
        with:
          pattern: test-impact-part-${{ matrix.row }}-*
          merge-multiple: true
      - run: node scripts/test-impact-map.mjs merge --out test-impact-map-${{ matrix.row }}.json part-*.json
      - run: node scripts/test-impact-map.mjs check test-impact-map-${{ matrix.row }}.json
      - uses: actions/upload-artifact@v6
        with:
          name: test-impact-map-${{ matrix.row }}
          path: test-impact-map-${{ matrix.row }}.json
          if-no-files-found: error
          retention-days: 30
