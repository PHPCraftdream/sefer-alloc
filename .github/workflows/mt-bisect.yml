name: mt-bisect

# Throwaway bisect harness (B1): runs examples/malloc_macro at each listed SHA
# on windows-2022. Triggered by the `mt-bench` label on its own PR.
permissions:
  contents: read

on:
  pull_request:
    types: [labeled, synchronize, reopened]

jobs:
  bisect:
    name: malloc_macro @ ${{ matrix.sha }}
    if: contains(github.event.pull_request.labels.*.name, 'mt-bench')
    runs-on: windows-2022
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        sha:
          - "485f5a70ab27e5a5c877a58f59e0359c3d7e82ca"
          - "a02ecbdde6e7a787beb8ff566e7615732cfd69d7"
          - "90872190ac2e469fff46acae1b0a4766cadbf326"
          - "5e8c8eaaac37aa5dc19118b5c91c46426df9310a"
          - "ce623d699c343eb4eb39624e3c69de10fa23297f"
          - "72b423edfb143a0cca18e0e4cb0b45ab4f3e7f06"
          - "08d54ff43a38757103bd7e91a22bece126d23825"
          - "17022592bfdd6075f88c0cd25859d1046534c112"
          - "743e31dc77b50561d98f8058356a7fe26545f303"
          - "ceffecb5c07d45e9d715670dfcaec3de69b2f9d2"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Checkout target SHA
        run: git checkout --detach "${{ matrix.sha }}" && git log -1 --format='%H %ad %s' --date=short | tee meta.txt
      - name: Run malloc_macro twice
        run: |
          set -euo pipefail
          for r in 1 2; do
            cargo run --release --example malloc_macro --features "alloc-global alloc-xthread pinning" 2>&1 | tee "run$r.log"
          done
      - name: Upload
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: bisect-${{ matrix.sha }}
          path: |
            meta.txt
            run1.log
            run2.log
          if-no-files-found: warn
          retention-days: 30
