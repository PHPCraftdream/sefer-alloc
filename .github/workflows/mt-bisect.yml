name: mt-bisect

# Throwaway bisect harness (B1): runs examples/malloc_macro at each listed SHA
# on windows-2022. Triggered by the `mt-bench` label on its own PR.
permissions:
  contents: read

on:
  pull_request:
    types: [labeled, synchronize, reopened]

jobs:
  bisect:
    name: malloc_macro @ ${{ matrix.sha }}
    if: contains(github.event.pull_request.labels.*.name, 'mt-bench')
    runs-on: windows-2022
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        sha:
          - "08d54ff43a38757103bd7e91a22bece126d23825"
          - "960b35b9e48ff46b144c72b46111ef500ca1ec9b"
          - "efec9d16615e65d744f88985588752c353f78525"
          - "acfe2013b5869412e5c5b24644edf0633f4963ba"
          - "1d8814292b954fe53063d33ae5baff76f25877f0"
          - "be7a5ae2bde81b88fe8837009f99f6a6566022b5"
          - "a424596560b5663c05ff03ab62615b13049edd72"
          - "69b86478bb7563ef2beec5de807fbbe3902a26ef"
          - "4a0c0bc4b0ea9b72ae7cf4d9b15097f1615ca8d6"
          - "e8843374328e5dbabb282dfbcc269cf3e81cd651"
          - "a9734eb51685d0022c15d202d0948de84d3406de"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Checkout target SHA
        run: git checkout --detach "${{ matrix.sha }}" && git log -1 --format='%H %ad %s' --date=short | tee meta.txt
      - name: Run malloc_macro twice
        run: |
          set -euo pipefail
          for r in 1 2; do
            cargo run --release --example malloc_macro --features "alloc-global alloc-xthread pinning" 2>&1 | tee "run$r.log"
          done
      - name: Upload
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: bisect-${{ matrix.sha }}
          path: |
            meta.txt
            run1.log
            run2.log
          if-no-files-found: warn
          retention-days: 30
