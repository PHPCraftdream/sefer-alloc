  test-workspace:
    # `cargo test` at the repo root tests ONLY the root package; the workspace
    # member crates' own test suites never ran in CI otherwise. Run each
    # member's tests explicitly. The steps below are not all
    # default-features-only (task #639/P5 added steps 3-6 on top of the
    # original step 1; see each step's own inline comment for the gap it
    # closes — no step count is stated here; this enumeration has gone stale
    # before, so describe steps by name, not by count):
    #   1. `aligned-vmem` + `sefer-region` + `malloc-bench-rs` — default
    #      features only. The feature flags are root-crate-scoped, so
    #      `--workspace` with `--features` would not apply cleanly to the
    #      members; the root feature matrix is covered by the `test` job above.
    #   2. `tagged-index-stack` — default features only (its non-loom test
    #      files had never run in CI at all before task #639).
    #   3. `aligned-vmem` — `--all-features` (deliberately NOT default-only:
    #      exercises `huge-pages`/`lazy-commit`/`fault-injection`/`bench-internals`
    #      together on the REAL backend; mock has its own RUSTFLAGS row below).
    #   4-5. `size-classes` / `once-ptr-cell` — `--no-default-features` cross-
    #      built for `thumbv7em-none-eabi` (bare-metal no_std proof for their
    #      published `no-std::no-alloc` category claim).
    #   6-9. `size-classes` (debug + release, task #755 F1-F3) and
    #      `once-ptr-cell` (debug + release, task #773 F1) — `cargo test`
    #      proper, since steps 4-5's cross-builds compile no test target.
    #   10. `tagged-index-stack` — `--features test-internals` in --release,
    #      the WHOLE crate test set (`--no-fail-fast`, no per-file `--test`
    #      allowlist since Sol-codex run-9 P2-2, task #1846 — a hand-picked
    #      `--test` list previously missed `tag_seal.rs` entirely): covers
    #      the `threaded_conservation` file's retry/backoff activation-oracle
    #      assertions, the three gated white-box probes in `stack_unit.rs`
    #      (Sol-codex run-6 P2-1, task #1828), and `tag_seal.rs`'s two
    #      terminal-seal regression tests, plus a matching test-internals
    #      clippy row (Sol-codex run-3 review P2-2, task tis-sc3-Group3
    #      #1768): steps 2's default-feature runs compile all of the above
    #      out entirely.
    name: test workspace members
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabi,x86_64-unknown-none,i686-unknown-linux-gnu,thumbv6m-none-eabi
      - run: cargo test -p aligned-vmem -p sefer-region -p malloc-bench-rs --no-fail-fast
      # Publish-readiness task #639 (P5, gap 1 of 4 — 2026-08-06 consolidated
      # summary §8 cross-cutting theme #4): at the time, `tests/stack_unit.rs`
      # and `tests/regression_counter_wrap.rs` in `crates/tagged-index-stack/`
      # were both `#![cfg(not(loom))]` — the ONLY existing CI invocation of
      # this crate anywhere in this workflow was `loom-alloc-global`'s
      # `cargo test --release -p tagged-index-stack --test loom_aba` under
      # `RUSTFLAGS: "--cfg loom"`, which excludes both files by cfg (and by
      # `--test` target selection regardless). At the time, 12 of the crate's
      # then-16 tests — packing round-trip, the empty sentinel, the tag's
      # `2^48` wrap-boundary coverage (pre-dating the later P1-1 seal fix;
      # `push` no longer wraps the tag today — it seals at `TAG_MAX` and
      # returns `Err(TagExhausted)` instead, see `stack_unit.rs`'s own module
      # doc), LIFO order, H-2 single-threaded observation, RAD-1 laziness,
      # and the F1 regression test added by task #638 — had never run in CI.
      # Plain `cargo test` (no `--cfg loom`) exercises all of them; `loom_aba.rs`
      # itself still compiles to 0 tests here (correctly excluded by its own
      # `#![cfg(loom)]` gate), which is fine — its real coverage stays the
      # `loom-alloc-global` job above. `tests/regression_counter_wrap.rs` was
      # later retired and its two tests folded into `stack_unit.rs`
      # (`empty_sentinel_never_collides_with_a_live_index` +
      # `empty_word_with_running_tag_reads_empty_through_tag_max`) — it no
      # longer exists as a separate file in this crate.
      - run: cargo test -p tagged-index-stack --no-fail-fast
      # rust-intel round-closing review (task #772, finding F4, 2026-08-09):
      # `push`'s index-validity guard was promoted from `debug_assert!` to a
      # full `assert!` (task #703) specifically so it holds identically in
      # debug and release, but nothing in CI ever ran this crate's tests in
      # `--release` -- only `loom-alloc-global`'s `--test loom_aba` runs in
      # release, and that target selection excludes `stack_unit.rs` (the file
      # with the promoted guard's regression test) both by `--test` and by its
      # own `#![cfg(not(loom))]` gate. Closes the gap for real: if the
      # `assert!` were ever accidentally reverted to `debug_assert!`, this
      # step is what would catch it.
      - run: cargo test -p tagged-index-stack --release --no-fail-fast
      # tagged-index-stack review (Sol-codex, run 3, P2-2, task
      # tis-sc3-Group3 #1768; folded into one whole-feature row by Sol-codex
      # run-9 P2-2, task #1846): both rows above run this crate with DEFAULT
      # features only, so every `#[cfg(any(feature = "test-internals", loom))]`
      # / `#[cfg(feature = "test-internals")]`-gated test in the crate compiles
      # out entirely — the activation-oracle assertions in
      # `tests/threaded_conservation.rs` (`retry_counts_for_test()` /
      # `backoff_cap_reached_for_test()`), the three white-box probes in
      # `tests/stack_unit.rs` (`empty_transition_preserves_running_tag`,
      # `links_are_lazy`, `default_stack_head_behaves_like_new`, gated since
      # tis-sol6 run-6 P2-1, task #1828), and the two substantive terminal-seal
      # regression tests in `tests/tag_seal.rs`
      # (`seal_sequence_ok_ok_err_with_permanent_seal_after_drain`,
      # `pushes_remaining_counts_down_to_zero_and_stays_there`, added by the
      # P1-1 full-tag-wrap fix). This row previously hand-picked
      # `--test threaded_conservation` and `--test stack_unit`; that
      # hand-maintained list silently missed `tag_seal.rs` when it landed —
      # its two substantive tests ran under NO CI job at all (the default
      # rows compiled them out by feature, the loom job runs a different,
      # `#[cfg(loom)]`-gated concurrent model, and the test-internals clippy
      # row below only typechecks, never executes `#[test]` bodies) — exactly
      # the drift class a per-file allowlist reproduces on every future gated
      # test file. Fixed for good by running the WHOLE `test-internals` test
      # set instead of a named subset, so any future gated test file is
      # picked up automatically. No tee+grep sentinel (task #1110 shape) is
      # possible here — the feature flag changes no libtest output line —
      # and it is not needed for the flag itself: cargo hard-errors on an
      # unknown feature name, so the flag cannot silently degrade into a
      # no-op. Verified locally: green with the feature on; a temporary
      # counter-mutation (backoff-cap accessor pinned to zeros) made the
      # backoff-depth oracle in `threaded_conservation.rs` fail under this
      # exact invocation and pass without the feature, then passed again
      # after the restore — the oracle is feature-activated, not vacuous.
      - run: cargo test -p tagged-index-stack --release --features test-internals --no-fail-fast
      # Publish-readiness task #639 (P5, gap 2 of 4): the crate-scoped
      # `aligned-vmem` step above ran default-features-only, so 3 of the
      # crate's 4 test files (`fault_injection.rs`, `lazy_commit.rs`,
      # `mock.rs` — all gated on the `fault-injection`/`lazy-commit` features
      # and, for `mock.rs`, the `aligned_vmem_mock` cfg since task #962) compiled to zero tests, and the Linux `MAP_HUGETLB`
      # `huge-pages` code path had never been compiled by CI on any OS.
      # After task #962, `--all-features` runs all remaining features on the
      # REAL backend (`lazy_commit.rs`/`smoke.rs` now actually run, and
      # `fault_injection.rs` also runs instead of compiling to zero tests
      # under mock as it did historically). The step below exercises mock
      # coverage separately via the build-time --cfg aligned_vmem_mock flag.
      # Task #1144 (N5) — CORRECTION, and a coverage gap this comment used to
      # conceal. This block previously claimed the step "as a side effect also
      # exercises `rust-version = \"1.88\"`'s MSRV-completeness for the crate
      # standalone with every feature on". That is FALSE on two counts:
      #   (a) this step lives in the `test workspace members` job, whose
      #       toolchain is `dtolnay/rust-toolchain@stable` — it never sees
      #       1.88 at all. Only the `msrv` job pins `@1.88`;
      #   (b) the real `msrv` job runs ROOT-scoped `cargo check --all-features`,
      #       and the root manifest forwards only `bench-internals`,
      #       `fault-injection` and `lazy-commit` into aligned-vmem
      #       (`grep -oE '"aligned-vmem\??/[a-z-]+"' Cargo.toml | sort -u`) —
      #       NEVER `huge-pages`.
      # So the `huge-pages` code is compiled on MSRV by NO job, and the claim
      # asserted coverage that does not exist — the same
      # comment-claims-coverage-it-does-not-have class this campaign has been
      # closing all round. This step's real value is a full `--all-features`
      # RUN on stable; MSRV coverage for `huge-pages` remains an open gap.
      - run: cargo test -p aligned-vmem --all-features --no-fail-fast
      # Task #962: mock-backend coverage for aligned-vmem on Linux. `mock`
      # was converted from a Cargo feature to the build-time
      # `--cfg aligned_vmem_mock` flag (cfg flags do not unify across the
      # dependency graph, unlike Cargo features), so `--all-features` in the
      # step above no longer compiles it — this row runs `mock.rs` /
      # `mock_reentrancy.rs` (and `smoke.rs` under the recording backend)
      # with all remaining optional features enabled.
      # Task #1101: tee + grep postcondition (task #1086 shape) — both mock
      # test FILES compile to zero tests on a typo'd cfg with exit 0, so the
      # greps require one named test per file.
      - run: |
          cargo test -p aligned-vmem --features "lazy-commit huge-pages fault-injection bench-internals" --no-fail-fast 2>&1 | tee "$RUNNER_TEMP/vmem-mock-debug.log"
          grep -F "test records_reserve_and_decommit ... ok" "$RUNNER_TEMP/vmem-mock-debug.log"
          grep -F "test reentrancy_is_silently_dropped_with_outer_record_intact ... ok" "$RUNNER_TEMP/vmem-mock-debug.log"
        shell: bash
        env:
          RUSTFLAGS: "--cfg aligned_vmem_mock"
      # rust-intel audit finding (task #699, HIGH, 2026-08-09):
      # `--all-features` does NOT actually run `fault_injection.rs` -- this
      # step's own comment above previously claimed it did ("plus
      # fault_injection.rs compiling and running under mock"), which was
      # false: the file's own `#![cfg(all(feature = "fault-injection",
      # feature = "lazy-commit", not(aligned_vmem_mock)))]` gate requires
      # mock OFF (it tests the REAL commit-fault-injection hook on the
      # real syscall backend, which `mock` entirely replaces), so turning
      # `mock` on alongside it via `--all-features` made the whole file
      # compile to ZERO tests. Since task #962 mock is a --cfg flag, so the
      # step above now correctly runs this file. This file's own tests
      # had therefore never executed in ANY CI configuration until task #699.
      # Fixed with a dedicated step using the file's actual required
      # feature combination. Deliberately not stating a test COUNT here
      # (task #776, F10) -- a hardcoded count goes stale the moment a test
      # is added or removed, exactly as happened to this comment's own
      # original "4 passed" once `#718` added a 5th test five commits
      # later without anyone revisiting it; `cargo test`'s own output is
      # the live source of truth for the current count.
      - run: cargo test -p aligned-vmem --features "fault-injection lazy-commit" --no-fail-fast
      # Publish-readiness task #639 (P5, gaps 3+4 of 4): CI's `no_std` job
      # (below) only ever built the ROOT crate's default-features-off
      # configuration as its no_std signal — `size-classes` (root-gated
      # behind `alloc-core`) and `once-ptr-cell` both advertise `no_std` as a
      # headline claim in their published descriptions/categories
      # (`no-std::no-alloc`) but were never built standalone in CI. Neither
      # crate declares a `std` Cargo feature to disable (`--no-default-
      # features` is a no-op flag for both, verified via `cargo metadata`),
      # so the actual proof is compiling for a genuine bare-metal target with
      # no std in its sysroot at all — the same `thumbv7em-none-eabi` target
      # the `no_std` job already uses for the root crate (installed via the
      # toolchain step above). Verified locally: both compile clean.
      - run: cargo build -p size-classes --no-default-features --target thumbv7em-none-eabi
      # rust-intel round-closing review (task #755, finding F1/F2/F3,
      # 2026-08-09): the `cargo build` step above compiles no test target at
      # all -- `size-classes` had ZERO `cargo test` coverage anywhere in CI,
      # the identical gap class as the `tagged-index-stack` (task #772
      # F4-F5) and `once-ptr-cell` (task #773 F1) steps in this same job.
      # All of the crate's tests, including the 3 regression tests this
      # round's fix commits added (#701, #729, #730), had never run in CI.
      # The `--release` row specifically matters here, mirroring the
      # `once-ptr-cell` release-row rationale immediately below: task #729's
      # `class_for` precondition is enforced by a `debug_assert!`
      # (deliberately not promoted to a release-active `assert!`, see its
      # own doc comment), so a debug-only `cargo test` run would stay green
      # even if that guard's presence were silently reverted -- release has
      # nothing to assert there by design, which is exactly why
      # `class_for_non_pow2_align_violates_debug_assert`
      # (tests/builder.rs) is itself `#[cfg(debug_assertions)]`-gated rather
      # than expected to pass in both profiles.
      - run: cargo test -p size-classes --all-features --no-fail-fast
      - run: cargo test -p size-classes --all-features --release --no-fail-fast
      # fh publication audit P4-2: before this row, every extreme-value test
      # in this crate was `#[cfg(target_pointer_width = "64")]`-gated (the
      # 64-bit-only overflow boundaries), and the `thumbv7em-none-eabi`
      # no_std row above is a lib-only `cargo build` that compiles no test
      # target -- so the crate's own doc-cited "84 on a 32-bit `usize`"
      # overflow boundary had never actually run anywhere. `i686-unknown-
      # linux-gnu` is a real 32-bit `usize` target that GitHub's
      # `ubuntu-latest` runner can both link and execute natively (x86_64
      # CPUs run i686 user-mode binaries directly); `gcc-multilib` supplies
      # the 32-bit glibc/linker needed to actually run the resulting test
      # binary, not just compile it (contrast with the `aligned-vmem` i686
      # rows elsewhere in this file, which are compile-only `cargo check`
      # and so don't need this package). Sol-run9 P4-1: this comment
      # originally said "is ... gated" in the present tense, which this
      # same commit's own new 32-bit-gated tests immediately made no
      # longer literally true -- fixed to the past tense above.
      - run: sudo apt-get update && sudo apt-get install -y gcc-multilib
      - run: cargo test -p size-classes --target i686-unknown-linux-gnu --all-features --no-fail-fast
      # size-classes publication audit run 1 (Sol-codex, P3-3): no `cargo
      # clippy -p size-classes` or `cargo doc -p size-classes` row existed
      # anywhere in this file -- the root-scoped clippy/docs jobs below
      # don't substitute: root clippy never lints this crate's OWN
