  commit-prefix-lint:
    # R31-5c (task #482): lints every commit in a PR's range against
    # CLAUDE.md's R30-12 taxonomy (perf(runtime) / perf(opt-in) / bench /
    # docs(config) — see scripts/verify-commit-prefixes.mjs's own header for
    # the full rule and both FAIL/WARN directions it checks).
    #
    # Why this is its OWN job/step, not folded into `npm run check` (unlike
    # verify-perf-gate-stubs/verify-gate-report just above, which the local
    # `check-all.mjs` also runs): those two check the WORKING TREE's current
    # state, which is well-defined identically both locally and in CI. This
    # check instead walks a COMMIT RANGE, and "which range" only has one
    # unambiguous, CI-native answer for a pull request specifically — the
    # PR's `base.sha..head.sha`, exactly what GitHub's PR UI diffs against.
    # A local `npm run check` run has no equivalent unambiguous range (no
    # PR object exists yet); scripts/verify-commit-prefixes.mjs's own
    # default (`@{u}..HEAD` if an upstream is configured, else the last 40
    # commits) is a REASONABLE local approximation and IS wired into
    # `npm run check` (see scripts/check-all.mjs) for that reason — this CI
    # job is the precise, PR-scoped complement, not a duplicate.
    #
    # `fetch-depth: 0` (full history) is required: the script's own
    # non-retroactive clipping (never lints a commit at-or-before the
    # R30-12 rule commit) calls `git merge-base --is-ancestor`, which needs
    # real history, not the default shallow (depth-1) checkout every other
    # job in this workflow uses.
    # Task #1144 (W2): this job used to be `if: github.event_name ==
    # 'pull_request'`, which made it DEAD IN THIS REPOSITORY — commits land
    # directly on `main` by push, and no pull request is ever opened. The
    # local `npm run check` complement is no better on its own: its default
    # range is `@{u}..HEAD`, which at a freshly-pushed HEAD is EMPTY, so it
    # passes vacuously. Net effect: the campaign's most-hardened guard (four
    # commits — tasks #1117, #1123, #1126, #1137) executed essentially
    # nowhere. That is the same class as item 80 (a guard hardened across
    # seven tasks with no CI row at all), one layer up: here a row existed,
    # but its trigger never fired.
    # Fixed by ALSO running on push, over `github.event.before..github.sha` —
    # exactly the commits the push introduced. Two edge cases the range must
    # survive, both handled by the script's own argument parsing: a first
    # push to a new branch and a force-push both give an all-zero or
    # unreachable `before` SHA, so the step falls back to the script's
    # default range instead of failing the job on a range git cannot resolve.
    name: commit-prefix-lint (R30-12 taxonomy, PR range + pushed range)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Lint the commit range this event introduced
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RANGE="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          else
            BEFORE="${{ github.event.before }}"
            # All-zero (branch creation) or unreachable (force-push) `before`:
            # there is no resolvable range, so fall back to the script's own
            # default rather than failing on a bad revision.
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
               || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
              echo "push event has no resolvable 'before' SHA ($BEFORE) — using the script's default range"
              node scripts/verify-commit-prefixes.mjs
              exit $?
            fi
            RANGE="$BEFORE..${{ github.sha }}"
          fi
          echo "linting range: $RANGE"
          node scripts/verify-commit-prefixes.mjs "$RANGE"
        shell: bash

  # Consolidated (2026-07-12, CI job-count reduction) from 13 single-
  # feature-set matrix jobs into 4 jobs, grouped by theme (the same
  # grouping the original per-entry comments already used). Unlike
  # `loom`/`miri` above, these 13 entries have 13 DIFFERENT feature
  # strings (no pair shares one, so there is no "share one cargo
  # invocation" trick available) — each step below is its own `cargo
  # test <features> --no-fail-fast` invocation, same as before.
  #
  # Every step carries `if: ${{ !cancelled() }}` so a failure in one
  # feature-set's step does NOT skip the remaining steps in the same job
  # (GitHub Actions' default is to skip subsequent steps after a
  # failure) — this preserves, at the feature-set granularity, the exact
  # property `--no-fail-fast` already guarantees at the test-binary
  # granularity within one step: "a failure in one row never masks
  # failures in later rows" (the explicit 0.3.0-hardening-pass lesson
  # this repo learned the hard way once already). The job's own overall
  # conclusion still correctly reports failure if any step failed.
  test-core:
    name: test (core tiers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: test ()
        if: ${{ !cancelled() }}
        run: cargo test --no-fail-fast # default: the safe core + SyncRegion
      - name: test (--features experimental)
        if: ${{ !cancelled() }}
        run: cargo test --features experimental --no-fail-fast # adds LockFreeRegion + EpochRegion (deprecated, legacy)
      # Phases 8–13 allocator descent. Without this, CI never exercised
      # alloc-core (the segment substrate, AllocCore).
      # `internals` added (R34-3/task #522): this row runs the whole
      # `tests/` tree, which reaches `alloc_core`/`global`/`registry` directly.
      - name: test (--features alloc-core)
        if: ${{ !cancelled() }}
        run: cargo test --features "alloc-core internals" --no-fail-fast

  test-xthread:
    name: test (xthread progression)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      # Phases 9–11: per-thread Heap + SeferAlloc + cross-thread free.
      # `internals` added (R34-3/task #522) — same whole-suite rationale.
      - name: test (--features "alloc-global alloc-xthread")
        if: ${{ !cancelled() }}
        run: cargo test --features "alloc-global alloc-xthread internals" --no-fail-fast
      # + Phase 35 M6 decommit.
      - name: test (--features "alloc-global alloc-xthread alloc-decommit")
        if: ${{ !cancelled() }}
        run: cargo test --features "alloc-global alloc-xthread alloc-decommit internals" --no-fail-fast
      # #137: the fastbin (magazine/tcache) path and the flagship
      # `production` bundle were NOT exercised in CI — the entire
      # magazine code path (the churn hot path) ran untested. Cover both:
      # `fastbin` in isolation (magazine without decommit) and the full
      # `production` bundle (fastbin + decommit + everything).
      - name: test (--features "alloc-global alloc-xthread fastbin")
        if: ${{ !cancelled() }}
        run: cargo test --features "alloc-global alloc-xthread fastbin internals" --no-fail-fast
      - name: test (--features production)
        if: ${{ !cancelled() }}
        run: cargo test --features "production internals" --no-fail-fast # #137: the recommended flagship config (fastbin + decommit)

  test-hardened:
    name: test (hardened tier)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      # H1 (#167): the opt-in `hardened` misuse-guard tier. Without this
      # step the interior-pointer guard and its counterfactual regression
      # test (`regression_hardened_interior_ptr`, gated on the feature)
      # would never RUN in CI — clippy's --all-features only compiles
      # it. Also covers the fastbin-without-decommit config with the
      # guard on.
      # `internals` added (R34-3/task #522): `hardened` implies `fastbin`
      # implies `alloc-global`, and this row runs the whole `tests/` tree.
      - name: test (--features hardened)
        if: ${{ !cancelled() }}
        run: cargo test --features "hardened internals" --no-fail-fast
      # H1 follow-up: README calls `hardened` "additive over
      # production", but no CI row built the two together — the
      # paranoid guard tier was only ever exercised WITHOUT decommit
      # (the step above is fastbin-without-decommit). This step is the
      # flagship+paranoid combo so the misuse-guard runs alongside the
      # decommit (M6) recommit cycle.
      - name: test (--features "production hardened")
        if: ${{ !cancelled() }}
        run: cargo test --features "production hardened internals" --no-fail-fast
      # R14 hotfix (task #299): `tests/r11_4_dealloc_batch_hardened_guards.rs`
      # exercises `HeapCore::dealloc_batch`'s hardened guards (F7/H1), which
      # requires `batch-api` directly -- `hardened` alone does not pull it in
      # (confirmed pre-existing: this combination was never covered by any
      # step above, so the file's own `dealloc_batch` calls failed to compile
      # under the plain `--features hardened` step until this file's
      # `#![cfg]` gate was tightened to require `batch-api` too). Without
      # this step the file compiles to 0 tests (pass by absence) under every
      # other row here -- the same "written but never executed" class of gap
      # R13-5 (task #275) closed for other combinations.
      # `internals` added (R34-3/task #522) — same whole-suite rationale.
      - name: test (--features "hardened batch-api")
        if: ${{ !cancelled() }}
        run: cargo test --features "hardened batch-api internals" --no-fail-fast
      # R22-1 (task #352): commit 46ea2db (R19-1, task #337) fixed a real
      # hardened/UAF-shaped contract-violation bug in the Large-dealloc branch
      # (A) of `src/registry/heap_core_free.rs` -- under `hardened`, it now
      # checks `large_layout_consistent(base, layout.size())` before treating a
      # cross-thread Large free as legitimate. Both that branch and its two new
      # regression tests (`promoted_large_matching_free_actually_frees`,
      # `large_ptr_small_layout_free_is_noop_branch_a` in
      # `tests/regression_hardened_large_kind_own_free.rs`) require BOTH
      # `hardened` AND the "promotion-reachable" predicate encoded in the
      # `medium_promotion_reachable!` macro (`heap_core_free.rs`, ~line 97):
      # `medium-classes AND (not(exact-span-large) OR (large-reserved-capacity
      # AND not(numa-aware)))`. No row above satisfies both: none of the three
      # steps in THIS job turn on `medium-classes` at all, so branch (A) does
      # not even compile there; `--all-features` (below, other job) turns on
      # `medium-classes` but ALSO `exact-span-large` AND `numa-aware` together,
      # which makes the predicate false. Plain `hardened medium-classes` (no
      # `exact-span-large`) keeps the predicate's first disjunct
      # (`not(exact-span-large)`) true, so the fix and both tests actually
      # compile AND run here for the first time.
      # `internals` added (R34-3/task #522): `hardened` implies `fastbin`
      # implies `alloc-global`, and this repo's own white-box `tests/`
      # suite reaches `alloc_core`/`global`/`registry` directly.
      - name: test (--features "hardened medium-classes")
        if: ${{ !cancelled() }}
        run: cargo test --features "hardened medium-classes internals" --no-fail-fast

  test-gated-bodies:
    # C2 (bug-hunt review 2026-07-09): the steps below ship tests whose
    # BODIES are gated behind `#[cfg(feature = "...")]`, so NO plain
    # `cargo test` run exercises their behavior — the preprocessor strips
    # the test bodies out entirely otherwise. They were only ever exercised
    # locally via `npm run check` (scripts/check-all.mjs), a pre-push gate,
    # not per-PR CI. These steps run the gated test bodies per-PR:
    #   - alloc-stats: the per-hit counter asserts (stats_reflects_activity)
    #   - pinning: the routing-binding tests in tests/pinning.rs
    # The feature-strings mirror scripts/check-all.mjs verbatim.
    name: test (gated bodies + all-features)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      # R24-6 (task #384): `bench-internals` added so
      # `tests/class_aware_dirty_oom_latch.rs` (which now additionally gates
      # on that feature — see `Cargo.toml`'s `bench-internals` doc) keeps
      # running here instead of silently being skipped by its own `#![cfg]`.
      # `internals` added (R34-3/task #522): this row runs the whole
      # `tests/` tree, which reaches `alloc_core`/`global`/`registry` directly.
      - name: test (--features "production alloc-stats bench-internals")
        if: ${{ !cancelled() }}
        run: cargo test --features "production alloc-stats bench-internals internals" --no-fail-fast
      - name: test (--features pinning)
        if: ${{ !cancelled() }}
        run: cargo test --features pinning --no-fail-fast
      # `--all-features` as the closing step: exercises every gated tier
      # together (adds experimental + hardened + numa-aware on top). The
      # numa_alloc real-mbind assertions are env-guarded
      # (SEFER_NUMA_TEST=1, set ONLY by the scheduled `numa-real-kernel`
      # job) and skip trivially on this single-NUMA runner, so
      # `--all-features` here is a compile+link+run check of the full
      # feature union, not a NUMA correctness gate. Verified green
      # locally under the same conditions.
      - name: test (--all-features)
        if: ${{ !cancelled() }}
        run: cargo test --all-features --no-fail-fast
      # task #1288: `--all-features` above no longer activates numa-shim's mock
      # backend (the `mock` Cargo feature is gone — replaced by the build-time
      # `--cfg numa_shim_mock`), so the six `numa-aware-mock` mock-gated root
      # test files (numa_cache_invalidation, numa_periodic_refresh, the
      # segment_directory_numa* family) SKIP cleanly under it. This row is
      # their dedicated coverage: all features PLUS the cfg flag, which is
      # exactly what the old `--all-features` row ran them under via feature
      # unification. The six grep sentinels (task #1101 pattern; task #1299/T9
      # added the five below beyond the original one) prove the mock files
      # actually RAN — without the cfg this row would be green-and-dead.
      - run: |
          RUSTFLAGS="--cfg numa_shim_mock" cargo test --all-features --no-fail-fast 2>&1 | tee "$RUNNER_TEMP/root-numa-mock.log"
          grep -F "test cached_node_invalidates_across_slot_recycle ... ok" "$RUNNER_TEMP/root-numa-mock.log"
          grep -F "test cached_node_refreshes_after_mid_claim_migration ... ok" "$RUNNER_TEMP/root-numa-mock.log"
          grep -F "test per_node_oracle_holds_after_mixed_node_workload ... ok" "$RUNNER_TEMP/root-numa-mock.log"
          grep -F "test ninth_node_reuses_freed_bucket_after_earlier_node_goes_idle ... ok" "$RUNNER_TEMP/root-numa-mock.log"
          grep -F "test directory_returns_local_not_foreign_for_high_node_ids ... ok" "$RUNNER_TEMP/root-numa-mock.log"
          grep -F "test clear_bit_on_never_registered_node_does_not_claim_a_bucket ... ok" "$RUNNER_TEMP/root-numa-mock.log"
        shell: bash

  test-feature-isolation:
    # R13-5 (task #275, P1): CI only ever tested `production` and
    # `--all-features` (plus the handful of single-feature entries in the
    # jobs above) — narrow opt-in feature COMBINATIONS were never exercised
    # together, so a bug reachable only under one specific combination could
    # mask itself indefinitely. Round 13 confirmed the cost twice:
    #   - task #284: a real lost-wakeup bug in
    #     `class_aware_dirty_routing.rs` that NEVER ran in CI at the time —
    #     the file compiled to 0 tests under `--all-features` because
    #     `--all-features` also turns on `numa-aware`, and the file's
    #     `#![cfg]` gate was `not(feature = "numa-aware")`. R14-8 (task #293)
    #     found that gate's STATED REASON was false ("the class-aware-dirty
    #     drain path is compiled out under NUMA routing" — it is not:
    #     `AllocCore::drain_dirty_segments` is gated only on `alloc-xthread`,
    #     verified empirically by `tests/r14_8_numa_dirty_probe.rs`, which
    #     runs and passes under `production + numa-aware + class-aware-dirty +
    #     alloc-stats` and confirms both the directory sidecar materialises
    #     and the drain executes there; what IS `not(numa-aware)`-gated is a
    #     DIFFERENT, downstream mechanism, the directory-driven LOOKUP fast
    #     path inside `find_segment_with_free_impl`, `alloc_core_small.rs`).
    #     R14-8 therefore DROPPED the `not(numa-aware)` restriction from
    #     `class_aware_dirty_routing.rs` (verified green under
    #     `production + numa-aware + class-aware-dirty + alloc-stats`), so
    #     that file now DOES run under `--all-features` too — this
    #     `test-feature-isolation` job's `production + class-aware-dirty +
    #     alloc-stats` (WITHOUT `numa-aware`) row is no longer this file's
    #     ONLY CI coverage, though it remains a useful narrower-combination
    #     check on its own merits (kept per this job's general rationale
    #     above).
    #   - task #285: a compile error (E0599) in `drain_heap_overflow`
    #     reachable only by combining `alloc-xthread`/`fastbin`/
    #     `alloc-decommit` WITHOUT `alloc-segment-directory` — a combination
    #     `production` never exercises (it always turns both on together) and
    #     `--all-features` never exercises either (it always turns
    #     `alloc-segment-directory` on).
    # Consolidated into ONE job (matching this file's established
    # 2026-07-12 job-count-reduction convention — see the `test-core`/
    # `test-xthread`/etc. job header comments above): each row below is its
    # own `cargo test`/`cargo build` step so a failure in one row's step does
    # NOT skip later rows (`if: ${{ !cancelled() }}`), but all rows share one
    # checkout + toolchain install.
    name: test (feature isolation)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      # R12-3 EXPERIMENTAL: exact-page-rounded Large spans instead of
      # whole-SEGMENT rounding. Additive over `alloc-core`; verified locally
      # green together with `production`.
      # `internals` added (R34-3/task #522) — whole-suite row.
      - name: test (--features "production exact-span-large")
        if: ${{ !cancelled() }}
        run: cargo test --features "production exact-span-large internals" --no-fail-fast
      # R13-5: originally the critical combo that would have caught task
      # #284's lost-wakeup bug. `class-aware-dirty` + `alloc-stats`,
      # explicitly WITHOUT `numa-aware` (`production` does not enable
      # `numa-aware`, so plain `production + class-aware-dirty + alloc-stats`
      # already satisfies the `not(feature = "numa-aware")` gate on
      # `class_aware_dirty_routing.rs` / `r9_6_class_aware_dirty_judge.rs`).
      #
      # R14-10 (task #295) STALENESS NOTE: since R13-9 promoted
      # `class-aware-dirty` INTO `production`, spelling it out here alongside
      # `production` is now a no-op — `production` already contains it, so
      # this step's resolved feature set is BYTE-IDENTICAL to the plain
      # `production alloc-stats` row in the `test (gated bodies +
      # all-features)` job above (verified: set union is idempotent, neither
      # row adds anything the other lacks). This IS the exact class of stale
      # CI row `cargo hack check --feature-powerset` would have flagged
      # structurally (see CLAUDE.md's "cargo-hack feature-powerset CI"
      # evaluation note, and the `feature-powerset` job at the bottom of this
      # file) rather than needing a human to notice a promotion made a
      # feature string redundant. Kept as a single-token
      # `production alloc-stats` step for continuity with its own commit
      # history/comment trail rather than deleted outright; the explicit
      # `class-aware-dirty` token was dropped so this step no longer reads as
      # testing something `production alloc-stats` does not already cover.
      #
      # R14 hotfix (task #299): the `--skip
      # r9_6_class_aware_dirty_waste_ratio_scales_with_class_count` flag this
      # step used to carry is gone -- that test function is now compiled out
      # under `#[cfg(not(feature = "class-aware-dirty"))]` directly (see the
      # test file's own comment), because a per-step `--skip` only covers
      # THIS step: once R13-9 promoted `class-aware-dirty` into `production`,
      # every OTHER step that tests plain `production`/`--all-features` also
      # started tripping the same expected failure, and none of them carried
      # the skip. The equivalent measurement WITH the feature on is
      # `class_aware_dirty_routing.rs::wasted_dirty_drains_stays_low_under_class_aware_routing`,
      # which DOES run in this step.
      # R24-6 (task #384): `bench-internals` added for the same reason as the
      # sibling step above — keeps `class_aware_dirty_oom_latch.rs` running.
      # `internals` added (R34-3/task #522) — whole-suite row.
      - name: test (--features "production alloc-stats bench-internals" — feature-isolation copy)
        if: ${{ !cancelled() }}
        run: cargo test --features "production alloc-stats bench-internals internals" --no-fail-fast
      # R13-3: virgin-zero-skip through the magazine + the drain-prelude fix
      # (task #273/#285's sibling defect). `alloc-stats` for the
      # `SMALL_ZERO_PASS_CALLS` skip-fired oracle in
      # `r13_3_magazine_virgin_hit_skips_zero.rs`.
      # `internals` added (R34-3/task #522) — whole-suite row.
      - name: test (--features "production virgin-zero-skip alloc-stats bench-internals")
        if: ${{ !cancelled() }}
        run: cargo test --features "production virgin-zero-skip alloc-stats bench-internals internals" --no-fail-fast
      # R12-11: PageMap diagnostic write sites. Additive over `alloc-core`;
      # exercises the 4 test files whose class-mismatch oracles need the
      # PageMap actually maintained to compare against.
      - name: test (--features "alloc-core page-map-diag")
        if: ${{ !cancelled() }}
        run: >-
          cargo test --features "alloc-core page-map-diag" --no-fail-fast
          --test phase13_3_dealloc_layout_class
          --test phase13_drain_reclaim_layout_class
          --test regression_carve_batch
          --test medium_classes_correctness
      # R13-3/#285 follow-up finding (task #285): `alloc-xthread`, `fastbin`,
      # `alloc-decommit` WITHOUT `alloc-segment-directory` — `production`
      # always turns both `alloc-segment-directory` and these three on
      # together, so this specific "xthread stack without the directory"
      # combination was NEVER built in CI before, and is exactly the
      # combination that hid the `drain_heap_overflow` E0599 compile error
      # fixed by commit e7617d1 (R13-12, task #285). Build-only (per the
      # task brief): this combination has near-zero dedicated test coverage
      # of its own beyond what `test-xthread`'s narrower rows already run,
      # so a compile check is the target regression gate, not a full test
      # run.
      - name: build (--features "alloc-global alloc-xthread fastbin alloc-decommit")
        if: ${{ !cancelled() }}
        run: cargo build --features "alloc-global alloc-xthread fastbin alloc-decommit"
      # R16-1 (task #311, P1): R15-3 (task #305, commit 4de4ef2) added a
      # compile-time `#[cfg]` gate around `try_promote_to_large`
      # (`src/registry/heap_core_free.rs`) that splits the Small/medium ->
      # Large realloc promotion (R14-4/task #289, the largest Round 14 perf
      # item) into two MUTUALLY EXCLUSIVE compiled behaviours depending on
      # whether the build has grow headroom past a promoted block's committed
      # span. Neither behaviour was ever exercised per-PR: no row in this job
      # (or anywhere else in the `test`/`test-*` jobs) turns on
      # `medium-classes` at all, so `try_promote_to_large` and its call site
      # never compiled, let alone ran, outside the weekly, test-free
      # `cargo-hack --feature-powerset check` job. This is the same class of
      # gap R13-12/#285 already caught once: a real behaviour gated behind a
      # feature COMBINATION no CI row happens to build. Two rows below cover
      # both sides of the R15-3 split:
      #   - `production medium-classes` (no `exact-span-large`): SEGMENT
      #     rounding gives headroom by construction, so `HAS_PROMOTION` is
      #     `true` here — promotion compiles in and fires. Exercises
      #     `second_grow_past_threshold_hits_opt_g_no_move` /
      #     `repeated_post_promotion_grows_all_hit_opt_g` in
      #     `tests/r14_4_promotion_move_leg_reduction.rs`, which previously
      #     skipped their own bodies in EVERY CI configuration (their
      #     `if !HAS_PROMOTION { return; }` guard always tripped).
      #   - `production medium-classes exact-span-large` (no
      #     `large-reserved-capacity`, no `numa-aware`): zero-headroom
      #     combination, `HAS_PROMOTION` is `false` — R15-3's gate compiles
      #     `try_promote_to_large` OUT entirely, and growth instead takes the
      #     ordinary medium-ladder move-leg/OPT-F path. Exercises the R15-3
      #     `promotion_off_*` tests in the same file plus
      #     `tests/r14_4_promotion_feature_off_non_disturbance.rs`'s
      #     `HAS_LARGE_GROW_HEADROOM`-gated assertions.
      # `--test`-filtered (narrow), matching this job's established style for
      # rows whose target is a specific mechanism rather than a broad
      # feature-union smoke check (see the `page-map-diag` row above).
      # `internals` added (R34-3/task #522): the test file itself reaches
      # `sefer_alloc::registry::HeapCore` directly.
      - name: test (--features "production medium-classes")
        if: ${{ !cancelled() }}
        run: cargo test --features "production medium-classes internals" --test r14_4_promotion_move_leg_reduction --no-fail-fast
      # `internals` added (R34-3/task #522):
      # `r14_4_promotion_move_leg_reduction.rs` reaches
      # `sefer_alloc::registry::HeapCore` directly.
      - name: test (--features "production medium-classes exact-span-large")
        if: ${{ !cancelled() }}
        run: >-
          cargo test --features "production medium-classes exact-span-large internals" --no-fail-fast
          --test r14_4_promotion_move_leg_reduction
          --test r14_4_promotion_feature_off_non_disturbance
      # R29-14 (P2, sourced from the 2026-07-29 "oh-acceleration-code-project"
      # readonly review, §3.3): post-#1288 `--all-features` no longer forces anything
      # in numa-shim (the mock is a `--cfg numa_shim_mock` build flag; `numa-aware-mock`
      # no longer forwards to it), so the real (non-mock) cfg arm is what
      # `--all-features` compiles everywhere. The shim crate itself IS tested on real
      # kernels per-PR (`numa-shim-windows`/`numa-shim-macos`, `-p numa-shim`
      # without `mock`), but that covers only the shim IN ISOLATION — not
      # whether `sefer-alloc` built with `numa-aware` and WITHOUT
      # `numa-aware-mock` still compiles/links against it (the actual
      # integration surface: `src/alloc_core/numa.rs`'s thin wrapper calling
      # into the shim's real functions). The only job that builds this
      # combination is `numa-real-kernel` below, gated to `schedule`/
      # `workflow_dispatch` (weekly) — a signature drift in e.g.
      # `reserve_aligned_on_node` would surface at worst a week later, not on
      # the introducing PR. A single check-only step closes that per-PR gap
      # cheaply: `cargo check` typechecks the real (non-mock) cfg arm without
      # needing NUMA-capable hardware to execute it (confirmed via `cargo
      # metadata --features "production numa-aware"`: `numa-shim`'s resolved
      # feature set is `["default", "vmem-integration"]` — `mock` is absent,
      # and the cfg cannot be set by features at all). Folded into this
      # job (not a new one) because it is already the home for narrow
      # feature-COMBINATION checks on `ubuntu-latest`, including one
      # build-only row just above (`build (--features "alloc-global
      # alloc-xthread fastbin alloc-decommit")`) for exactly the same
      # "compiles under no existing row" reason.
      - name: check (--features "production numa-aware")
        if: ${{ !cancelled() }}
        run: cargo check --features "production numa-aware"

  test-windows:
    # Windows is the primary dev OS, yet only the numa-shim real-syscall path
    # ran on a Windows kernel in CI — the ALLOCATOR itself (the aligned-vmem
    # VirtualAlloc / MEM_DECOMMIT reserve/commit/decommit path) was only ever
    # tested locally. Run the flagship `production` bundle on real Windows so a
    # regression in the Windows vmem backend is caught per-PR. Kept minimal:
    # checkout, stable toolchain, the two test runs.
    name: test windows (production)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      # `internals` added (R34-3/task #522) — whole-suite row.
      - run: cargo test --features "production internals" --no-fail-fast
      # Task #1086 (M6): each forced-page row is now self-verifying —
      # without the grep, a typo'd RUSTFLAGS cfg name (e.g. `--cfg
      # aligned_vmem_page_size_overide`) silently compiles the forced
      # module OUT and the row still passes green on the file's ungated
      # pure tests (exit 0 with 1-2 tests), the same vacuous-green class
      # the local gate's expectWork/expectTest assertions exist for (tasks
      # #1071/#1086). `bash -eo pipefail` (the Actions default when
      # `shell: bash` is set) fails the step if cargo fails even through
      # the tee pipe; the grep then fails it unless the forced test's name
      # appears in the harness output.
      #
      # Task #1099/I4 (2026-08-18): the `$RUNNER_TEMP/<name>.log` path in
      # these three rows is a mixed-separator Windows path
      # (`D:\a\_temp/x.log`) handed to MSYS tee/grep under Actions'
      # `shell: bash` (Git-for-Windows bash). Originally recorded here as
      # UNVERIFIED on a real windows runner (the rows and the note landed
      # in the same wave). VERIFIED since (task #1352, item 115's P2-2,
      # 2026-08-25): CI run 32828560947 (green, landing SHA 774716e), this
      # job (`test windows (production)`, job id 97741909197, conclusion
      # success) executed exactly this pattern — the raw job log shows the
      # tee command under `C:\Program Files\Git\bin\bash.EXE`, the tee'd
      # cargo output, AND grep's own stdout echoing the found sentinel
      # line, proving tee wrote and grep read the mixed-separator path on
      # a real windows-latest runner. The same construction is used by the
      # numa-shim-windows job's mock sentinel rows (task #1299/T8), which
      # this receipt covers by identity of pattern/runner/shell; the
      # failure mode if anything ever differs remains LOUD (a red step
      # with grep/tee's "No such file" naming the path), not a silent
      # green.
      - run: |
          cargo test --features "production small-segment-lazy-commit internals" --test lazy_initial_commit_forced_page 2>&1 | tee "$RUNNER_TEMP/forced-page-lazy.log"
          grep -F "test forced_page::lazy_initial_commit_call_sites_survive_a_forced_64k_page ... ok" "$RUNNER_TEMP/forced-page-lazy.log"
        shell: bash
        env:
          RUSTFLAGS: "--cfg aligned_vmem_page_size_override"
      # Task #1081: the decomp-hook forced-page regression — drives the REAL
      # R29-3 decommit/recommit hooks under simulated 16/64 KiB runtime pages
      # (same override seam as the row above; the F6 small_meta_end()
      # boundary violation is invisible on 4 KiB hosts by construction).
      # Same task #1086 self-verifying shape as the row above.
      - run: |
          cargo test --features "production internals bench-internals" --test decomp_hooks_forced_page 2>&1 | tee "$RUNNER_TEMP/forced-page-decomp.log"
          grep -F "test forced_page::decomp_hooks_decommit_recommit_page_aligned_under_forced_pages ... ok" "$RUNNER_TEMP/forced-page-decomp.log"
        shell: bash
        env:
          RUSTFLAGS: "--cfg aligned_vmem_page_size_override"
      # Task #1087: the segment-state reconciliation oracle
      # (tests/segment_state_reconciliation_oracle.rs) — two rows mirroring
      # the two verified invocation shapes: the LAZY arm on the host's real
      # page (no RUSTFLAGS), and the FORCED-page arm through the same
      # override seam as the rows above. Both carry the grep assertion:
      # that file deliberately compiles ZERO tests in the (no-override,
      # no-lazy) combination, so a dropped feature or a typo'd cfg would
      # otherwise pass green on an empty binary.
      - run: |
          cargo test --features "production internals bench-internals small-segment-lazy-commit" --test segment_state_reconciliation_oracle 2>&1 | tee "$RUNNER_TEMP/reconciliation-lazy.log"
          grep -F "test retain_decommitted_retained_meta_bytes_oracle_lazy_real_page ... ok" "$RUNNER_TEMP/reconciliation-lazy.log"
        shell: bash
      - run: |
          cargo test --features "production internals bench-internals" --test segment_state_reconciliation_oracle 2>&1 | tee "$RUNNER_TEMP/reconciliation-forced.log"
          grep -F "test retain_decommitted_retained_meta_bytes_oracle_forced_pages ... ok" "$RUNNER_TEMP/reconciliation-forced.log"
        shell: bash
        env:
          RUSTFLAGS: "--cfg aligned_vmem_page_size_override"
      # The magazine-in-isolation config (fastbin without decommit) exercises the
      # commit-only Windows vmem path (no MEM_DECOMMIT), complementing the
      # production run above.
      - run: cargo test --features "alloc-global alloc-xthread fastbin internals" --no-fail-fast
      # R13-5 (task #275): `large-reserved-capacity`'s whole benefit
      # (deferred-commit reserved-capacity in-place `realloc` growth via
      # `aligned_vmem::commit_range`) is documented as a "Windows-gated
      # EFFECT" (see the feature's Cargo.toml doc comment) — the incremental
      # `VirtualAlloc(MEM_COMMIT)` commit-range path only has real teeth on
      # Windows (Unix/miri backends already commit the whole reservation
      # eagerly). This feature was never run on a real Windows kernel in CI
      # before. Requires `exact-span-large` transitively (Cargo feature
      # dependency).
      - run: cargo test --features "production exact-span-large large-reserved-capacity internals" --no-fail-fast
      # Task #858/F2: aligned-vmem crate Windows test coverage for the REAL
      # backend (VirtualAlloc/MEM_COMMIT/MEM_DECOMMIT) on real Windows hardware.
      # NOTE: historically this explicit list had to EXCLUDE `mock` — a
      # non-additive backend-replacing feature, so `--all-features` turned it
      # on and tested the mock recording stub instead of the real Windows
      # backend. Since task #962 `mock` is not a Cargo feature at all (it is
      # the --cfg aligned_vmem_mock build flag), so `--all-features` and this
      # list both build the REAL backend; the explicit list is kept as the
      # documented form. The mock-cfg row below covers the mock backend.
      - run: cargo test -p aligned-vmem --features "lazy-commit huge-pages fault-injection bench-internals" --no-fail-fast
      # Task #858/F2: aligned-vmem crate mock coverage. Tests the mock recording
      # backend itself (NOT the real VirtualAlloc/MEM_DECOMMIT backend) with all
      # optional features enabled. This is the only row that runs tests/mock.rs.
      # Since task #962 the mock backend is enabled via the build-time
      # --cfg aligned_vmem_mock flag (RUSTFLAGS), not --all-features (which can
      # no longer reach it).
      # Task #1101: tee + grep postcondition (task #1086 shape) — both mock
      # test FILES compile to zero tests on a typo'd cfg with exit 0, so the
      # greps require one named test per file. The same task #1099/I4
      # mixed-separator caveat that covers the forced-page rows' $RUNNER_TEMP
      # paths above applies to this row's log path unchanged.
      - run: |
          cargo test -p aligned-vmem --features "lazy-commit huge-pages fault-injection bench-internals" --no-fail-fast 2>&1 | tee "$RUNNER_TEMP/vmem-mock-debug.log"
          grep -F "test records_reserve_and_decommit ... ok" "$RUNNER_TEMP/vmem-mock-debug.log"
          grep -F "test reentrancy_is_silently_dropped_with_outer_record_intact ... ok" "$RUNNER_TEMP/vmem-mock-debug.log"
        shell: bash
        env:
          RUSTFLAGS: "--cfg aligned_vmem_mock"

  test-macos:
    # macOS runners are real Darwin, so the aligned-vmem `madvise(MADV_DONTNEED)`
