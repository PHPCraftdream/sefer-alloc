  multi-arch:
    needs: changes
    if: needs.changes.outputs.os == 'true'
    name: test (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            use_cross: false
          - target: aarch64-unknown-linux-gnu
            use_cross: true
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install cross
        if: ${{ matrix.use_cross }}
        uses: taiki-e/install-action@v2
        with:
          tool: cross
      - name: Run tests (native)
        if: ${{ !matrix.use_cross }}
        run: cargo test --target ${{ matrix.target }} --features experimental
      - name: Run cross-thread tests (native)
        if: ${{ !matrix.use_cross }}
        run: cargo test --target ${{ matrix.target }} --features "alloc-global alloc-xthread internals"
      - name: Run cross-thread + decommit tests (native)
        if: ${{ !matrix.use_cross }}
        run: cargo test --target ${{ matrix.target }} --features "alloc-global alloc-xthread alloc-decommit internals"
      - name: Run tests (cross)
        if: ${{ matrix.use_cross }}
        run: cross test --target ${{ matrix.target }} --features experimental
      - name: Run cross-thread tests (cross)
        if: ${{ matrix.use_cross }}
        run: cross test --target ${{ matrix.target }} --features "alloc-global alloc-xthread internals"
      - name: Run cross-thread + decommit tests (cross)
        if: ${{ matrix.use_cross }}
        run: cross test --target ${{ matrix.target }} --features "alloc-global alloc-xthread alloc-decommit internals"
      - name: Run production tests (cross)
        if: ${{ matrix.use_cross }}
        run: cross test --target ${{ matrix.target }} --features "production internals"

