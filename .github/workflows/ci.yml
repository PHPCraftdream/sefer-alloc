  tagged-index-stack-gates:
    # tagged-index-stack review (Sol-codex, run 3, P3-5, task tis-sc3-Group3
    # #1773): every other standalone crate with its own package-gates job
    # (sefer-region, aligned-vmem, once-ptr-cell, size-classes) has one that
    # actually packages/publish-dry-runs the crate on every PR;
    # tagged-index-stack did not, so a tarball-content,
    # manifest-normalization, or packaged-dependency-resolution regression
    # would surface for the first time at tag/release time instead of here.
    # This crate's clippy/rustdoc/test rows already live in the big
    # test-workspace job below — not duplicated here, same convention the
    # size-classes job immediately above states. No `cargo semver-checks
    # check-release` step: the crate has never been published (crates.io 404
    # per the 2026-08-30 session checkpoint; task #661's first-publish
    # decision is still pending), so there is no crates.io baseline to diff
    # against yet — add that step once the first
    # `cargo publish -p tagged-index-stack` has actually landed.
    name: tagged-index-stack package gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      # Packaging verification only, per the finding: confirms the crate
      # packages and the packaged tarball's own isolated build succeeds
      # against the published manifest (no reliance on workspace-inherited
      # lints/deps that would not exist for a real crates.io consumer).
      - run: cargo publish --dry-run -p tagged-index-stack
      # P2-1 (round-10 @oh review): the `cargo publish --dry-run` step above
      # builds the lib target ONLY — it never runs the PACKAGED test suite,
      # which is exactly how the P2-1 regression shipped. Counts in the next
      # sentence are HISTORICAL — the tree as of that round-10 regression,
      # not today (fixture crates have been added since, and the driver test
      # files were later consolidated into one): cargo auto-excludes every
      # directory containing its own Cargo.toml, so the then-four
      # compile-fail fixture crates under tests/compile_fail/ silently
      # dropped out of the .crate while their then-three driver test files
      # shipped, and `cargo test` inside the downloaded package failed three
      # test binaries on fixture-manifest panics. Today the same auto-exclude
      # covers every fixture crate under tests/compile_fail/ (count drifts —
      # re-derive with `ls tests/compile_fail/ | wc -l`, never hardcode it
      # here), and the single consolidated driver file tests/compile_fail.rs
      # ships — with its shared helper under tests/common/ — implementing the
      # skip-when-fixture-absent guard. This step reproduces the review's
      # repro end-to-end against whatever the tree actually contains —
      # package, extract, run the packaged suite under an isolated
      # CARGO_TARGET_DIR — and any packaged-test failure fails this step.
      # `--no-verify` avoids a redundant lib build: the publish --dry-run
      # above already verifies the packaged lib, and the extracted
      # `cargo test` below builds it again for the dev profile.
      - name: run the packaged .crate test suite (default + test-internals) + build the packaged bench (P2-1/P4-7/P3 regression gate)
        run: |
          cargo package -p tagged-index-stack --no-verify
          crate_file=$(ls target/package/tagged-index-stack-*.crate)
          extract_dir=$(mktemp -d)
          tar xzf "$crate_file" -C "$extract_dir"
          cd "$extract_dir"/tagged-index-stack-*/
          CARGO_TARGET_DIR="$extract_dir/pkg-test-target" cargo test
          # P3 (Sol-codex review run 10,
          # docs/reviews/2026-09-03-084348-tagged-index-stack-review-Sol-codex-run-10.md):
          # the plain `cargo test` above only proves the packaged .crate's
          # DEFAULT-feature test surface survives `cargo package`'s file-
          # inclusion rules. The workspace's whole-feature-row test
          # (ci.yml, run-9's fix) already proves the SOURCE tree's
          # test-internals-gated tests run, but nothing proved the gated
          # test files themselves (e.g. tag_seal.rs) actually ship inside
          # the .crate — a packaging change could silently drop them while
          # this gate stayed green. Same extraction, same isolated target
          # dir, re-run with the feature on.
          CARGO_TARGET_DIR="$extract_dir/pkg-test-target" cargo test --features test-internals
          # P4-7 (round-11 @oh review): plain `cargo test` never builds the
          # bench target (`[[bench]] test = false`, and no --benches), so a
          # packaged-bench regression — a dev-dependency that does not survive
          # packaging, a lost file — would surface only after publication.
          # Build it without running it, in the same extraction and target dir.
          CARGO_TARGET_DIR="$extract_dir/pkg-test-target" cargo bench --no-run
      # P2-2 (Sol-codex review run 8, task tis-sol8-GroupC,
      # docs/reviews/2026-09-02-180547-tagged-index-stack-review-Sol-codex-run-8.md):
      # the P3-1/P3-2 weak-memory wall-clock A/B harness template
      # (crates/tagged-index-stack/scripts/tis_p3_ab/harness_bin.rs) went a
      # full round undetected after `3e83b1c` turned `push`/`push_index`
      # into `unsafe fn`, because its only consumer
      # (`tis-weak-memory-wallclock-gate` below) is `workflow_dispatch`-only
      # and nothing in the regular per-PR/push path ever built it. This step
      # is that missing regular-CI signal: `--mode build-check` materializes
      # the SAME template against the CURRENT src/{lib,imp}.rs through the
      # real driver's own materialization path (not a hand-rolled duplicate
      # check that could itself drift) and runs a plain `cargo build` — no
      # timing, no docs/perf artifacts, just proof the template still
      # compiles. No node setup step needed: same as
      # `tis-weak-memory-wallclock-gate` below, ubuntu-latest ships Node.
      - name: A/B wall-clock harness template still compiles (static gate)
        run: node crates/tagged-index-stack/scripts/tis_p3_ab_runner.mjs --mode build-check

  once-ptr-cell-miri:
    # Publication readiness review cycle 2 (claude/oh), F3, task #1375: this
    # crate's central soundness argument is a provenance one (a sentinel built
    # via without_provenance_mut, never dereferenced; three
    # NonNull::new_unchecked sites) and had NO miri row anywhere in CI. Both
    # forms are green today (~1.2 s) and were verified locally before adding
    # this job. Modeled on `aligned-vmem-miri` immediately above: per-PR
    # cadence, since the suite is small enough that miri's overhead is
    # affordable on every PR; no leak/isolation flags needed (the crate leaks
    # its published pointer by design, but tests reclaim via
    # Box::from_raw, not core::mem::forget).
    name: once-ptr-cell under miri (interpreter, strict-provenance included)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - run: cargo miri test -p once-ptr-cell
      - run: cargo miri test -p once-ptr-cell
        env:
          MIRIFLAGS: "-Zmiri-strict-provenance"

  clippy:
    # R30-5 (task #454): this job's 6 clippy rows (default / experimental /
    # --all-features / hardened medium-classes / production / production
    # internals, the last added by R34-3/task #522) are transcribed
    # BY HAND from `scripts/check-matrix.mjs`'s `PER_PR_ROWS` — the single
    # source of truth also consumed by `scripts/run-check-matrix.mjs` (which
    # `scripts/check-all.mjs`'s local `npm run check` runs as one of its
    # steps, so local `check`/`test` rows and CI's `check-matrix` job below
    # execute byte-identical argv from the same manifest — see that
    # manifest's header comment). Edit the feature combinations in the
    # manifest, then keep this job's steps transcribed identically to it.
    #
    # This job's steps stay hand-listed (not `node scripts/run-check-matrix.mjs
    # --kind clippy` or similar) rather than collapsed into a single script
    # invocation, so each feature combination still gets its OWN named CI
    # step in the Actions UI (a red step's name tells you the failing
    # combination at a glance, same UX this job has always had).
    #
    # R31-11 (task #475): the `check-matrix` job below does NOT enforce that
    # this job's transcription stays correct — its own
    # `--kind check --kind test` filter EXCLUDES every `clippy`-kind manifest
    # row by construction (see `run-check-matrix.mjs`'s `--kind` handling), so
    # a drift here was previously uncaught by anything in CI or `tests/`
    # (flagged by two independent reviews:
    # `docs/reviews/2026-07-30-r30-post-response-readonly-review.md`'s "P2 —
    # generated CI matrix is not yet the only source of truth" and
    # `docs/reviews/2026-07-30-r30-full-review.md` P2-7 /
    # `docs/perf/OPEN_ITEMS.md` item 31). The actual enforcement is
    # `tests/ci_clippy_matrix_consistency.rs`, a plain `cargo test` that reads
    # both this job's steps and the manifest's clippy rows as text and fails
    # if they diverge in count, order, or feature string — it runs on every
    # `cargo test` invocation (including `npm run check` and every CI `test-*`
    # job), so a stale transcription here now fails fast without needing a
    # dedicated CI job of its own.
    #
    # Consolidated (2026-07-12, CI job-count reduction) from 3 matrix jobs
    # into sequential steps in one job. Each matrix entry paid its own
    # checkout + toolchain install for a lint pass that runs in well under a
    # minute — fixed per-job overhead was tripled for no parallelism benefit
    # clippy needs. This does not reduce total CI work, only how many
    # CONCURRENT jobs it costs against the account's job-concurrency ceiling
    # (see the `loom`/`miri`/`miri-plain` jobs below, consolidated the same
    # way, for the jobs that actually moved the needle).
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # Default clippy lints — correctness gate. Pedantic was an aspirational
      # policy that produces noise out of proportion to value as a blocking
      # CI gate; keep it as an opt-in `cargo clippy -- -W clippy::pedantic`
      # for periodic cleanup, not as a per-PR blocker.
      - name: clippy ()
        run: cargo clippy --all-targets -- -D warnings
      - name: clippy (--features experimental)
        run: cargo clippy --all-targets --features experimental -- -D warnings
      - name: clippy (--all-features)
        run: cargo clippy --all-targets --all-features -- -D warnings
      # R23-5 (task #374): `hardened medium-classes` was covered by `cargo
      # test` since R22-1 (task #352) but NOT by a `clippy -D warnings` row —
      # 11 pre-existing dead-code lints (predicate mismatches between an
      # item's own `#[cfg]` and its only caller's, e.g. `alloc-decommit`-only
      # consumers of `alloc-xthread`-gated items) were stable across 3+
      # rounds under this exact combination, tracked in
      # `docs/CORRECTNESS_OPEN_ITEMS.md` item 2 until fixed and closed here.
      # `internals` added (R34-3/task #522): `hardened` implies `fastbin`
      # implies `alloc-global`, and `--all-targets` here reaches this repo's
      # own white-box `tests/` suite.
      - name: clippy (--features "hardened medium-classes")
        run: cargo clippy --all-targets --features "hardened medium-classes internals" -- -D warnings
      # R30-5 (task #454): plain `production` — the actual shipping default
      # most users build with — was in NONE of the rows above before this
      # task. R29-4/task #435's `SegmentStateAccount`/
      # `SegmentStateReconciliation` dead-code combo was reachable exactly
      # here (narrower than `--all-features`, which also turns on the
      # `bench-internals`-gated consumer; wider than the default-features
      # row) and shipped undetected for a full round because no row built
      # this exact string.
      #
      # R34-3 (task #522, finding B1): `--lib` (not `--all-targets`) — the
      # `alloc_core`/`global`/`registry` module paths moved behind the new
      # `internals` feature (additive over `alloc-core`/`alloc-global`, NOT
      # implied by `production`), and this repo's own white-box `tests/`
      # suite (~106 files reaching those module paths directly; `tests/`
      # files are NOT `[[test]]` Cargo.toml targets, so they cannot carry
      # their own `required-features`) does not compile without it.
      # `--all-targets` would fail this row for a reason unrelated to what
      # it checks: whether the LIBRARY — the actual artifact a downstream
      # `production`-only consumer builds — compiles clean. See the next
      # step for `--all-targets` coverage of this repo's own dev suite.
      - name: clippy (--features "production")
        run: cargo clippy --lib --features "production" -- -D warnings
      # R34-3 (task #522, finding B1): `--all-targets` companion to the row
      # above, with `internals` added so this repo's own `tests/`/
      # `benches/`/`examples/` (the white-box suite that reaches
      # `alloc_core`/`global`/`registry` directly) actually compile.
      - name: clippy (--features "production internals")
        run: cargo clippy --all-targets --features "production internals" -- -D warnings

  check-matrix:
    # R30-5 (task #454): runs the NON-clippy rows of `scripts/check-matrix.mjs`'s
    # `PER_PR_ROWS` manifest via the shared `scripts/run-check-matrix.mjs`
    # runner (the SAME script `scripts/check-all.mjs`'s local `npm run check`
    # invokes as one of its steps, so local and CI execute byte-identical
    # argv from the same manifest). Deliberately `--kind check --kind test`
    # here, not the full manifest — the `clippy` job above already runs all 6
    # clippy rows as named per-step Actions-UI entries (including the new
    # `production` row this task added, plus the later `production internals`
    # row from R34-3/task #522), so running them AGAIN here would
    # double CI minutes on the same 6 combinations for zero additional
    # coverage (R31-11/task #475: that hand-transcription is checked instead
    # by `tests/ci_clippy_matrix_consistency.rs`, not by this job — see the
    # `clippy` job's own header comment). This job is therefore currently
    # the rows that have no other per-PR CI home: `cargo check --bench
    # perf_gate_iai --features "production bench-internals"` (R30-5;
    # scripts/iai.mjs's own DEFAULT_FEATURES and `npm run check`'s LAST step
    # — was never its own CI row before this task; its absence is exactly
    # how R29-16's 4x E0433 shipped undetected for a full round), and
    # `cargo test --test r34_3_internals_boundary_api --features "alloc-core
    # alloc-global alloc-decommit"` (R34 review F1: the `internals` boundary
    # guard must run WITHOUT `internals` to be non-vacuous). If
    # a future round adds a non-clippy `PER_PR_ROWS` entry, it lands here
    # automatically with no ci.yml edit needed — that is the whole point of
    # the `--kind check --kind test` filter (see `scripts/run-check-matrix.mjs
    # --help` / its own `--kind` handling).
    #
    # A GitHub Actions `strategy: matrix:` was considered and rejected in
    # favor of "a CI step that runs a script which reads the manifest and
    # executes each check in a loop" (the task brief's other sanctioned
    # option) — the manifest mixes clippy/check/test kinds and a
    # --bench-scoped row alongside whole-crate rows, which does not map
    # cleanly onto a YAML `matrix:` without a second hand-maintained JSON
    # `include:` list — exactly the duplication this task exists to remove.
    #
    # Node is needed only to run the .mjs runner itself; every actual check
    # it performs is a `cargo` invocation. `PER_PR_ROWS` is deliberately
    # small (6 rows at the time this job was added: 5 clippy + 1 check) —
    # see CLAUDE.md's "cargo-hack feature-powerset CI" section for why an
    # exhaustive sweep belongs in the WEEKLY `feature-powerset` job below,
    # not here.
    name: check-matrix (manifest-driven, non-clippy rows)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: node scripts/run-check-matrix.mjs --kind check --kind test
      # R30-5: the generated "feature ABSENT" compile-check enumeration for
      # every conditionally-registered iai arm in benches/perf_gate_iai.rs —
      # the mechanical, automatic form of the stub rule R29-16 violated by
      # omission (see scripts/verify-perf-gate-stubs.mjs's header). This is a
      # pure text-scan of the bench source (no cargo invocation), so it runs
      # in well under a second — folded into this job rather than a separate
      # one to avoid another checkout+toolchain for a sub-second check.
      - run: node scripts/verify-perf-gate-stubs.mjs
      # R31-5a (task #480): structural checks over every docs/perf/R*_*.md
      # gate report — companion summary CSV cited actually exists, its
      # commit/SHA field(s) are a real 40-hex SHA and not a prose
      # placeholder (the exact defect class R30-6's placeholder and R29-13's
      # invalid 63-char hash both were), and every cited `_raw_*.log`
      # filename actually exists on disk (see scripts/verify-gate-report.mjs's
      # header). Also a pure text/regex scan (no cargo invocation) — folded
      # in next to verify-perf-gate-stubs for the same reason.
      - run: node scripts/verify-gate-report.mjs
      # Task #1131: the Linux/Android doc-drift pairing guard (created in
      # the M1/task-#1105 wave; sibling of the vmem-doc-drift-guard step in
      # scripts/check-all.mjs, which runs it locally). Pure text scan (no
      # cargo invocation), sub-second — folded in next to the two text
      # scans above for the same reason. This row is what gives the guard
      # CI coverage: check-all.mjs is the LOCAL pre-push gate and is NOT
      # invoked by any job in this workflow (every "check-all" mention
      # above is a comment), so the local step alone would cover only
      # pushes whose author ran `npm run check`. That coverage is
      # conditional in the ordinary fail-fast way, shared with its sibling
