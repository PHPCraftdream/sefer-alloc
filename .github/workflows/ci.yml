name: CI


on:
  push:
    branches: [main]
  pull_request:
    branches: [main, j13b-vm-verified-20261108]
  schedule:
    - cron: '0 6 * * 1'   # weekly Monday 06:00 UTC: full tier + numa-real-kernel, fuzz-run, feature-powerset
    - cron: '0 3 * * *'   # nightly 03:00 UTC: full tier of the regular jobs (docs/CI_TIERS.md)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    name: plan (which job groups this change needs)
    runs-on: ubuntu-latest
    outputs:
      always: ${{ steps.plan.outputs.always }}
      fast: ${{ steps.plan.outputs.fast }}
      seam: ${{ steps.plan.outputs.seam }}
      os: ${{ steps.plan.outputs.os }}
      full: ${{ steps.plan.outputs.full }}
      crate_aligned_vmem: ${{ steps.plan.outputs.crate_aligned_vmem }}
      crate_globalalloc_model: ${{ steps.plan.outputs.crate_globalalloc_model }}
      crate_numa_shim: ${{ steps.plan.outputs.crate_numa_shim }}
      crate_once_ptr_cell: ${{ steps.plan.outputs.crate_once_ptr_cell }}
      crate_proc: ${{ steps.plan.outputs.crate_proc }}
      crate_sefer_region: ${{ steps.plan.outputs.crate_sefer_region }}
      crate_size_classes: ${{ steps.plan.outputs.crate_size_classes }}
      crate_tagged_index_stack: ${{ steps.plan.outputs.crate_tagged_index_stack }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Self-test the planner
        run: node scripts/ci-plan.mjs --selftest
      - name: Plan
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: node scripts/ci-plan.mjs --event "$EVENT" --base "$BASE" --head "$HEAD_SHA"

  j13b-judge-preparation:
    name: J13b judge preparation (schema + workload contract)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/ci-j13b-judge-preparation

  select-tests:
    needs: changes
    if: needs.changes.outputs.fast == 'true'
    name: select tests (diff + test-impact map)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: node scripts/select-tests.mjs --selftest
      - name: Select
        env:
          GH_TOKEN: ${{ github.token }}
          FULL: ${{ needs.changes.outputs.full }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          fallback() { printf '{"mode":"all","reason":"%s","total":0}\n' "$1" > selection.json; }
          run_id=$(gh run list --workflow test-impact-map.yml --branch main --status success --limit 1 --json databaseId -q '.[0].databaseId' || true)
          if [ -z "$run_id" ]; then fallback "no successful test-impact-map run on main"; exit 0; fi
          gh run download "$run_id" --pattern 'test-impact-map-*' --dir maps || { fallback "map download failed"; exit 0; }
          full=""; [ "$FULL" = true ] && full="--full"
          node scripts/select-tests.mjs select --maps maps/*/*.json --base "$BASE" --head "$HEAD_SHA" $full --summary --out selection.json >> "$GITHUB_STEP_SUMMARY" || fallback "selector failed"
      - uses: actions/upload-artifact@v6
        with:
          name: test-selection
          path: selection.json
          retention-days: 14

  docs-consistency:
    name: docs consistency (always)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/ci-docs-consistency

  ghost-guard:
    name: ghost-guard (semantic lint + ghost self-test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/ci-ghost-guard

  ghost-zero-cost:
    name: ghost-zero-cost (.text diff + Ir vs base)
    needs: changes
    if: needs.changes.outputs.fast == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/ci-ghost-zero-cost

  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/ci-fmt

  sefer-region-gates:
    needs: changes
    if: needs.changes.outputs.crate_sefer_region == 'true'
    name: sefer-region package gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/ci-sefer-region-gates

  aligned-vmem-gates:
    needs: changes
    if: needs.changes.outputs.crate_aligned_vmem == 'true'
    name: aligned-vmem package gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/ci-aligned-vmem-gates

  aligned-vmem-hugetlb-real:
    needs: changes
    if: needs.changes.outputs.crate_aligned_vmem == 'true'
    name: aligned-vmem (real hugetlb pool, Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Configure a real hugetlb pool (hard-asserted, never skipped)
        run: |
          set -euo pipefail
          uname -r
          grep -i Hugepagesize /proc/meminfo
          echo 64 | sudo tee /proc/sys/vm/nr_hugepages > /dev/null
          GOT=$(cat /proc/sys/vm/nr_hugepages)
          echo "nr_hugepages = $GOT"
          if [ "$GOT" -lt 8 ]; then
            echo "::error::could not reserve a hugetlb pool (nr_hugepages=$GOT)." \
                 "This job exists to execute the real MAP_HUGETLB path; skipping" \
                 "would make it pass while proving nothing. Fix the runner or" \
                 "delete the job — do not make it conditional."
            exit 1
          fi
        shell: bash
      - run: |
          ALIGNED_VMEM_REQUIRE_REAL_HUGETLB=1 cargo test -p aligned-vmem --features "huge-pages bench-internals" \
            --test huge_pages --test decommit_capability --test reservation_decommit_contract \
            2>&1 | tee "$RUNNER_TEMP/vmem-hugetlb-real.log"
          grep -F "test reserve_aligned_huge_accepts_huge_page_aligned_request ... ok" "$RUNNER_TEMP/vmem-hugetlb-real.log"
          grep -F "test huge_decommit_attempts_increments_on_huge_reservation ... ok" "$RUNNER_TEMP/vmem-hugetlb-real.log"
          grep -F "test huge_aligned_range_takes_the_real_backend_path_not_the_skip_path ... ok" "$RUNNER_TEMP/vmem-hugetlb-real.log"
          grep -F "test method_try_decommit_huge_skip_returns_ok_and_counts ... ok" "$RUNNER_TEMP/vmem-hugetlb-real.log"
          grep -F "test ci_hugetlb_real_pool_oracle_refuses_ordinary_page_fallback ... ok" "$RUNNER_TEMP/vmem-hugetlb-real.log"
          grep -F "test ci_hugetlb_real_pool_kernel_actually_accepts_eligible_madvise ... ok" "$RUNNER_TEMP/vmem-hugetlb-real.log"
          grep -F "test ci_hugetlb_real_pool_decommit_actually_zeroes_memory_on_reaccess ... ok" "$RUNNER_TEMP/vmem-hugetlb-real.log"
          grep -F "test ci_hugetlb_real_pool_release_is_attempted_exactly_once_and_does_not_fail ... ok" "$RUNNER_TEMP/vmem-hugetlb-real.log"
          grep -F "test ci_hugetlb_real_pool_align_greater_than_2mib_amplifies_pool_charge_and_skips_exact_path ... ok" "$RUNNER_TEMP/vmem-hugetlb-real.log"
          ALIGNED_VMEM_REQUIRE_REAL_HUGETLB=1 cargo test -p aligned-vmem --features "huge-pages bench-internals" \
            --test decommit_capability \
            -- --exact ci_hugetlb_real_pool_oracle_refuses_ordinary_page_fallback --nocapture \
            2>&1 | tee "$RUNNER_TEMP/vmem-hugetlb-real-marker1.log"
          grep -F "[oracle] ARMED: real MAP_HUGETLB grant confirmed" "$RUNNER_TEMP/vmem-hugetlb-real-marker1.log"
          ALIGNED_VMEM_REQUIRE_REAL_HUGETLB=1 cargo test -p aligned-vmem --features "huge-pages bench-internals" \
            --test decommit_capability \
            -- --exact ci_hugetlb_real_pool_kernel_actually_accepts_eligible_madvise --nocapture \
            2>&1 | tee "$RUNNER_TEMP/vmem-hugetlb-real-marker2.log"
          grep -F "[oracle] ARMED: kernel accepted eligible madvise(2) on real MAP_HUGETLB grant" "$RUNNER_TEMP/vmem-hugetlb-real-marker2.log"
          echo "HugePages_Free before decommit-content test:"
          grep -i HugePages_Free /proc/meminfo
          ALIGNED_VMEM_REQUIRE_REAL_HUGETLB=1 cargo test -p aligned-vmem --features "huge-pages bench-internals" \
            --test decommit_capability \
            -- --exact ci_hugetlb_real_pool_decommit_actually_zeroes_memory_on_reaccess --nocapture \
            2>&1 | tee "$RUNNER_TEMP/vmem-hugetlb-real-marker3.log"
          grep -F "[oracle] ARMED: decommitted range read back as all-zero on real MAP_HUGETLB grant" "$RUNNER_TEMP/vmem-hugetlb-real-marker3.log"
          echo "HugePages_Free after decommit-content test (observation only, not a gate -- see step comment above):"
          grep -i HugePages_Free /proc/meminfo
          ALIGNED_VMEM_REQUIRE_REAL_HUGETLB=1 cargo test -p aligned-vmem --features "huge-pages bench-internals" \
            --test decommit_capability \
            -- --exact ci_hugetlb_real_pool_release_is_attempted_exactly_once_and_does_not_fail --nocapture \
            2>&1 | tee "$RUNNER_TEMP/vmem-hugetlb-real-marker4.log"
          grep -F "[oracle] ARMED: real MAP_HUGETLB release attempted exactly once and did not fail" "$RUNNER_TEMP/vmem-hugetlb-real-marker4.log"
          echo "HugePages_Free before align>2MiB pool-amplification test:"
          grep -i HugePages_Free /proc/meminfo
          ALIGNED_VMEM_REQUIRE_REAL_HUGETLB=1 cargo test -p aligned-vmem --features "huge-pages bench-internals" \
            --test decommit_capability \
            -- --exact ci_hugetlb_real_pool_align_greater_than_2mib_amplifies_pool_charge_and_skips_exact_path --nocapture \
            2>&1 | tee "$RUNNER_TEMP/vmem-hugetlb-real-marker5.log"
          grep -F "[oracle] ARMED: align > 2 MiB reservation loop skipped exact-size path, charged 1 mmap + 1 munmap per reservation" "$RUNNER_TEMP/vmem-hugetlb-real-marker5.log"
          echo "HugePages_Free after align>2MiB pool-amplification test (observation only, not a gate -- see step comment above):"
          grep -i HugePages_Free /proc/meminfo
        shell: bash

  aligned-vmem-miri:
    needs: changes
    if: needs.changes.outputs.crate_aligned_vmem == 'true'
    name: aligned-vmem under miri (interpreter, not just --cfg miri check)
    runs-on: ubuntu-latest
    env:
      MIRIFLAGS: "-Zmiri-ignore-leaks"
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/ci-aligned-vmem-miri

  once-ptr-cell-gates:
    needs: changes
    if: needs.changes.outputs.crate_once_ptr_cell == 'true'
    name: once-ptr-cell package gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/ci-once-ptr-cell-gates

  size-classes-gates:
    needs: changes
    if: needs.changes.outputs.crate_size_classes == 'true'
    name: size-classes package gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/ci-size-classes-gates

  tagged-index-stack-gates:
    needs: changes
    if: needs.changes.outputs.crate_tagged_index_stack == 'true'
    name: tagged-index-stack package gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/ci-tagged-index-stack-gates

  once-ptr-cell-miri:
    needs: changes
    if: needs.changes.outputs.crate_once_ptr_cell == 'true'
    name: once-ptr-cell under miri (interpreter, strict-provenance included)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/ci-once-ptr-cell-miri

  globalalloc-model-miri:
    needs: changes
    if: needs.changes.outputs.crate_globalalloc_model == 'true'
    name: globalalloc-model under miri (interpreter, strict-provenance included)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: miri target list covers every tests/*.rs in BOTH miri passes
        run: |
          set -euo pipefail
          job=$(awk '/^  globalalloc-model-miri:/{seen=1; next} seen && /^  [^ ]/{seen=0} seen{print}' .github/workflows/ci.yml)
          if [ -z "$job" ]; then
            echo "could not extract the globalalloc-model-miri job block from ci.yml" >&2
            exit 1
          fi
          # Anchored at "- run:" (review run 5, P3-2): a commented-out step
          # must not donate its targets to the listed side — disabling a pass
          # has to fail the count assert below instead.
          found=$(printf '%s\n' "$job" \
            | grep -cE '^[[:space:]]*- run: cargo miri test -p globalalloc-model' || true)
          if [ "$found" -ne 4 ]; then
            echo "expected exactly 4 'cargo miri test -p globalalloc-model' run lines in this job (2 passes, each = one -Zmiri-ignore-leaks step + one multi-target step), found $found" >&2
            echo "If a step was added, removed, or commented out, restore it or reshape this check to the new step layout." >&2
            exit 1
          fi
          actual=$(ls crates/globalalloc-model/tests/*.rs | xargs -n1 basename | sed 's/\.rs$//' | sort)
          # PER PASS, not per union (review run 5, P3-2): each pass's two run
          # lines together must name exactly tests/*.rs, so a file added to
          # only one of the two miri configurations fails. Pass 1 = run lines
          # 1-2 (plain), pass 2 = run lines 3-4 (-Zmiri-strict-provenance).
          # A target name may be spelled --test=name and may contain '-'.
          pass=0
          for range in 1,2 3,4; do
            pass=$((pass + 1))
            listed=$(printf '%s\n' "$job" \
              | grep -E '^[[:space:]]*- run: cargo miri test -p globalalloc-model' \
              | sed -n "${range}p" \
              | grep -oE -- '--test[= ][A-Za-z0-9_-]+' \
              | sed -E 's/^--test[= ]//' \
              | sort -u)
            if ! diff <(printf '%s\n' "$listed") <(printf '%s\n' "$actual"); then
              echo "pass $pass: LEFT = targets named by this pass's two run lines; RIGHT = crates/globalalloc-model/tests/*.rs on disk" >&2
              echo "Add every new test file to BOTH miri passes (each pass's -Zmiri-ignore-leaks step AND its multi-target step); remove entries when a file is deleted." >&2
              exit 1
            fi
          done
          # Each step's MIRIFLAGS shape is pinned PER STEP, not counted
          # globally (review run 6, P4-1: a global count passed a
          # compensating PAIR of drifts — one step flipped to strict while
          # another was flipped to plain — because the total stayed at 2).
          # Each run line is extracted together with its following
          # MIRIFLAGS: line, so a flag value can never be attributed to the
          # wrong step. (This job's own history: the plain multi-target step
          # once drifted to strict, running strict twice and plain never —
          # review run 3, P2-1.)
          steps=$(printf '%s\n' "$job" | awk '
            /^[[:space:]]*- run: cargo miri test -p globalalloc-model/ {
              if (rec != "") print rec
              rec = "-"
              next
            }
            rec != "" && /^[[:space:]]+MIRIFLAGS:/ {
              sub(/^[[:space:]]+MIRIFLAGS:[[:space:]]*/, "")
              gsub(/"/, "")
              rec = rec "|" $0
            }
            END { if (rec != "") print rec }
          ')
          stepcount=$(printf '%s\n' "$steps" | grep -c . || true)
          if [ "$stepcount" -ne 4 ]; then
            echo "expected exactly 4 miri run steps, found $stepcount" >&2
            exit 1
          fi
          expect_flags() {
            got=$(printf '%s\n' "$steps" | sed -n "$1p")
            if [ "$got" != "$2" ]; then
              echo "miri run step $1: MIRIFLAGS drifted from its expected shape" >&2
              echo "  expected: $2" >&2
              echo "  actual:   $got" >&2
              exit 1
            fi
          }
          expect_flags 1 '-|-Zmiri-ignore-leaks'
          expect_flags 2 '-'
          expect_flags 3 '-|-Zmiri-ignore-leaks -Zmiri-strict-provenance'
          expect_flags 4 '-|-Zmiri-strict-provenance'
          # `--all-features` is pinned PER RUN LINE too (review run 7, P3-2):
          # this crate's `default = []` cfg-gates system_proptest.rs,
          # system_arbitrary.rs and two config_validate tests to EMPTY, so a
          # run line that silently loses `--all-features` keeps every existing
          # check above green (the target list still matches, MIRIFLAGS is
          # untouched) while miri covers 3 of 6 targets per pass.
          missing=$(printf '%s\n' "$job" \
            | grep -E '^[[:space:]]*- run: cargo miri test -p globalalloc-model' \
            | grep -cv -- '--all-features' || true)
          if [ "$missing" -ne 0 ]; then
            echo "$missing miri run line(s) lack --all-features; the proptest/arbitrary" >&2
            echo "test files are cfg-gated to EMPTY without it (default = [])." >&2
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - run: cargo miri test -p globalalloc-model --all-features --test double_free_no_op
        env:
          MIRIFLAGS: "-Zmiri-ignore-leaks"
      # Plain pass (review run 3, P2-1: this step's MIRIFLAGS had drifted to strict-provenance, running the strict pass twice and the plain pass never).
      - run: cargo miri test -p globalalloc-model --all-features --test miri_bounded --test oracle_negative --test system_arbitrary --test system_proptest --test config_validate --test peak_live_count --test size_strategy_avoids_boxed_value_trees
      - run: cargo miri test -p globalalloc-model --all-features --test double_free_no_op
        env:
          MIRIFLAGS: "-Zmiri-ignore-leaks -Zmiri-strict-provenance"
      # Strict-provenance pass.
      - run: cargo miri test -p globalalloc-model --all-features --test miri_bounded --test oracle_negative --test system_arbitrary --test system_proptest --test config_validate --test peak_live_count --test size_strategy_avoids_boxed_value_trees
        env:
          MIRIFLAGS: "-Zmiri-strict-provenance"

  proc-memstat-gates:
    needs: changes
    if: needs.changes.outputs.crate_proc == 'true'
    name: proc-memstat gates (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/ci-proc-memstat-gates

  proc-probe-gates:
    needs: changes
    if: needs.changes.outputs.crate_proc == 'true'
    name: proc-probe gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/ci-proc-probe-gates

  clippy:
    needs: changes
    if: needs.changes.outputs.fast == 'true'
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: clippy ()
        run: cargo clippy --all-targets -- -D warnings
      - name: clippy (--features experimental)
        run: cargo clippy --all-targets --features experimental -- -D warnings
      - name: clippy (--all-features)
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: clippy (--features "hardened medium-classes")
        run: cargo clippy --all-targets --features "hardened medium-classes internals" -- -D warnings
      - name: clippy (--features "production")
        run: cargo clippy --lib --features "production" -- -D warnings
      - name: clippy (--features "production internals")
        run: cargo clippy --all-targets --features "production internals" -- -D warnings
      - name: clippy (--features "numa-aware internals")
        run: cargo clippy --lib --features "numa-aware internals" -- -D warnings
      - name: clippy (--features "alloc-global alloc-xthread")
        run: cargo clippy --lib --features "alloc-global alloc-xthread" -- -D warnings

  evidence-registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/ci-evidence-registry

  check-matrix:
    needs: changes
    if: needs.changes.outputs.fast == 'true'
    name: check-matrix (manifest-driven, non-clippy rows)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/ci-check-matrix

  commit-prefix-lint:
    name: commit-prefix-lint (R30-12 taxonomy, PR range + pushed range)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/ci-commit-prefix-lint

  test-ghost:
    needs: changes
    if: needs.changes.outputs.fast == 'true'
    name: test (ghost build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/ci-test-ghost

  test-core:
    needs: [changes, select-tests]
    if: ${{ !cancelled() && needs.changes.outputs.fast == 'true' }}
    name: test (core tiers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v5
        if: ${{ vars.TEST_SELECTION == 'enforce' }}
        with:
          node-version: '22'
      - uses: actions/download-artifact@v6
        if: ${{ vars.TEST_SELECTION == 'enforce' }}
        continue-on-error: true
        with:
          name: test-selection
          path: sel
      - name: Selected tests
        id: sel
        if: ${{ vars.TEST_SELECTION == 'enforce' }}
        continue-on-error: true
        run: |
          echo "default=$(node scripts/select-tests.mjs args --selection sel/selection.json --features '')" >> "$GITHUB_OUTPUT"
          echo "experimental=$(node scripts/select-tests.mjs args --selection sel/selection.json --features experimental)" >> "$GITHUB_OUTPUT"
          echo "alloc_core=$(node scripts/select-tests.mjs args --selection sel/selection.json --features 'alloc-core internals')" >> "$GITHUB_OUTPUT"
      - name: test ()
        if: ${{ !cancelled() }}
        run: cargo test ${{ steps.sel.outputs.default }} --no-fail-fast # default: the safe core + SyncRegion
      - name: test (--features experimental)
        if: ${{ !cancelled() }}
        run: cargo test --features experimental ${{ steps.sel.outputs.experimental }} --no-fail-fast # adds LockFreeRegion + EpochRegion (deprecated, legacy)
      - name: test (--features alloc-core)
        if: ${{ !cancelled() }}
        run: cargo test --features "alloc-core internals" ${{ steps.sel.outputs.alloc_core }} --no-fail-fast

  test-xthread:
    needs: changes
    if: needs.changes.outputs.fast == 'true'
    name: test (xthread progression)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/ci-test-xthread

  test-hardened:
    needs: changes
    if: needs.changes.outputs.fast == 'true'
    name: test (hardened tier)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/ci-test-hardened

  test-gated-bodies:
    needs: changes
    if: needs.changes.outputs.fast == 'true'
