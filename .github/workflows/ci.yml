      # list both build the REAL backend; the explicit list is kept as the
      # documented form. The mock-cfg row below covers the mock backend.
      - run: cargo test -p aligned-vmem --features "lazy-commit huge-pages fault-injection bench-internals" --no-fail-fast
      # Task #856/W14-2: aligned-vmem crate mock coverage on macOS. Tests the mock
