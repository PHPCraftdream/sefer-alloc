      # step on the real GitHub Actions runner (all three counters silently
      # read 0, tripping the "expected exactly one" failure branch) even
      # though the identical command's plain-text output passed a local
      # check outside this colorized CI environment.
      - name: tagged-index-stack unsupported-target guard emits exactly ONE named error (no cascade)
