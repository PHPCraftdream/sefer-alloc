      - run: cargo test -p sefer-region --release --no-fail-fast

  msrv:
    # MSRV gate: `rust-version = "1.88"` is declared but never enforced, so an
    # accidental use of a stdlib API / language feature stabilised after 1.88
    # would slip through (stable CI runs a much newer toolchain). A build-only
    # `cargo check --all-features` on the pinned 1.88 toolchain is sufficient
    # evidence that the crate still compiles on its declared minimum.
    #
    # R16 (gap-audit item 19/task #612/K17): `cargo check` alone never
    # compiles `#[cfg(test)]`-only code or dev-dependency-only paths, so an
    # MSRV-incompatible construct reachable ONLY from those (e.g. a test
    # helper using a post-1.88 stdlib API, or a dev-dependency whose own MSRV
    # has crept past 1.88) would not be caught here — the exact gap
    # `docs/CORRECTNESS_OPEN_ITEMS.md` item 19 already documents as an
    # accepted release-notes caveat. Closed the "better" option that item's
    # own filing named: `cargo test --no-run --all-features` (build-only, no
    # tests actually executed — running the full suite on MSRV would be slow
    # and redundant with what the `test`/`test-core`/etc. jobs already do on
    # stable) compiles the ENTIRE test + dev-dependency graph under 1.88,
    # not just the library. Verified feasible before adding this step: run
    # locally, exit 0, ~6 minutes build-only — the dev-dependency graph
    # (proptest, criterion, tokio, slotmap, ...) genuinely supports 1.88.
    name: MSRV 1.88 (cargo check + test --no-run)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.88
        with:
          targets: thumbv7em-none-eabi
      - run: cargo check --all-features
      - run: cargo test --no-run --all-features
      # sefer-region-specific MSRV checks: make the no_std path and all-features
      # configuration explicitly verified on the pinned 1.88 toolchain (see
      # task #823 finding for why this is needed beyond the workspace-wide
      # checks above).
      - run: cargo check -p sefer-region --all-features
      - run: cargo check -p sefer-region --no-default-features
      - run: cargo test -p sefer-region --no-run --all-features
      - run: cargo check -p sefer-region --no-default-features --target thumbv7em-none-eabi
      # aligned-vmem-specific MSRV check (task #1173/L3, closing
      # docs/CORRECTNESS_OPEN_ITEMS.md item 88): the root manifest's feature
      # forwarding never turns on `aligned-vmem/huge-pages` (confirmed:
      # `grep -oE '"aligned-vmem\??/[a-z-]+"' Cargo.toml | sort -u` lists
      # bench-internals/fault-injection/lazy-commit only), so the workspace-
      # root `--all-features` step above never compiles it, on ANY toolchain
      # pinned to this job — every other job that DOES compile
      # `huge-pages` (`test` workspace-members' `--all-features` row,
      # `aligned-vmem-gates`) runs on `dtolnay/rust-toolchain@stable`, a
      # newer toolchain, not this pinned 1.88 one. Mirrors the `sefer-region`
      # rows above rather than adding `aligned-vmem/huge-pages` to the root
      # manifest's forwarding list (item 88's own card names both options and
      # recommends this one as the narrower fix: it does not change what any
      # OTHER job's plain root `--all-features` build compiles). `--all-features`
      # here also covers `bench-internals`, `lazy-commit`, and `fault-injection`
      # together with `huge-pages` in one compile, matching how the workspace-
      # root step above already exercises the other three.
      - run: cargo check -p aligned-vmem --all-features
      - run: cargo test -p aligned-vmem --no-run --all-features
      # numa-shim-specific MSRV checks (task #1282/E8, item 102 — the same
      # class item 88/task #1173 closed for aligned-vmem above): post-#1288 the
      # workspace-root `--all-features` steps at the top of this job reach
      # numa-shim with `vmem-integration` only and the real arms are ALWAYS
      # compiled (mock is a build flag, not a feature); the two rows keep their
      # value (default-feature cargo-add config + full test/dev graph at 1.88).
      - run: cargo check -p numa-shim
      - run: cargo test -p numa-shim --no-run --all-features
      # task #1299 (T12, item 103): closes the mock-arm MSRV gap the comment
      # above left open — `--all-features` can no longer reach the
      # `numa_shim_mock` cfg (it is a build flag, not a feature) post-#1288.
      - run: cargo test -p numa-shim --no-run
        env:
          RUSTFLAGS: "--cfg numa_shim_mock"
      # once-ptr-cell-specific MSRV checks (item 135/task #1410, the same
      # parity gap item 88/task #1173 and item 102/task #1282 already closed
      # for aligned-vmem/numa-shim above): the workspace-root `--all-features`
      # steps at the top of this job run without `-p`/`--workspace` in this
      # NON-virtual workspace (root package = `sefer-alloc`), so they act on
      # the root package only — `once-ptr-cell` reaches them merely as a
      # path-dependency LIBRARY (via the `alloc-core` feature), never as its
      # own tested workspace member. Its `tests/cell_unit.rs` and the
      # dev-dependency `bench-scale-tool` were never compiled on the pinned
      # 1.88 toolchain by anything in this job before this row. No
      # `--all-features` here: the crate declares no `[features]` table.
      - run: cargo check -p once-ptr-cell
      - run: cargo test -p once-ptr-cell --no-run
      # size-classes-specific MSRV checks (publication audit run 1,
      # Sol-codex, P3-3): the same parity gap the once-ptr-cell rows
      # immediately above already close -- the workspace-root
      # `--all-features` steps at the top of this job reach size-classes
      # only as a path-dependency LIBRARY (via `alloc-core`), never as its
      # own tested workspace member, so its `tests/builder.rs`/
      # `tests/proptest_builder.rs` and the `proptest` dev-dependency was
      # never compiled on the pinned 1.88 toolchain by anything in this job
      # before this row. No `--all-features` here: the crate declares no
      # `[features]` table.
      - run: cargo check -p size-classes
      - run: cargo test -p size-classes --no-run
      # `cargo test`'s default target set excludes bench targets entirely
      # (verified empirically, the same fact task #1395 established for
      # once-ptr-cell's identical bench shape) -- the exclusion is the
      # target KIND, not `harness = false` specifically, so it only
      # compiles `bench-scale-tool` itself as a library dependency, never
      # the bench FILE that calls its API. This row is the only thing in
      # any job that type-checks `benches/size_classes_bench.rs` on the
      # pinned 1.88 toolchain (rush-tests review finding T1).
      - run: cargo bench -p size-classes --no-run
      # tagged-index-stack-specific MSRV checks (round-8 review P4-7, task
      # tis-r8-Group3 #1755 — the same parity gap the once-ptr-cell and
      # size-classes rows above close): the workspace-root `--all-features`
      # steps at the top of this job reach tagged-index-stack only as a
      # path-dependency LIBRARY (via `alloc-global`'s
      # `dep:tagged-index-stack`), never as its own tested workspace member,
      # so its `tests/` (proptest + `std::thread::scope`) and its
      # `bench-scale-tool`-based bench were never compiled on the pinned 1.88
      # toolchain by anything in this job before these rows — and this is the
      # crate about to publish with `rust-version = "1.79"` (its measured
      # library-surface floor — round-13 @oh review P3-3, policy corrected
      # by Sol-codex run-4 review P2-3; see the crate-local 1.79 floor rows
      # at the bottom of this job). No
      # `--all-features` here: the crate's feature map holds the implicit
      # `loom` optional-dependency feature and the explicit `test-internals`
      # instrumentation gate (round-9 review P3-4; name features, never
      # count them). `loom` (without this job's `RUSTFLAGS: "--cfg loom"`,
      # which it never sets) would merely build the `loom` crate itself at
      # 1.88 while its cfg-gated code compiles out — coverage the
      # `loom-alloc-global` job already owns on stable — and `test-internals`
      # has its own stable-toolchain test/clippy rows in `test-workspace`
      # (Sol-codex run-3 review P2-2, task tis-sc3-Group3 #1768).
      - run: cargo check -p tagged-index-stack
      - run: cargo test -p tagged-index-stack --no-run
      # `cargo test`'s default target set excludes bench targets entirely
      # (the same fact the size-classes row above relies on), so this row is
      # the only thing in this job that type-checks
      # `benches/tagged_index_stack_bench.rs` on the pinned 1.88 toolchain.
      - run: cargo bench -p tagged-index-stack --no-run
      # tagged-index-stack MSRV-FLOOR rows (round-13 @oh review P3-3; number,
      # citation and policy corrected by Sol-codex run-4 review P2-3): the
      # crate's `rust-version` was the workspace-inherited 1.88, then 1.81
      # justified by test-only `PanicHookInfo` in `tests/stack_unit.rs` —
      # while THESE rows could only ever check the library at the pinned
      # version, the exact contradiction P2-3 flagged. Policy NOW: the
      # declared MSRV covers the PUBLISHED LIBRARY surface only, never the
      # dev-dependency/test target set — a library consumer never builds
      # dev-dependencies, so dev-only API usage must not raise the floor.
      # MEASURED floor: 1.79. `cargo +1.79 check` (both feature combinations
      # below) compiles the library clean; `cargo +1.78 check` fails
      # `error[E0658]: inline-const is experimental` at the inline `const`
      # block in `ArrayLinks::new`'s link array (`src/imp.rs`) —
      # inline-const, stabilized in Rust 1.79, is the newest API `src/` uses
      # and the API that justifies the number. (Below 1.80 cargo also emits
      # an `unused manifest key` warning for the crate-local `[lints.rust]
      # unexpected_cfgs` entry — cosmetic; the build succeeds. The
      # default-toolchain clippy gate elsewhere in this job is a LINT gate
      # over `--all-targets`, compiled against the LOCAL toolchain's std —
      # it compiles tests against today's std, not the declared floor, so it
      # is not an MSRV oracle.) Deliberately NOT adding a `+1.79 clippy
      # --all-targets`/`test --no-run` row here: `cargo +1.79 test --no-run`
      # cannot even RESOLVE the dev-dependency graph — `proptest ->
      # getrandom 0.4.3` requires cargo's own edition2024 manifest support,
      # which 1.79's cargo binary does not have (verified live: "the package
      # requires the Cargo feature called `edition2024`, but that feature is
      # not stabilized in this version of Cargo (1.79.0)") — a hard,
      # toolchain-version block independent of caching, so this
      # library-only check is the floor's oracle exactly as the
      # library-surface policy intends; the 1.88 rows above already keep the
      # tests+bench compile coverage. The `--cfg loom` build is likewise not
      # checked at this floor: at 1.79 it is blocked by loom's THIRD-PARTY
      # Windows transitive `windows-result 0.4.1` (`#[expect]`, stable 1.81)
      # before this crate's code is reached; loom coverage stays with the
      # `loom-alloc-global` job on stable. This step installs 1.79 and
      # switches the default toolchain for the remaining (last) steps of
      # this job only.
      - uses: dtolnay/rust-toolchain@1.79
      - run: cargo check -p tagged-index-stack
      - run: cargo check -p tagged-index-stack --features test-internals

  no_std:
    # The single-threaded core (Region<T> / Handle<T>) builds under no_std +
    # alloc. A build check is sufficient evidence; there is no std in the core
    # to link against, so `cargo build --no-default-features` failing would
    # surface any accidental std dependency.
    name: no_std core build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabi
      # A bare-metal target with no std, so a successful compile proves the core
      # truly is no_std + alloc (not just "host build without the std feature").
      - run: cargo build --no-default-features --target thumbv7em-none-eabi

  # Consolidated (2026-07-12, CI job-count reduction) from 9 single-test
  # matrix jobs into 3 jobs, grouped by feature string (tests sharing a
  # feature string share ONE `cargo miri test` invocation with multiple
  # `--test` flags — one compile instead of N — rather than merely sharing a
  # job with N separate invocations). Each job below still pays only one
  # checkout + nightly+miri toolchain install. Per-test rationale comments
  # from the original single-job-per-test layout are preserved next to each
  # `--test` entry.
  #
  # BUG FIX folded in here: the `region_invariants` entry below used to run
  # as the bare positional filter `cargo miri test region_invariants` — a
  # SUBSTRING filter over TEST FUNCTION NAMES, not a target selector. None of
  # `region_invariants.rs`'s actual test functions
  # (`insert_get_remove_keeps_others_valid`, `stale_handle_after_reuse_is_none`,
  # `get_mut_mutates_in_place`, `drops_each_value_exactly_once`,
  # `clear_invalidates_all_handles`) contain the substring "region_invariants",
  # so that invocation silently matched and ran ZERO tests (verified: `cargo
  # test region_invariants` reports "0 passed" across every one of the
  # workspace's ~137 test binaries) while still reporting a green `pass` —
  # this CI job has been checking nothing since it was added. Fixed by using
  # `--test region_invariants` (selects the BINARY; all 5 tests inside it run)
  # like every other entry in this matrix already did correctly.
  miri-core:
    name: miri (core)
    runs-on: ubuntu-latest
    env:
      MIRIFLAGS: "-Zmiri-strict-provenance -Zmiri-disable-isolation"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      # The core invariants (UB-free slotmap membrane), default features.
      - name: region_invariants
        run: cargo miri test --test region_invariants
      # Phase 8 core invariants under miri: the M6 decommit/recommit cycle
      # (zero-crossing of payload pages) over the segment substrate.
      # `internals` added (R34-3/task #522): reaches `sefer_alloc::alloc_core::AllocCore` directly.
      - name: decommit_miri_cycle
        run: cargo miri test --features "alloc-core alloc-decommit internals" --test decommit_miri_cycle
      # Phase 9–11 reclaim-offset arithmetic (cross-thread free placement)
      # under miri's strict provenance — UB-free pointer math in the
      # ring/reclaim path.
      # `internals` added (R34-3/task #522): reaches `sefer_alloc::alloc_core::AllocCore` directly.
      - name: reclaim_offset_unit
        run: cargo miri test --features "alloc-global alloc-xthread internals" --test reclaim_offset_unit
      # `remote_fanin_miri_minimal_retry_ub_check` (task #606/K11): a
      # purpose-built minimal miri UB-detection harness for
      # `push_with_overflow_retry`'s retry path (see remote_fanin.rs's own
      # "Harness 3" doc comment). Existed and already passed; was never
      # wired into any CI job before this. Deliberately its OWN step, not
      # combined with reclaim_offset_unit above: `remote_fanin.rs`'s other
      # 3 harnesses are `#[cfg(not(miri))]` so nothing else in that binary
      # compiles here, but `cargo test`'s positional filter argument (if one
      # were added to disambiguate) applies GLOBALLY across every `--test`
      # target in the SAME invocation, not per-binary — a prior incident in
      # this exact job (`miri-core`'s own header comment above) already
      # documents a bare positional filter silently matching zero tests
      # while still reporting green; combining these two steps and adding a
      # name filter here would have silently zeroed reclaim_offset_unit's
      # own test out of its run (verified locally: it did, before this was
      # split into two separate steps — "0 passed ... 1 filtered out").
      - name: remote_fanin_miri
        run: cargo miri test --features "alloc-global alloc-xthread internals" --test remote_fanin
      # R7-A5's own miri target (task #606/K11 — item 17: alloc_core::sidecar
      # had NO miri coverage at all; this file exists and passes but was never
      # wired into any CI job). Below-threshold only (the directory sidecar's
      # own module doc explains why the full 32-segment materialised path
      # is impractically slow under miri) — see the test file's own header
      # comment for the exact scope: the null-pointer guard path in
      # `try_materialise_directory` + the A2 publish helpers, both reachable
      # even when the directory sidecar is never actually reserved.
      - name: segment_directory_a5_miri
        run: cargo miri test --features "alloc-segment-directory internals" --test segment_directory_a5_miri

  miri-alloc-core:
    # Phase F5 (task #124) align-regression tests + S3 (#168) boundary sweep,
    # all `alloc-core`-only (no unsafe in the test bodies themselves —
    # verified locally under this exact MIRIFLAGS before originally adding
    # each: ~99s/267s/3s for the three align tests, ~40s for the sweep under
    # its `cfg(miri)`-shrunk grid). Same feature string across all four, so
    # one `cargo miri test` invocation with four `--test` flags shares a
    # single compile.
    name: miri (alloc-core)
    runs-on: ubuntu-latest
    env:
      MIRIFLAGS: "-Zmiri-strict-provenance -Zmiri-disable-isolation"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      # NOTE: `regression_own_segment_cache_invalidation` (the Э3 own-segment
      # cache invalidation) was evaluated for miri and DEFERRED (R3, #155):
      # its correctness assertion needs ROUND_BLOCKS=18_000 across
      # TARGET_SEGMENTS=6 (~100k interpreted 256 B allocations), which did
      # not even finish compiling+running under miri in ~9 min locally — it
      # would time out CI. The block-count is invariant-load-bearing (it
      # must span >= 6 real 4 MiB segments), so it cannot be
      # `cfg(miri)`-capped without voiding the test. Its decommit/recommit
      # UB surface is already covered by `decommit_miri_cycle` above.
      - run: >-
          cargo miri test --features alloc-core
          --test regression_large_align_no_segment_exhaustion
          --test regression_page_aligned_no_segment_exhaustion
          --test regression_realloc_cross_class_shrink
          --test stress_boundary_sweep

  miri-fastbin:
    # R3 (#155): the fastbin M2 oracle path had ZERO miri coverage — the Э6
    # "free path never touches the block body" strict-provenance claim was
    # never checked under miri. Plus the bump-direct carve path's pointer
    # math under strict provenance (Э1; the cold-storm size is capped under
    # `cfg(miri)` inside the test so the run fits miri's runtime — the
    # decommit-heavy `d1_cold_storm_then_free_decommits` case stays
    # `cfg(not(miri))`, its N is size-load-bearing and cannot be capped).
    # Both single-threaded, both the production feature set (fastbin +
    # decommit) — one invocation, two `--test` flags.
    name: miri (fastbin)
    runs-on: ubuntu-latest
    env:
      MIRIFLAGS: "-Zmiri-strict-provenance -Zmiri-disable-isolation"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      # `internals` added (R34-3/task #522): `regression_magazine_oracles.rs`
      # reaches `sefer_alloc::registry::{bootstrap, HeapRegistry}` directly.
      - run: >-
          cargo miri test --features "alloc-global alloc-xthread alloc-decommit fastbin internals"
          --test regression_magazine_oracles
          --test regression_bump_direct_refill

  miri-plain:
    # W6: PLAIN-provenance miri for the exposed-provenance intrusive stacks.
    # `src/registry/bootstrap.rs` (~lines 126-136) documents that the A1
    # `deferred_large` push/drain stack and the `abandoned_segs` stack pack a
    # real pointer's address via `expose_provenance` and re-derive it via
    # `with_exposed_provenance_mut` BY DESIGN. That wildcard-provenance shape is
    # rejected by `-Zmiri-strict-provenance` (correctly — the documented
    # structural limit, not a bug), so the strict `miri` job above gives the
    # `push.rs` / `drain.rs` / `heap_registry.rs` / `node.rs` pairs ZERO
    # coverage. This job runs the tests that exercise those stacks under PLAIN
    # miri (Stacked Borrows, miri's default non-strict provenance model) — the
    # ONLY mode in which the re-derivations validate. It DROPS
    # `-Zmiri-strict-provenance` and keeps only `-Zmiri-disable-isolation`.
    # Kept SEPARATE from the strict `miri` job (whose tests stay strict-clean);
    # no test is shared between the two jobs. Small N per test (Large allocs,
    # <=100 iterations) keeps each run miri-affordable.
    # Consolidated (2026-07-12, CI job-count reduction) from 2 matrix jobs
    # into 1 job. Both entries share the SAME features AND the SAME
    # MIRIFLAGS (below), so they run as one `cargo miri test` invocation with
    # two `--test` flags — one compile, one job, instead of two of each.
    name: miri-plain
    runs-on: ubuntu-latest
    env:
      # Elevated preemption rate: the task H1 aliasing guard
      # (`regression_xthread_thread_free_alias_miri`) and the R34-5 multi-
      # producer small-ring test (`regression_xthread_small_ring_miri`) both
      # need the scheduler to interleave a remote cross-thread-free CAS INSIDE
      # a live owner `alloc(&mut self)` frame. The remaining plain test is
      # phase-serialised and indifferent to the rate.
      MIRIFLAGS: "-Zmiri-disable-isolation -Zmiri-preemption-rate=0.5"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      # The A1 deferred-large / abandoned-seg exposed-provenance stacks over
      # the GLOBAL-singleton `SeferAlloc`/`HeapCore` face. The three test fns
      # (double-free-no-double-reclaim, counter-advances-again, reclaims-
      # segments-no-leak) drive the `push.rs` / `drain.rs` / `heap_registry.rs`
      # / `node.rs` re-derivations; under plain miri they show up as
      # integer-to-pointer cast WARNINGS (validated, not errors — strict miri
      # would hard-ERROR on exactly those casts, which is why this must run
      # non-strict). Verified locally: 3 passed, 0 failed (~156s).
      #
      # NOT included — the two explicit-`Heap`-face tests
      # (`regression_heap_xthread_large_free_no_leak`,
      # `regression_xthread_large_free_layout_mismatch`): both call
      # `Heap::new()` on a SPAWNED thread, whose per-thread primordial 4 MiB
      # segment becomes unreachable when that thread exits, so miri's leak
      # checker reports it (a genuine miri artifact of the per-thread `Heap`
      # face, NOT the exposed-provenance path — the p2i re-derivations warn
      # cleanly there too). Silencing it needs `-Zmiri-ignore-leaks`, which
      # would defeat these "no_leak" oracles. Their cross-thread reclaim IS
      # covered on REAL threads by the TSan `tsan` job instead.
      #
      # The second test (H1 aliasing guard) needs the elevated preemption
      # rate set in this job's `env` above; both share it (harmless for the
      # first test, which is phase-serialised and indifferent to the rate).
      # `internals` added (R34-3/task #522): both test files reach
      # `sefer_alloc::registry::{bootstrap, HeapRegistry, ...}` directly.
      #
      # R34-5 (task #524, audit finding G1): adds
      # `regression_xthread_small_ring_miri` — the multi-producer SMALL-block
      # `RemoteFreeRing` push/drain path (2 producer threads + owner-consumer),
      # the one `unsafe` seam that had ZERO concurrent miri coverage (the two
      # tests above cover only the LARGE cross-thread path). Same features,
      # same MIRIFLAGS (the elevated preemption rate creates the real overlap
      # between producer ring-pushes and owner `&mut HeapCore` alloc frames).
      # Verified locally: 1 passed (~49s).
      - run: >-
          cargo miri test --features "alloc-global alloc-xthread internals"
          --test regression_xthread_large_free_no_leak
          --test regression_xthread_thread_free_alias_miri
          --test regression_xthread_small_ring_miri

  # Loom model-checking of every concurrency protocol in the crate: the
  # bootstrap-CAS state-machine (Registry lazy init), the adopt protocol
  # (HeapRegistry.owner_state), cross-thread protocol (xthread / remote_ring
  # / thread_free), and the deprecated experimental tier (sharded / epoch).
  # Every protocol's loom file ships with a `should_panic` counterfactual
  # that proves the harness is non-vacuous.
  #
  # Loom does NOT compose with the real allocator (it replaces atomics +
  # threads + the global allocator), so these tests model each protocol's
  # atomics in isolation against loom's harness — they are NOT integration
  # tests that run the production code paths.
  #
  # Consolidated (2026-07-12, CI job-count reduction) from 11 single-test
  # matrix jobs into 4 jobs, grouped by feature string exactly like the
  # `miri`/`miri-plain` jobs above: same-feature tests share one `cargo
  # test --test A --test B ...` invocation (one compile); the one job below
  # with two genuinely different feature strings runs them as two
  # sequential steps instead.
  kani:
    # R15 (gap-audit item 18, task #611/K16): `src/kani_proofs.rs`'s bounded
    # proof harnesses (`node_proofs`, `hand_proofs`, `pack_proofs`,
    # `ring_wrap_proofs`, `ring_entry_pack_proofs` — 19 harnesses total as of
    # this job's addition) had NEVER been wired into CI — verified by `grep
    # -n kani .github/workflows/ci.yml` returning nothing before this job.
    # They existed, and (re-verified locally via WSL before adding this job,
    # since Kani does not support Windows — `kani-verifier` fails to even
    # COMPILE under `x86_64-pc-windows-msvc`, `std::os::unix` does not
    # exist there) all 19 pass, but nothing had re-checked them since
    # whenever each was last run by hand at authoring time.
    #
    # Kani requires its own toolchain + CBMC backend, installed via
    # `cargo install kani-verifier` + `cargo kani setup` (no dedicated
    # first-party GitHub Action is referenced here — the manual two-step
    # install is what was directly verified end-to-end this session, kept
    # deliberately explicit rather than trusting an unverified third-party
    # Action reference). Measured locally: the full 19-harness suite
    # verifies in ~30s once installed — comparable to this workflow's
    # existing miri jobs — so this runs per-PR, not scheduled-only.
    #
    # `--features` covers every cfg gate the existing + new proof modules
    # use: `alloc-core` (node_proofs, ring_wrap_proofs, ring_entry_pack_proofs),
    # `experimental` (hand_proofs), `alloc-global` (pack_proofs), `hardened`
    # (ring_entry_pack_proofs::hardened) — one invocation covers all of them
    # since Kani only compiles harnesses whose `#[cfg]` is satisfied.
    name: kani proofs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Install kani-verifier
        run: cargo install --locked kani-verifier
      - name: cargo kani setup
        run: cargo kani setup
      - name: cargo kani (all harnesses)
        run: cargo kani --features "alloc-core experimental alloc-global hardened"

  loom-alloc-global:
    name: loom (alloc-global)
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: "--cfg loom"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      # CRATE-P3: the four in-tree shadow-model harnesses
      # (loom_bootstrap_cas, loom_chunk_cas, loom_overflow_sidecar_cas,
      # loom_fallback_init) that each transcribed the `UNINIT -> INITIALIZING
      # -> READY` CAS-publish/OOM-rollback protocol were collapsed into ONE
      # suite that model-checks the REAL `once_ptr_cell::OncePtrCell` type (the
      # extracted crate aliases its atomics to `loom` under `--cfg loom`). It
      # runs against the crate directly (`-p once-ptr-cell`, no sefer
      # features) — see the `loom_once_ptr_cell` step below.
      # CRATE-P7: real-type `TaggedIndexStack` loom suite (replaces the in-tree
      # `loom_free_slots_aba` shadow model). The Registry `free_slots` Treiber
      # stack + `TaggedPtr` ABA-tag model was extracted to the
      # `tagged-index-stack` crate (`heap_registry.rs` pop_free_slot/
      # push_free_slot now consume `TaggedIndexStack<16>`); the crate aliases its
      # atomics to `loom` under `--cfg loom` so this suite model-checks the REAL
      # shipping type, with the untagged-corruption and H-2 empty-transition
      # tag-reset `#[should_panic]` counterfactuals proving non-vacuousness. Runs
      # against the crate directly (`-p tagged-index-stack`, no sefer features).
      # Task #1110: tee + grep postconditions (task #1086 shape, reused by
      # #1095 and #1101) — the job-level `RUSTFLAGS: "--cfg loom"` env above
      # is the ONLY thing that activates every target compiled here; a
      # one-character typo in it compiles each `#![cfg(loom)]` file to
      # `running 0 tests`, exit 0, silently deleting the model check. ONE
      # sentinel per `--test` target (= per loom-gated FILE), same granularity
      # #1101 justified for the mock rows: all targets in this job share the
      # single job-level cfg (any one sentinel catches a typo'd flag), while
      # per-file drift (renamed test, edited #![cfg] gate, dropped --test
      # argument) is independent — a single job-level sentinel would leave
      # every other target silently droppable. `shell: bash` so Actions'
      # default `-eo pipefail` fails the step if cargo fails through the tee
      # pipe; grep -F then fails it unless the named test actually RAN and
      # passed.
      # Round-3 review P1-1: `loom` is now an OPTIONAL dependency of this
      # crate, so the invocation below additionally passes `--features loom`
      # (the implicit feature the optional dependency creates) — the
      # job-level `RUSTFLAGS: "--cfg loom"` alone no longer resolves it. The
      # crate's own `compile_error!` guard fails the cfg-without-feature
      # mismatch with a named reason. The tee + grep postconditions below are
      # unchanged.
      - run: |
          cargo test --release -p tagged-index-stack --features loom --test loom_aba 2>&1 | tee "$RUNNER_TEMP/loom-aba.log"
          grep -F "test pop_empty_transition_preserves_tag ... ok" "$RUNNER_TEMP/loom-aba.log"
        shell: bash
      # Round-7 review P3-2 (task #1741): `test-workspace`'s `cargo clippy -p
      # tagged-index-stack --all-targets -- -D warnings` row (above, line
      # ~1985) never sets `--cfg loom`/`--features loom`, so `loom_aba.rs`
      # (`#![cfg(loom)]`) and the crate's own `#[cfg(loom)]` lib code
      # (`cas_head_for_test`, both retry counters) compile to nothing there
      # and are never linted by ANY CI row. This job already carries the
      # job-level `RUSTFLAGS: "--cfg loom"` the lint needs, so the fix is one
      # more step here, not a new job.
      - run: cargo clippy -p tagged-index-stack --features loom --all-targets -- -D warnings
      # CRATE-P3: real-type `OncePtrCell` loom suite (replaces the 4 shadow
      # models above). Includes the Relaxed-publish and spin-on-READY-livelock
      # `#[should_panic]` counterfactuals proving the harness is non-vacuous.
      - run: |
          cargo test --release -p once-ptr-cell --test loom_once_ptr_cell 2>&1 | tee "$RUNNER_TEMP/loom-once-ptr-cell.log"
          grep -F "test real_probe_rollback_does_not_clobber_concurrent_winner ... ok" "$RUNNER_TEMP/loom-once-ptr-cell.log"
        shell: bash

  loom-xthread:
    name: loom (alloc-core alloc-xthread)
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: "--cfg loom"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      # #141: loom_deferred_large — A1 deferred_large push/drain Treiber-stack
      # model (the double-push guard + DEFERRED_LARGE_TAIL/ABANDONED_TAIL
      # sentinel split from `src/alloc_core/deferred_large/push.rs`/`drain.rs`).
      #
      # R13-5 (task #275): loom_class_aware_dirty (added R12-7 stage 2, task
      # #258) was never wired into ANY loom job — a second forgotten loom
      # file after task #204's original miss. The file's own `#![cfg(loom)]`
      # gate carries no Cargo-feature predicate (it re-models the
      # `class-aware-dirty` protocol on its own hand-rolled `loom::sync`
      # atomics, not the real `PerClassDirty`/`OncePtrCell` types — see its
      # module doc), so it compiles and runs under this job's EXISTING
      # `alloc-core alloc-xthread` feature string with no change needed to
      # that string. Verified locally (both debug and this job's real
      # `--release` invocation): 7 passed (3 positive R12-7 tests + the R13-1
      # latch-pair positive tests + 2 `#[should_panic]` counterfactuals),
      # 0 failed.
      # `--release` invocation): 7 passed (3 positive R12-7 tests + the R13-1
      # latch-pair positive tests + 2 `#[should_panic]` counterfactuals),
      # 0 failed.
      #
      # Task #1110: tee + grep postconditions (task #1086 shape) — ONE
      # sentinel per `--test` target in this single multi-target cargo
      # invocation, exactly #1101's per-FILE solution for a row that runs
      # several cfg-gated files in one compile: the seven targets share the
      # job-level `--cfg loom` (any sentinel catches a typo'd flag), but each
      # file's drift is independent. `shell: bash` for `-eo pipefail`.
      #
      # Task #1146: four of these seven sentinels name `#[should_panic]`
      # counterfactual tests (loom_deferred_large's
      # counterfactual_no_guard_double_extracts_or_corrupts,
      # loom_remote_ring_drain_guard's
      # counterfactual_stale_cache_not_reset_across_segment_reuse,
      # loom_dirty_publish's counterfactual_non_atomic_push_loses_entry,
      # loom_dirty_multi_segment's counterfactual_relaxed_dirty_loses_entry).
      # libtest prints a passing should_panic test as
      # "test NAME - should panic ... ok", not "test NAME ... ok" — the
      # plain-`ok` form only ever matches a NON-should_panic test. A
      # sentinel copy-pasted from the plain-test pattern therefore never
      # matches a passing should_panic test's actual output, so the step
      # failed even though every loom test in the binary passed (verified:
      # `cargo test`'s own `test result: ok` for the binary, alongside a
      # `grep -F` exit 1 on the mismatched sentinel under `shell: bash`'s
      # `-o pipefail`). Fixed by including the `- should panic` infix in
      # the four affected sentinels below — NOT by dropping the ` ... ok`
      # tail, which would make the sentinel match a FAILING test's own
      # name-only echo too and defeat the postcondition's whole purpose.
      - run: |
          cargo test --release --features "alloc-core alloc-xthread" \
            --test loom_xthread_protocol \
            --test loom_remote_ring \
            --test loom_deferred_large \
            --test loom_remote_ring_drain_guard \
            --test loom_dirty_publish \
            --test loom_dirty_multi_segment \
            --test loom_class_aware_dirty 2>&1 | tee "$RUNNER_TEMP/loom-xthread.log"
          grep -F "test protocol_single_owner_never_resurrects ... ok" "$RUNNER_TEMP/loom-xthread.log"
          grep -F "test correct_ring_never_loses_or_duplicates ... ok" "$RUNNER_TEMP/loom-xthread.log"
          grep -F "test counterfactual_no_guard_double_extracts_or_corrupts - should panic ... ok" "$RUNNER_TEMP/loom-xthread.log"
          grep -F "test counterfactual_stale_cache_not_reset_across_segment_reuse - should panic ... ok" "$RUNNER_TEMP/loom-xthread.log"
          grep -F "test counterfactual_non_atomic_push_loses_entry - should panic ... ok" "$RUNNER_TEMP/loom-xthread.log"
          grep -F "test counterfactual_relaxed_dirty_loses_entry - should panic ... ok" "$RUNNER_TEMP/loom-xthread.log"
          grep -F "test class_a_triggered_visit_recovers_class_b_entry ... ok" "$RUNNER_TEMP/loom-xthread.log"
        shell: bash

  loom-experimental:
    name: loom (experimental)
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: "--cfg loom"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      # Task #1110: tee + grep postconditions (task #1086 shape) — one
      # sentinel per `--test` target; `shell: bash` for `-eo pipefail`.
      #
      # Task #1146: both sentinels below name `#[should_panic]`
      # counterfactual tests — libtest prints those as
      # "test NAME - should panic ... ok", not "test NAME ... ok" (see the
      # loom-xthread job's step above for the full explanation of this
      # defect class). Both sentinels here were the plain-`ok` form and
      # therefore never matched, failing this step even though every test
      # in both binaries passed.
      - run: |
          cargo test --release --features "experimental" \
            --test loom_sharded \
            --test loom_epoch 2>&1 | tee "$RUNNER_TEMP/loom-experimental.log"
          grep -F "test counterfactual_naive_load_then_swap_loses_live_value - should panic ... ok" "$RUNNER_TEMP/loom-experimental.log"
          grep -F "test counterfactual_no_recheck_yields_torn_read - should panic ... ok" "$RUNNER_TEMP/loom-experimental.log"
        shell: bash

  loom-misc:
    # Two distinct feature strings share one job (still one checkout /
    # toolchain) rather than each justifying its own job: the empty-feature
    # `loom_thread_free` model, and the `alloc-global,alloc-xthread` group
    # (`loom_magazine_ring_compose` + task #204's three shipping HeapOverflow
    # / overflow-composition models — these in-tree files are the real
    # coverage of those protocols; the standalone `ring-mpsc` crate that
    # once shipped a parallel real-type suite for the same protocol shape
    # was removed from the workspace, task #655 — it had zero production
    # consumers, the in-tree swap having been investigated and found NO-GO,
    # see docs/crate_extraction/CRATE_P4_FOLLOWUP_NOGO.md).
    name: loom (misc)
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: "--cfg loom"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      # task #204: the `alloc` Cargo feature (and the `Heap` type it gated)
      # was removed; this file's synthetic `Node` model never actually
      # depended on it (verified: compiles and passes with an empty feature
      # set) — the CI matrix simply hadn't been updated when the feature was
      # deleted.
      - name: loom_thread_free
        # Task #1110: tee + grep postcondition (task #1086 shape).
        run: |
          cargo test --release --test loom_thread_free 2>&1 | tee "$RUNNER_TEMP/loom-thread-free.log"
          grep -F "test correct_push_never_loses_blocks ... ok" "$RUNNER_TEMP/loom-thread-free.log"
        shell: bash
      # R2 (#154): magazine↔RemoteFreeRing composition shadow model. The
      # primary test is a `#[should_panic]` counterfactual PINNING the #164
      # residual hole — it stays green exactly while the hole exists, and
      # goes red the moment a fix (or a regression) changes the composition,
      # forcing the model to be updated alongside #164.
      # task #204: the three shipping HeapOverflow / overflow-composition
      # models (loom_overflow_first_retry, loom_heap_overflow,
      # loom_heap_overflow_drain_guard) share this step's `alloc-global
      # alloc-xthread` feature string, so they fold into this same `cargo
      # test` invocation (one compile) per the file's consolidation
      # convention — they are the real coverage of the shipping HeapOverflow
      # ring + overflow-first composition referenced in the CRATE-P4 note
      # above.
      # `alloc-global` pulls in `tagged-index-stack` as a path dependency
      # (root Cargo.toml: `alloc-global = ["alloc-core",
      # "dep:tagged-index-stack"]`), so under this job's `RUSTFLAGS: "--cfg
      # loom"` it gets compiled with `cfg(loom)` active. Since round-3
      # review P1-1 made `loom` an optional Cargo feature of that crate (see
      # the `loom-alloc-global` job's comment above), its own
      # `compile_error!` guard now fires unless that feature is ALSO
      # enabled here via `tagged-index-stack/loom` — the job-level cfg
      # alone is no longer sufficient (this broke CI once, landing SHA
      # e2377c7, before this line was added).
      - name: loom_magazine_ring_compose
        # Task #1110: tee + grep postconditions (task #1086 shape) — one
        # sentinel per `--test` target in this four-target invocation (#1101
        # per-FILE granularity); `shell: bash` for `-eo pipefail`.
        run: |
          cargo test --release --features "alloc-global alloc-xthread tagged-index-stack/loom" \
            --test loom_magazine_ring_compose \
            --test loom_overflow_first_retry \
            --test loom_heap_overflow \
            --test loom_heap_overflow_drain_guard 2>&1 | tee "$RUNNER_TEMP/loom-misc-compose.log"
          grep -F "test compose_gen_guard_holds ... ok" "$RUNNER_TEMP/loom-misc-compose.log"
          grep -F "test overflow_first_composed_never_loses_or_duplicates ... ok" "$RUNNER_TEMP/loom-misc-compose.log"
          grep -F "test correct_overflow_never_tears_loses_or_duplicates ... ok" "$RUNNER_TEMP/loom-misc-compose.log"
          grep -F "test guard_reclaims_entry_despite_unpublished_slot_gap ... ok" "$RUNNER_TEMP/loom-misc-compose.log"
        shell: bash

  tsan:
    # ThreadSanitizer (weak-memory / data-race detector) gate for the
    # cross-thread allocator path. TSan catches missing-synchronization /
    # data-race bugs in the ring/reclaim/owner-stamp protocol (Phases 9–11)
    # that pure functional tests on x86_64 can hide. Requires nightly +
    # rust-src (for `-Zbuild-std`, since TSan must instrument the std/core it
    # links against). Linux-only; not runnable on the Windows dev host.
    name: thread-sanitizer
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: "-Zsanitizer=thread"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      # The race-prone cross-thread tests: the reproduction harnesses
      # (race_repro / race_norecycle) and the multi-threaded global-alloc
      # churn (global_alloc_mt). `-Zbuild-std` rebuilds std with TSan
      # instrumentation so the detector sees inside the standard library too.
      # (task #204: `heap_cross_thread` was removed along with the `Heap`
      # type it exercised — its cross-thread coverage lives on via
      # `HeapCore`'s own MT tests below, e.g.
      # `regression_realloc_xthread_stamp`.)
      - name: Run race-prone tests under ThreadSanitizer
        run: >-
          cargo +nightly test
          -Zbuild-std
          --target x86_64-unknown-linux-gnu
          --features "alloc-global alloc-xthread"
          --test race_repro
          --test race_norecycle
          --test global_alloc_mt
      # R3 (#155): the `alloc-global alloc-xthread` step above leaves the whole
      # magazine / fastbin production layer UNINSTRUMENTED by TSan. Add a second
      # step over the flagship `production` feature set (fastbin + decommit) on
      # the multi-threaded tests. This is the run that actually exercises the
      # Э5 non-atomic per-heap counters (heap_core.rs `tcache_hits`,
      # alloc_core.rs `large_cache_hits` — a split load+store the single-writer
      # claim must justify) AND the `stats()` aggregation that reads REMOTE
      # heaps' counters (the initialised-gate, #133) — the classic TSan target.
      # `tls_heap_teardown_ordering_stress` and
      # `regression_percounter_perheap_aggregation` are the MT tests that drive
      # the teardown/recycle handshake and the cross-heap counter read. Verified
      # locally via WSL: 0 data races reported.
      #
      # S3 (#168): the concurrent boundary-stress hammer (S1,
      # `stress_concurrent_boundaries`) is added to THIS production step — the
      # magazine / RemoteFreeRing / Э5-counter race surface under boundary
      # pressure is the highest-value TSan combination. Its per-thread op budget
      # and thread cap are slashed for the sanitizer via the env below
      # (`SEFER_STRESS_OPS` overrides the absolute budget; `SEFER_STRESS_MAX_THREADS`
      # caps the workers at 4 to bound TSan's shadow memory) so the run stays
      # ~sub-second. These env vars are read ONLY by that test and are UNSET in
      # the native suite, so native behavior is byte-identical to before.
      #
      # W6: the Large cross-thread FREE path (the A1 deferred-large /
      # abandoned-seg exposed-provenance stacks) was UNINSTRUMENTED — every test
      # above frees small blocks cross-thread. `regression_realloc_xthread_stamp`
      # (the W4/MUST-1 realloc → cross-thread-free path) is a genuine MT test
      # (spawns a non-owner thread that remotely frees a Large segment) and
      # compiles under `production`, so it's added to this step. (task #204:
      # `regression_heap_xthread_large_free_no_leak`, which covered the same
      # A1 Large cross-thread reclaim over the removed `Heap` face, was
      # deleted along with `Heap` — `HeapCore` has no public
      # `dealloc_any_thread` to give it a faithful substitute; the
      # `regression_realloc_xthread_stamp` coverage above remains.)
      # `internals` added (R34-3/task #522):
      # `regression_percounter_perheap_aggregation.rs` and
      # `regression_realloc_xthread_stamp.rs` reach
      # `sefer_alloc::registry::{bootstrap, HeapRegistry, ...}` directly.
      - name: Run production-config tests under ThreadSanitizer
        env:
          SEFER_STRESS_OPS: "600"
          SEFER_STRESS_MAX_THREADS: "4"
        run: >-
          cargo +nightly test
          -Zbuild-std
          --target x86_64-unknown-linux-gnu
          --features "production internals"
          --test global_alloc_mt
          --test tls_heap_teardown_ordering_stress
          --test regression_percounter_perheap_aggregation
          --test regression_realloc_xthread_stamp
          --test stress_concurrent_boundaries

  asan:
    # R34-20 (task #539, audit finding G6 [low]): AddressSanitizer gate for the
    # allocator's own raw-pointer memory operations (the `os` mmap/munmap seam,
    # the intrusive free-list `node` seam, the realloc copy legs). ASan
    # instruments every load/store with byte-granularity shadow memory and
    # catches out-of-bounds access, use-after-free, and invalid free on memory
    # that escapes a mapping — the memory-corruption dimension that complements
    # Miri (strict-provenance UB), TSan (data races), Loom (concurrency models),
    # Kani (proofs) and proptest.
    #
    # PER-PR (not weekly), mirroring the `tsan` job just above: both are
    # nightly + `-Zbuild-std --target x86_64-unknown-linux-gnu` + a
    # `-Zsanitizer` flag of IDENTICAL compile cost. The weekly cadence that
    # governs `feature-powerset` (hundreds of `cargo check` invocations — that
    # job's header below carries the dated count and the re-derivation recipe,
    # per the no-hardcoded-counts convention, task #776/F10) and
    # `numa-real-kernel` (hardware-specific, heavy) does NOT apply here: the ASan
    # harness is 2 test invocations with ~0.01s test runtime each (the ENTIRE
    # cost is the `-Zbuild-std` std rebuild that `tsan` already pays per-PR).
    # Measured cold via WSL (the exact commands in the two steps below, minus the
    # WSL-only CARGO_TARGET_DIR / RUSTC_WRAPPER-scrub the local `npm run asan`
    # wrapper adds — neither is needed on a pure-Linux runner): ~2m44s wall
    # (compile-dominated; test execution 0.01s for all 7 tests) — comparable to
    # the `tsan` job's own cost.
    #
    # The harness (`tests/asan_alloc_core.rs`) drives `AllocCore` DIRECTLY,
    # never as `#[global_allocator]` — ASan installs its own allocator
    # interceptors that would clash with a custom global allocator. See the test
    # file header and `scripts/asan.mjs` for the full rationale and the precise
    # class of bug ASan can vs cannot see inside a self-hosted mmap arena
    # (intra-segment OOB between two allocations within one 4 MiB segment is
    # addressable shadow and NOT redzoned — that dimension is Miri's job).
    #
    # Linux-only (`-Zsanitizer=address` is Linux/macOS in the Rust toolchain;
    # the Windows MSVC target cannot run it — hence the WSL wrapper in the local
    # `npm run asan` script, unneeded on this ubuntu-latest runner). The two
    # passes mirror `scripts/asan.mjs`: the plain alloc-core substrate, then
    # +alloc-decommit (the madvise/MADV_DONTNEED + recommit surface — a
    # different mmap-touching leg worth instrumenting).
    name: address-sanitizer (alloc-core)
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: "-Zsanitizer=address"
      RUSTDOCFLAGS: "-Zsanitizer=address"
      # halt_on_error=0 keeps ASan reporting every distinct error in a run;
      # detect_leaks=0 suppresses LSan's exit-time leak scan (the allocator's
      # own still-live mmap'd segments would noisily trip it if a test exits
      # early — ASan's value here is OOB/UAF detection, not leak detection;
      # mmap isn't tracked by LSan anyway). Mirrors scripts/asan.mjs verbatim.
      ASAN_OPTIONS: "halt_on_error=0:detect_leaks=0"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      # Pass 1: the plain alloc-core substrate (mmap/munmap seam, intrusive
      # free-list, realloc copy legs). `-Zbuild-std --target` is MANDATORY: ASan
      # only instruments code compiled WITH the flag, and the prebuilt sysroot
      # std is NOT — so std is rebuilt from source (hence rust-src) targeting the
      # host triple explicitly (a bare targetless `-Zsanitizer` build silently
      # leaves std uninstrumented).
      - name: ASan (alloc-core)
        run: >-
          cargo +nightly test
          -Zbuild-std
          --target x86_64-unknown-linux-gnu
          --release
          --features alloc-core
          --test asan_alloc_core
      # Pass 2: + alloc-decommit (the madvise/MADV_DONTNEED + recommit surface).
      # Shares the std rebuild from pass 1 (cached in target/).
      - name: ASan (alloc-core alloc-decommit)
        run: >-
          cargo +nightly test
          -Zbuild-std
          --target x86_64-unknown-linux-gnu
          --release
          --features "alloc-core alloc-decommit"
          --test asan_alloc_core

  multi-arch:
    # x86 is a strong-memory model; aarch64 is weak-memory and can surface
    # ordering bugs the x86 run hides. We cross-compile and run via `cross` for
    # aarch64. (The concurrent tiers carry the ordering-sensitive `unsafe`.)
    name: test (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            use_cross: false
          - target: aarch64-unknown-linux-gnu
            use_cross: true
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install cross
        if: ${{ matrix.use_cross }}
        uses: taiki-e/install-action@v2
        with:
          tool: cross
      - name: Run tests (native)
        if: ${{ !matrix.use_cross }}
        run: cargo test --target ${{ matrix.target }} --features experimental
      # Weak-memory coverage for the allocator's cross-thread ordering: the
      # ring/reclaim/owner-stamp (Phases 9–11) and the M6 decommit/recommit
      # zero-crossing (Phase 35). aarch64 is the load-bearing run here (weak
      # memory model can expose ordering bugs x86_64 hides); x86_64 is the
      # strong-memory baseline.
      # `internals` added (R34-3/task #522) — whole-suite row.
      - name: Run cross-thread tests (native)
        if: ${{ !matrix.use_cross }}
        run: cargo test --target ${{ matrix.target }} --features "alloc-global alloc-xthread internals"
      - name: Run cross-thread + decommit tests (native)
        if: ${{ !matrix.use_cross }}
        run: cargo test --target ${{ matrix.target }} --features "alloc-global alloc-xthread alloc-decommit internals"
      - name: Run tests (cross)
        if: ${{ matrix.use_cross }}
        run: cross test --target ${{ matrix.target }} --features experimental
      - name: Run cross-thread tests (cross)
        if: ${{ matrix.use_cross }}
        run: cross test --target ${{ matrix.target }} --features "alloc-global alloc-xthread internals"
      - name: Run cross-thread + decommit tests (cross)
        if: ${{ matrix.use_cross }}
        run: cross test --target ${{ matrix.target }} --features "alloc-global alloc-xthread alloc-decommit internals"
      # Weak-memory coverage for the newest 0.3.0 magazine layer: the Э5 relaxed
      # load/store per-heap counters and the P7 batching path (the `fastbin` /
      # `production` bundle) were NEVER run on aarch64 — only the pre-magazine
      # tiers above crossed onto weak memory. aarch64's weak model is exactly
      # where a mis-ordered relaxed counter or batch drain would surface.
      - name: Run production tests (cross)
        if: ${{ matrix.use_cross }}
        run: cross test --target ${{ matrix.target }} --features "production internals"

  tis-weak-memory-wallclock-gate:
    # The weak-memory wall-clock/perf-gate harness that
    # `crates/tagged-index-stack/CHANGELOG.md`'s 0.1.0 Performance section
    # explicitly said did not exist ("Revisit when one exists") and that the
    # Sol-codex review run 4 (2026-09-01, findings P3-1 link-cell ordering /
    # P3-2 compare_exchange vs compare_exchange_weak,
    # `docs/reviews/2026-09-01-124216-tagged-index-stack-review-Sol-codex-run-4.md`)
    # prescribed.  Gate report: `docs/perf/TIS_LINK_ORDERING_WEAK_CAS_GATE.md`;
    # driver: `crates/tagged-index-stack/scripts/tis_p3_ab_runner.mjs`.
    #
    # P2-2 (Sol-codex review run 8): because this whole job is
    # `workflow_dispatch`-only, an API break in the harness TEMPLATE this job
    # materializes and builds (not this job's own measurement logic) can sit
    # undetected for a full round — exactly what happened when `3e83b1c`
    # turned `push`/`push_index` into `unsafe fn`. The `--mode build-check`
    # step in `tagged-index-stack-gates` above runs on every regular push/PR
    # and catches that class of break without needing arm64 hardware or a
    # full measurement run; it does not replace this job's actual timing
    # gate, only the "does the template still compile" precondition.
    #
    # Why NATIVE arm64 and not QEMU/cross: QEMU-user TCG on an x86 host does
    # not reproduce weak-memory TIMING (acquire/release lowering effects are
    # invisible under TCG), so it is usable for correctness only — and the
    # aarch64 CORRECTNESS coverage already exists in the `multi-arch` job
    # above (workspace-wide `cross test` rows).  This job adds the TIMING
    # axis, which requires real hardware: `ubuntu-24.04-arm` is a free
    # standard hosted runner for public repositories (this repo is public).
    #
    # workflow_dispatch-ONLY (measurement job, ~5 min arm64 minutes per run,
    # on-demand only) — the same cadence rationale as the feature-powerset
    # job, which additionally allows `schedule`; this one is dispatch-only
    # because it is an evidence-gathering gate, not a standing regression
    # check.
    #
    # What the two steps assert: step 1 re-verifies the static codegen
    # oracles on the runner's own toolchain — including the DELIBERATE
    # `cas_weak` sha-identity asserts that FAIL LOUDLY (message contains
    # "P3-2 REOPENED") if a future toolchain reintroduces an inline-LL/SC
    # lowering where `compare_exchange_weak` differs from
    # `compare_exchange` — the identity measured on rustc 1.97.0/LLVM 22
    # (see `docs/perf/TIS_LINK_ORDERING_WEAK_CAS_GATE.md`).  Step 2 runs the
    # contended pop-then-repush wall-clock A/B (published-window protocol,
    # 3 variants x 3 samples x 1 s) whose retry-counter oracle proves the
    # CAS-retry path was actually exercised (per CLAUDE.md's
    # path-activation-oracle rule).
    #
    # Provenance: authored on branch `tis-sol4-w3-perf` (Wave 3) WITHOUT ever
    # being executed from that sandboxed environment (no push); the first
    # `workflow_dispatch` run is its validation.
    name: tagged-index-stack weak-memory wall-clock A/B gate (arm64)
    runs-on: ubuntu-24.04-arm
    if: ${{ github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      # No `grep -F "<marker>" <log>` postcondition here on purpose: GitHub
      # Actions' default `shell: bash` already runs with `-eo pipefail`, so
      # this step already fails on the script's own exit code through the
      # `tee` pipe (`node ...`'s exit status propagates, not `tee`'s) — a
      # separate grep would be redundant AND would collide with this repo's
      # `scripts/verify-ci-sentinels.mjs` marker-sentinel convention, which
      # resolves a bare-literal `grep -F` against a Rust `println!` inside a
      # `tests/*.rs` file; the runner's own "... mode OK" text is a Node.js
      # `console.log`, not a Rust test oracle, so it can never resolve there.
      - name: Static codegen A/B (identity + delta oracles)
        run: node crates/tagged-index-stack/scripts/tis_p3_ab_runner.mjs --mode codegen --target aarch64-unknown-linux-gnu 2>&1 | tee "$RUNNER_TEMP/tis-p3-codegen.log"
        shell: bash
      - name: Contended wall-clock A/B (retry-counter oracle)
        run: node crates/tagged-index-stack/scripts/tis_p3_ab_runner.mjs --mode wallclock --target aarch64-unknown-linux-gnu 2>&1 | tee "$RUNNER_TEMP/tis-p3-wallclock.log"
        shell: bash
      # `if: always()` is deliberate: a failed oracle run still uploads its
      # raw logs so the failure can be diagnosed offline.
      - name: Upload raw artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: tis-p3-ab-aarch64-artifacts
          path: |
            docs/perf/_raw_tis_p3_ab_aarch64-unknown-linux-gnu_codegen.log
            docs/perf/_raw_tis_p3_ab_aarch64-unknown-linux-gnu_codegen.s.all
            docs/perf/_raw_tis_p3_ab_aarch64-unknown-linux-gnu_wallclock.log
            docs/perf/TIS_LINK_ORDERING_WEAK_CAS_GATE_codegen_aarch64-unknown-linux-gnu.csv
            docs/perf/TIS_LINK_ORDERING_WEAK_CAS_GATE_wallclock_aarch64-unknown-linux-gnu.csv
          if-no-files-found: error

  numa-shim-mock:
    # NUMA Phase 1: verify wrapping logic on every CI run without real
    # multi-NUMA hardware.  Runs on Linux; the mock is platform-agnostic
    # but Linux is the cheapest runner and covers the most-used NUMA path.
    name: numa-shim mock dispatch tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # task #1276 (N2, 2026-08-23 numa-shim publication-readiness review):
      # the REAL Linux backend, no `mock`. The two `mock` test steps below now
      # set the build-time cfg `numa_shim_mock` via RUSTFLAGS, and `--all-features`
      # no longer turns `mock` on at all (task #1288). Until this step no per-PR
      # CI job ran `cargo test -p numa-shim` on Linux without it:
      # tests/smoke.rs's `sched_getcpu` + sysfs cpumap reader + real
      # mbind(2) syscall coverage never ran on the one OS where those are
      # real, and `pub mod linux` + tests/node_resolution_linux.rs (gated
      # `all(target_os = "linux", not(miri), not(numa_shim_mock))`) were
      # compiled by no CI job on ANY platform -- leaving
      # NodeResolution::FellBackToZero with zero automated coverage. Job id
      # intentionally kept as `numa-shim-mock` despite no longer being
      # mock-only: the id is cited by name in CHANGELOG.md,
      # docs/correctness-open-items/*, and several review docs.
      - run: cargo test -p numa-shim
      # task #1288: `mock` is no longer a Cargo feature — the mock backend is
      # compiled in only by the build-time cfg `numa_shim_mock` (RUSTFLAGS).
      # tests/mock_dispatch.rs and tests/node_resolution.rs are both
      # `#![cfg(numa_shim_mock)]`-gated at the top level, so a typo'd cfg
      # compiles them to ZERO tests with exit 0 (green-and-dead) — the greps
      # require one named test per FILE (task #1101 sentinel pattern; the
      # vacuous-green hazard this guards against is task #1070 "Breakage B").
      - run: |
          RUSTFLAGS="--cfg numa_shim_mock" cargo test -p numa-shim 2>&1 | tee "$RUNNER_TEMP/numa-shim-mock.log"
          grep -F "test current_node_records_scripted_value ... ok" "$RUNNER_TEMP/numa-shim-mock.log"
          grep -F "test resolution_matches_current_node_resolved_zero ... ok" "$RUNNER_TEMP/numa-shim-mock.log"
        shell: bash
      # The same cfg plus `vmem-integration` (still a real Cargo feature), so
      # mock_dispatch.rs's `reserve_preferred_on_node` arms compile and run.
      # Same self-verifying grep (the sentinel test only exists under BOTH
      # the cfg and the feature). task #1306: sentinel renamed along with the
      # function it names (reserve_on_node -> reserve_preferred_on_node).
      - run: |
          RUSTFLAGS="--cfg numa_shim_mock" cargo test -p numa-shim --features vmem-integration 2>&1 | tee "$RUNNER_TEMP/numa-shim-mock-vmem.log"
          grep -F "test reserve_preferred_on_node_records_args ... ok" "$RUNNER_TEMP/numa-shim-mock-vmem.log"
        shell: bash
      # task #1282 (E2, 2026-08-23 publication-readiness review, item 102):
      # the REAL Linux `reserve_preferred_on_node` path —
      # `platform::reserve_preferred_on_node_impl` in
      # crates/numa-shim/src/lib.rs, `aligned_vmem::try_reserve_aligned` +
      # `mbind_preferred_linux` (task #1306 rename), i.e. a real mbind(2)
      # against a real fresh mmap — was compiled by the `--all-features`
      # clippy row below but EXECUTED by no CI job on any platform: the
      # three test rows above either leave `vmem-integration` off (so
      # `reserve_preferred_on_node` does not exist) or turn `mock` on (so
      # the real backend is bypassed), while the identical
      # `--features vmem-integration` rows in numa-shim-windows /
      # numa-shim-macos run the real backend only on non-Linux kernels.
      # This row runs tests/smoke.rs's `reserve_preferred_on_node_*` tests
      # against the real Linux mbind(2) — the crate's headline capability
      # on its headline platform.
      #
      # task #1324 (P2-1 of the seventeenth independent review,
      # docs/reviews/2026-08-24-223343-numa-shim-publication-audit-oh.md):
      # NUMA_SHIM_REQUIRE_ORACLE=1 makes the `current_node() == None` skip
      # arms of the four positive tests this row runs (policy_oracle_linux.rs
      # x2, smoke.rs x2) PANIC instead of skip. The inverse of
      # numa-real-kernel's SEFER_NUMA_TEST=1 opt-in gate: that env var says
      # "run the expensive real-hardware test"; this one says "this host is
      # SUPPOSED to have working detection" — current_node() is this crate's
      # own chain (sched_getcpu -> sysfs cpumap -> ReverseIndex::lookup), so
      # a None here means detection regressed and the row must go red, not
      # silently skip green (an internally-skipped test still prints
      # "... ok"). This row ONLY: the mock rows above, the Windows/macOS
      # jobs below, and local/dev runs keep the tolerant skip.
      #
      # task #1338 (P2-3 of the nineteenth independent review,
      # docs/reviews/2026-08-25-022026-numa-shim-publication-audit-oh.md):
      # green-and-dead sentinels for this row (task #1101 sentinel pattern;
      # task #1070 "Breakage B" is the vacuous-green hazard). This is the one
      # CI row that executes tests/policy_oracle_linux.rs — the kernel-record
      # oracle for the crate's headline capability — and that file compiles
      # under FIVE simultaneous `#![cfg(...)]` conditions (target_os = "linux",
      # not(miri), not(numa_shim_mock), feature = "vmem-integration",
      # any(target_arch = "x86_64", target_arch = "aarch64")). If any one
      # silently breaks (feature rename, stray cfg leak, arch-clause edit, cfg
      # typo) the file compiles to ZERO tests and this row still exits 0 with
      # no signal — NUMA_SHIM_REQUIRE_ORACLE=1 (task #1324) closes the
      # silent-SKIP hole but cannot close the never-COMPILED hole: an absent
      # test cannot read an env var. The greps make that a hard CI failure.
      - run: |
          cargo test -p numa-shim --features vmem-integration 2>&1 | tee "$RUNNER_TEMP/numa-shim-oracle-linux.log"
          grep -F "test reserve_preferred_on_node_installs_mpol_preferred_on_the_usable_span ... ok" "$RUNNER_TEMP/numa-shim-oracle-linux.log"
          grep -F "test plain_unbound_reservation_is_not_reported_as_preferred_for_our_node ... ok" "$RUNNER_TEMP/numa-shim-oracle-linux.log"
          grep -F "test readme_vmem_integration_example_compiles_and_runs ... ok" "$RUNNER_TEMP/numa-shim-oracle-linux.log"
        shell: bash
        env:
          NUMA_SHIM_REQUIRE_ORACLE: "1"
      # task #778 (round-closing review, F9): crates/numa-shim had NO clippy
      # coverage anywhere in this file -- the four numa-shim-* jobs all ran
      # cargo test only, so a clippy regression here (e.g. the
      # GetCurrentProcess-unused-in-default-features bug F9 itself fixed)
      # had zero CI signal. `--all-features` here is now real-backend-only
      # (the mock is a build cfg, not a feature, so --all-features cannot
      # reach it); DEFAULT features is checked on numa-shim-windows below,
      # since Windows is this crate's own primary dev platform for its
      # Windows-only code.
      - run: cargo clippy -p numa-shim --all-features --all-targets -- -D warnings
      # task #1288: `--all-features` above can no longer reach the mock (it is
      # not a Cargo feature), so the mock arm gets this dedicated row — the
      # exact treatment aligned-vmem's conversion (task #962) gave its own mock
      # clippy coverage.
      - run: RUSTFLAGS="--cfg numa_shim_mock" cargo clippy -p numa-shim --all-targets -- -D warnings
      # task #1276 (N3, same review): numa-shim had ZERO rustdoc CI
      # coverage while its Cargo.toml pins a docs.rs feature set
      # (`vmem-integration`) narrower than `--all-features`. Per CLAUDE.md's
      # doc-lint rule (task #1142, the aligned-vmem-gates pattern above)
      # both rows are required because neither subsumes the other:
      # `--all-features` is now exactly the docs.rs set (the crate's only
      # remaining opt-in feature is `vmem-integration`; the mock is unreachable
      # via features entirely), while the derived row below builds exactly
      # what docs.rs renders.
      - run: RUSTDOCFLAGS="-D warnings" cargo doc -p numa-shim --all-features --no-deps
      - name: docs.rs feature-set doc build (mirrors package.metadata.docs.rs, not --all-features)
        run: |
          set -euo pipefail
          FEATURES=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "numa-shim") | .metadata.docs.rs.features | join(",")')
          echo "Derived docs.rs feature set: $FEATURES"
          test -n "$FEATURES"
          RUSTDOCFLAGS="-D warnings" cargo doc -p numa-shim --no-deps --features "$FEATURES"
      # task #1326 (P2-3 of the seventeenth independent review,
      # docs/reviews/2026-08-24-223343-numa-shim-publication-audit-oh.md;
      # independently found as F8 of the eighteenth,
      # docs/reviews/2026-08-24-224323-numa-shim-publication-audit-Sol-codex.md):
      # both rows above build numa-shim with `vmem-integration` ON (one
      # --all-features, one derived from docs.rs's pinned set, which for this
      # crate IS that feature), so three ungated intra-doc links to the
      # feature-gated `reserve_preferred_on_node` (crate platform matrix,
      # `NodeId::new`, `NodeResolution::TopologyUnavailable`) passed both while
      # DEFAULT features -- the exact configuration `cargo add numa-shim`
      # produces for a downstream consumer -- failed rustdoc with 3
      # unresolved-link errors. Same gate-blindness class as CLAUDE.md's
      # doc-lint rule (task #1142) and a recurrence of the broken-link class
      # task #1277 fixed here once with no recurrence guard; this row is that
      # guard. Mirrors the task #778 DEFAULT-features clippy row's rationale
      # (numa-shim-windows below): default features is what `cargo add
      # numa-shim` produces, and no feature-on row subsumes it.
      - run: RUSTDOCFLAGS="-D warnings" cargo doc -p numa-shim --no-deps
      # task #1356 (P3-5 of item 117's twenty-fifth independent review,
      # docs/correctness-open-items/TRACKED_publish_readiness.md): the three
      # rustdoc rows above never compile `pub mod mock` — it is gated behind
      # the build-time cfg `numa_shim_mock` (not a Cargo feature since task
      # #1288), so no combination of `--features`/`--all-features` can reach
      # it, and its public items (`MockCall`, `set_current_node`, `drain`,
      # `CALLS_CAP`, ...) had zero rustdoc coverage in CI — a broken
      # intra-doc link or rustdoc lint inside the module would pass every
      # row above. The cfg rides in RUSTDOCFLAGS, NOT RUSTFLAGS: cargo does
      # not forward RUSTFLAGS to rustdoc invocations (verified locally with
      # `cargo doc -v`: the rustdoc command line carries only the Cargo.toml
      # `[lints.rust unexpected_cfgs]`-derived `--check-cfg
      # 'cfg(numa_shim_mock)'`, never the cfg itself), so an
      # `RUSTFLAGS=... cargo doc` row would be green-and-dead — no mock docs
      # generated, zero warnings, exit 0. Inline `VAR=val` prefixes match
      # this job's own rows above (ubuntu bash; the `env:`-block form is the
      # Windows-shell workaround of task #1291, not needed here).
      - run: RUSTDOCFLAGS="--cfg numa_shim_mock -D warnings" cargo doc -p numa-shim --no-deps

  numa-shim-windows:
    # Run the numa-shim real-syscall path on a real Windows kernel.
    # `windows-latest` is single-NUMA (node=0), but that exercises the
    # FULL VirtualAllocExNuma + Reservation::from_raw_parts code path:
    # if alignment math, over-reserve sizing, or release_len is wrong,
    # the smoke test fault-ins, drops, or 8x repeat loop will SEGV / leak
    # / abort on ANY node — multi-node topology is not needed to catch
    # memory-safety bugs.  This closes the per-PR coverage gap for the
    # Windows VirtualAllocExNuma path (task #83).
    name: numa-shim real Windows kernel (correctness, not perf)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo test -p numa-shim
      - run: cargo test -p numa-shim --features vmem-integration
      # task #1288: mock via the build-time cfg (see the numa-shim-mock job's
      # sentinel rows; plain conversion here — the Linux job is the primary
      # mock-coverage home).
      #
      # task #1291: this job's `run:` steps default to `pwsh` (windows-latest
      # has no workflow-level `shell: bash` default), which does not
      # understand bash's `VAR=val cmd` prefix syntax — the inline
      # `RUSTFLAGS="--cfg ..." cargo ...` form landed by #1288 failed CI here
      # with "The term 'RUSTFLAGS=--cfg numa_shim_mock' is not recognized...".
      # An `env:` block is shell-agnostic (Actions sets the env var on the
      # child process before invoking the shell, regardless of shell), so it
      # works under both pwsh and bash without needing `shell: bash` too.
      # task #1299 (T8, item 103's twelfth independent readiness review): the
      # mock rows below previously had no `tee`+`grep -F` sentinel, unlike the
      # Linux job's own mock rows above ("`#![cfg(numa_shim_mock)]`-gated at
      # the top level, so a typo'd cfg compiles them to ZERO tests with exit 0
      # (green-and-dead) — the greps require one named test per FILE" — task
      # #1101 sentinel pattern, guarding against the task #1070 "Breakage B"
      # vacuous-green hazard). Adding the same sentinels here closes that gap.
      - run: |
          cargo test -p numa-shim 2>&1 | tee "$RUNNER_TEMP/numa-shim-windows-mock.log"
          grep -F "test current_node_records_scripted_value ... ok" "$RUNNER_TEMP/numa-shim-windows-mock.log"
          grep -F "test resolution_matches_current_node_resolved_zero ... ok" "$RUNNER_TEMP/numa-shim-windows-mock.log"
        shell: bash
        env:
          RUSTFLAGS: "--cfg numa_shim_mock"
      - run: |
          cargo test -p numa-shim --features vmem-integration 2>&1 | tee "$RUNNER_TEMP/numa-shim-windows-mock-vmem.log"
          grep -F "test reserve_preferred_on_node_records_args ... ok" "$RUNNER_TEMP/numa-shim-windows-mock-vmem.log"
        shell: bash
        env:
          RUSTFLAGS: "--cfg numa_shim_mock"
      # task #778 (round-closing review, F9): DEFAULT features is what
      # `cargo add numa-shim` produces for a downstream consumer -- checked
      # here (Windows, this crate's primary platform) rather than on the
      # Linux mock job above, alongside --all-features for the Windows-only
      # code paths (VirtualAllocExNuma, ProcessorNumber) clippy would
      # otherwise never see exercised.
      - run: cargo clippy -p numa-shim --all-targets -- -D warnings
      - run: cargo clippy -p numa-shim --all-features --all-targets -- -D warnings
      # task #1288: `--all-features` above can no longer reach the mock (it is
      # not a Cargo feature), so the mock arm gets this dedicated row — the
      # exact treatment the numa-shim-mock job's own mock clippy row gives it.
      # task #1291: `env:` block, not an inline `VAR=val` prefix — see the
      # note on this job's `cargo test` mock rows above for why.
      - run: cargo clippy -p numa-shim --all-targets -- -D warnings
        env:
          RUSTFLAGS: "--cfg numa_shim_mock"

  numa-shim-macos:
    # macOS has no public per-allocation NUMA API. task #1306: the reservation
    # path (`reserve_preferred_on_node`) surfaces this as an explicit
    # `Err(ReserveNumaError::UnsupportedPlatform)` (no silent unbound no-op —
    # see the module doc's platform-support table), while detection-only
    # calls (`current_node`) keep returning `None`. We still exercise the
    # smoke tests + mock dispatch to ensure the cross-platform compile + this
    # API contract don't regress. Lightweight per-PR coverage.
    name: numa-shim real macOS kernel (unsupported-platform contract)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test -p numa-shim
      - run: cargo test -p numa-shim --features vmem-integration
      # task #1288: mock via the build-time cfg
      # task #1299 (T8, item 103): add the same `tee`+`grep -F` sentinels the
      # Linux job's mock rows already carry ("compiles them to ZERO tests with
      # exit 0 (green-and-dead)" — task #1101 sentinel pattern, task #1070
      # "Breakage B" vacuous-green hazard) — this row previously had none.
      - run: |
          RUSTFLAGS="--cfg numa_shim_mock" cargo test -p numa-shim 2>&1 | tee "$RUNNER_TEMP/numa-shim-macos-mock.log"
          grep -F "test current_node_records_scripted_value ... ok" "$RUNNER_TEMP/numa-shim-macos-mock.log"
          grep -F "test resolution_matches_current_node_resolved_zero ... ok" "$RUNNER_TEMP/numa-shim-macos-mock.log"
        shell: bash
      # task #1325 (P2-2 of the seventeenth independent review,
      # docs/reviews/2026-08-24-223343-numa-shim-publication-audit-oh.md;
      # independently F2 of the eighteenth,
      # docs/reviews/2026-08-24-224323-numa-shim-publication-audit-Sol-codex.md):
      # the first CI row to combine the mock cfg with `vmem-integration` on a
      # target that is neither Linux nor Windows. tests/smoke.rs's three
      # platform branches were backend-blind (`cfg!(all(any(target_os =
      # "linux", windows), not(miri)))` — TARGET only, never BACKEND), so
      # under the mock on macOS they expected `Err(UnsupportedPlatform)`
      # while the mock arm (src/lib.rs, no platform check — task #1311/F6)
      # returns `Ok` / `InvalidArguments`: three false-red tests in exactly
      # the configuration README.md and src/lib.rs advertise ("assert the
      # wrapping logic ... on any target including macOS and miri"). No row
      # ran it before: this job's mock step above leaves the feature off,
      # and the Linux/Windows jobs that pair mock WITH the feature run on
      # targets where the old guard happened to take the supported branch
      # anyway. task #1325 made the three branches backend-aware; this row
      # is the fix's first EXECUTION proof (the Windows dev host cannot
      # reproduce the defect — its cfg!(windows) took the supported branch
      # before the fix too). The grep sentinels (task #1101 pattern, as in
      # the numa-shim-mock job's mock rows) name the three tests this fix is
      # about, so a green-and-dead or renamed-away run fails loudly. The
      # miri twin of this cell (mock + vmem-integration under miri) stayed
      # uncovered from task #1325 (recorded in its CHANGELOG entry) until
      # task #1356 (item 117's P3-5, twenty-fifth review): the
      # numa-shim-macos-miri job below now carries its own
      # mock+vmem-integration row with the same three sentinels.
      - run: |
          RUSTFLAGS="--cfg numa_shim_mock" cargo test -p numa-shim --features vmem-integration 2>&1 | tee "$RUNNER_TEMP/numa-shim-macos-mock-vmem.log"
          grep -F "test reserve_preferred_on_node_returns_valid_span ... ok" "$RUNNER_TEMP/numa-shim-macos-mock-vmem.log"
          grep -F "test reserve_preferred_on_node_large_align_round_trip ... ok" "$RUNNER_TEMP/numa-shim-macos-mock-vmem.log"
          grep -F "test reserve_preferred_on_node_rejects_zero_size_with_invalid_arguments ... ok" "$RUNNER_TEMP/numa-shim-macos-mock-vmem.log"
        shell: bash

  numa-shim-macos-miri:
    # Publish-readiness task #635 (P1, F1 of the 2026-08-06 numa-shim review):
    # `crates/numa-shim/src/lib.rs`'s `#[cfg(target_os = "macos")] mod platform`
    # block (the macOS stub) was missing the `not(miri)` guard that its three
    # sibling platform blocks (Linux, Windows, the unsupported-platform
    # fallback) all carry. Under macOS + miri simultaneously, BOTH that block
    # and the separate `#[cfg(miri)] mod platform` block (any-OS-under-miri
    # stub) satisfy their cfg at once, so `mod platform` is defined twice
    # (E0428) — a hard compile break on that one cell of the matrix. It was
    # never caught because every miri job in this workflow (`miri-core`,
    # `miri-alloc-core`, `miri-fastbin`, `miri-plain`) runs on `ubuntu-latest`,
    # and `numa-shim-macos` above runs plain `cargo test` — no job crosses
    # macOS x miri. This job is that missing cell: it compiles `numa-shim`
    # under miri on a real `macos-latest` runner, which is enough to catch
    # the specific `mod platform`-defined-twice class of bug (and any future
    # cfg divergence between the macOS and miri stub blocks) without
    # needing multi-node NUMA hardware — a plain `cargo miri test` on the
    # crate's own test suite exercises every `#[cfg(miri)]` arm.
    # `-p numa-shim` keeps the crate small enough that miri's interpreter
    # overhead is affordable per-PR (matching `numa-shim-macos`'s own
    # "lightweight per-PR coverage" framing above), unlike the heavier
    # `numa-real-kernel` job below which is scheduled/on-demand only.
    name: numa-shim macOS under miri (mod platform cfg regression guard)
    runs-on: macos-latest
    env:
      MIRIFLAGS: "-Zmiri-disable-isolation"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - run: cargo miri test -p numa-shim
      - run: cargo miri test -p numa-shim --features vmem-integration
      # task #1288: mock via the build-time cfg (RUSTFLAGS propagates through
      # cargo to the miri-driven compilation, same as the aligned-vmem miri
      # row's use of RUSTFLAGS cfgs)
      # task #1299 (T8, item 103): sentinel added — this is the only miri x
      # mock cell in the whole workflow, so a typo'd cfg compiling this row's
      # tests to zero and exiting 0 (task #1101/#1070 "Breakage B"
      # green-and-dead hazard) would otherwise go undetected here specifically.
      - run: |
          RUSTFLAGS="--cfg numa_shim_mock" cargo miri test -p numa-shim 2>&1 | tee "$RUNNER_TEMP/numa-shim-macos-miri-mock.log"
          grep -F "test current_node_records_scripted_value ... ok" "$RUNNER_TEMP/numa-shim-macos-miri-mock.log"
          grep -F "test resolution_matches_current_node_resolved_zero ... ok" "$RUNNER_TEMP/numa-shim-macos-miri-mock.log"
        shell: bash
      # task #1356 (P3-5 of item 117's twenty-fifth independent review,
      # docs/correctness-open-items/TRACKED_publish_readiness.md; framed by
      # the review itself as hardening, not a release blocker): the miri
      # twin of numa-shim-macos's mock+vmem-integration row above — the last
      # uncovered cell of this crate's {real, mock} x {default,
      # vmem-integration} miri matrix, a known gap since task #1325 (see
      # the now-updated comment on that job's row). The mock's positive
      # path is miri-compatible by construction: under `numa_shim_mock` the
      # smoke.rs platform branches all take the mock arm (task #1325 made
      # them backend-aware, target_os-independent), and the mock's
      # reservation comes from aligned-vmem's own `#[cfg(miri)]` backend
      # (crates/aligned-vmem/src/os/miri.rs), not a real mmap. Same three
      # sentinels as the non-miri twin above (task #1101 pattern; the task
      # #1070 "Breakage B" vacuous-green hazard): this is the workflow's
      # only miri x mock x feature cell, so a typo'd cfg or dropped feature
      # compiling its tests to zero would otherwise be undetected here
      # specifically.
      - run: |
          RUSTFLAGS="--cfg numa_shim_mock" cargo miri test -p numa-shim --features vmem-integration 2>&1 | tee "$RUNNER_TEMP/numa-shim-macos-miri-mock-vmem.log"
          grep -F "test reserve_preferred_on_node_returns_valid_span ... ok" "$RUNNER_TEMP/numa-shim-macos-miri-mock-vmem.log"
          grep -F "test reserve_preferred_on_node_large_align_round_trip ... ok" "$RUNNER_TEMP/numa-shim-macos-miri-mock-vmem.log"
          grep -F "test reserve_preferred_on_node_rejects_zero_size_with_invalid_arguments ... ok" "$RUNNER_TEMP/numa-shim-macos-miri-mock-vmem.log"
        shell: bash

  numa-real-kernel:
    # NUMA Phase 2: validate the real-kernel Linux integration path on every
    # scheduled run (weekly) and on-demand (workflow_dispatch).  The GitHub
    # Actions runner is single-NUMA, so the env-guarded tests in numa_alloc.rs
    # (SEFER_NUMA_TEST=1) run through their full code path — including mbind(2)
    # and sysfs reads — but on a kernel that only has one node.  That is still
    # far more coverage than Phase 1's pure-Rust mock: we prove that the
    # production feature combo compiles, links, and runs on a real Linux kernel
    # without panicking or hitting UB.
    #
    # Phase 2.1 follow-up (NOT done here): boot a QEMU guest with
    # `-numa node,nodeid=0,...  -numa node,nodeid=1,...` so the guest actually
    # shows two NUMA nodes and mbind steers pages between them.  The complexity
    # of reliably booting a QEMU guest in Actions (image download, KVM
    # availability, cloud-image driver quirks) warrants its own task.  For now,
    # `numactl --hardware` is informational only; `kvm-ok` is a soft probe
    # (`|| true`) so the job does not fail on hypervisors that block KVM.
    #
    # NOT per-push (too heavy for an allocator repo change): the `if:` guard
    # below keeps all other jobs unaffected.
    name: NUMA on real Linux kernel (numactl smoke + env-guarded tests)
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Install numactl
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y numactl
      - name: Probe host NUMA topology (informational)
        run: |
          numactl --hardware
          echo "---"
          # On a single-NUMA Actions runner this shows 1 node.  That is expected
          # and correct: the goal of this job is real-kernel compilation + runtime
          # coverage, not multi-node correctness (Phase 2.1 follow-up handles that).
          kvm-ok || true
      - name: Build (production + numa-aware)
        run: cargo build --features "production numa-aware"
      # `internals` added (R34-3/task #522): all three test files reach
      # `sefer_alloc::alloc_core::{numa, AllocCore}` directly.
      - name: Compile numa_alloc tests
        run: cargo test --features "production numa-aware internals" --test numa_alloc --no-run
      - name: Compile numa_segment_id tests
        run: cargo test --features "production numa-aware internals" --test numa_segment_id --no-run
      - name: Compile numa_seam tests
        run: cargo test --features "production numa-aware internals" --test numa_seam --no-run
      - name: Run numa_alloc tests (env-guarded)
        env:
          SEFER_NUMA_TEST: "1"
        run: cargo test --features "production numa-aware internals" --test numa_alloc -- --nocapture
      - name: Run numa_segment_id tests
        run: cargo test --features "production numa-aware internals" --test numa_segment_id -- --nocapture
      - name: Run numa_seam tests
        run: cargo test --features "production numa-aware internals" --test numa_seam -- --nocapture

  fuzz-build:
    # BUILD-ONLY gate for the libFuzzer targets (`region_ops`,
    # `global_alloc_ops`, `heap_core_ops`). Running the fuzzers is CPU-hour
    # heavy and lives on a separate scheduled/manual cadence (see
    # fuzz/README.md) — this job does NOT run them. It only compiles all three
    # targets on nightly so fuzz-target bit-rot (an API change that breaks a
    # harness) is caught per-push, not months later at the next campaign.
    name: fuzz targets build (nightly)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
        with:
          # cargo-fuzz links the sanitizer runtime against the *prebuilt* std of
          # the build target. Its default target on this runner resolves to
          # `x86_64-unknown-linux-musl`, whose std is NOT installed (E0463:
          # can't find crate for `std`). Force the gnu target below (its std
          # ships with the toolchain); add rust-src as belt-and-suspenders in
          # case a future cargo-fuzz build-std's the sanitizer runtime.
          targets: x86_64-unknown-linux-gnu
          components: rust-src
      - name: Install cargo-fuzz
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      # `cargo fuzz build` compiles every registered target under the fuzz
      # crate (its own workspace root); no target is executed. Pin the gnu
      # target so the sanitizer build links a std that actually exists on the
      # runner (see the toolchain note above).
      - name: Build fuzz targets
        working-directory: fuzz
        run: cargo +nightly fuzz build --target x86_64-unknown-linux-gnu

  fuzz-run:
    # R34-20 (task #539, audit finding G5): the `fuzz-build` job above compiles
    # all three libFuzzer targets on every push but NEVER runs them.
    # fuzz/README.md calls campaigns "scheduled/manual", but until this job
    # there was NO scheduled fuzz run in ANY workflow — the only `schedule:`
    # trigger in ci.yml drove `numa-real-kernel` and `feature-powerset`; the
    # three libFuzzer targets were build-checked-only. This job actually RUNS
    # each target for a bounded time (10 min) against its committed seed corpus
    # (fuzz/corpus/<target>/ — 8 seeds across the 3 targets, git-tracked),
    # WEEKLY + on-demand via workflow_dispatch — the same cadence as
    # `numa-real-kernel` and `feature-powerset`.
    #
    # NOT per-PR: 3 targets × 10 min = ~30 min is too heavy for every push, and
    # a fuzz-discovered invariant violation is a latent correctness discovery
    # (surfaced in at most a week), not a per-commit regression risk — the same
    # weekly rationale `feature-powerset` already uses. The `fuzz-build` job
    # above already catches fuzz-target BIT-ROT per-push (an API change that
    # breaks a harness compiles); this job catches fuzz FINDINGS (a real
    # invariant violation a long run surfaces).
    #
    # Verified clean before this job was added: all three targets smoke-tested
    # for 15s each under WSL with 0 crashes (region_ops: 305 780 runs,
    # global_alloc_ops: 965 runs, heap_core_ops: 24 783 runs). A target finding
    # a crash (ASAN/UB/panic) makes this job go RED — that is the signal this
    # job exists to produce, not a flaky failure.
    name: fuzz targets run (weekly, 10 min/target)
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
        with:
          # Same musl/gnu-target note as `fuzz-build` above: cargo-fuzz links
          # against the prebuilt std of the build target; the runner's default
          # resolves to x86_64-unknown-linux-musl whose std is NOT installed
          # (E0463). Force the gnu target (its std ships with the toolchain).
          targets: x86_64-unknown-linux-gnu
          components: rust-src
      - name: Install cargo-fuzz
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      # Each target runs for 10 min (libFuzzer's -max_total_time bounds the wall
      # clock). cargo-fuzz auto-discovers each target's seed corpus from
      # fuzz/corpus/<target>/. A crash (ASAN/UB/panic) exits non-zero and fails
      # the step — exactly the signal this weekly gate exists to produce. The
      # runner is ephemeral, so any new corpus entries or crash artifacts
      # written during the run are discarded (the committed seeds are the stable
      # starting point).
      - name: fuzz run region_ops (10 min)
        working-directory: fuzz
        run: cargo +nightly fuzz run region_ops --target x86_64-unknown-linux-gnu -- -max_total_time=600
      - name: fuzz run global_alloc_ops (10 min)
        working-directory: fuzz
        run: cargo +nightly fuzz run global_alloc_ops --target x86_64-unknown-linux-gnu -- -max_total_time=600
      - name: fuzz run heap_core_ops (10 min)
        working-directory: fuzz
        run: cargo +nightly fuzz run heap_core_ops --target x86_64-unknown-linux-gnu -- -max_total_time=600

  docs:
    name: rustdoc
    runs-on: ubuntu-latest
    # `RUSTDOCFLAGS: "-D warnings"` removed for the same reason as the top-level
    # `-D warnings` removal — many intra-doc links into `#[doc(hidden)]`
    # modules produce warnings that are not PR blockers.
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      # All-features so every intra-doc link (including the gated tiers) resolves.
      - run: cargo doc --no-deps --all-features

  deny:
    # SEC-5 (task #202): machine-check RustSec advisories AND license
    # compatibility in one job, closing the §1.3 / §1.6 #3 / §2.2 gap from
    # docs/security/SECURITY_COMPLIANCE_AUDIT_2026-07-06.md. Uses cargo-deny
    # (not cargo-audit alone) because it covers BOTH concerns in one tool.
    # `cargo deny check` with no sub-args runs all four check categories
    # (advisories, licenses, bans, sources) — kept broad so a future bans or
    # source-policy tightening (currently permissive per the task scope) is
    # already wired into the job. Config lives at repo-root `deny.toml`.
    name: cargo-deny (advisories + licenses)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo deny check

  feature-powerset:
    # R14-10 (task #295, P2 process): a cargo-hack `--feature-powerset
    # --depth 2` structural sweep of feature COMBINATIONS, motivated by a
    # concrete miss this project already paid for: R13-12 (task #285) was a
    # real pre-existing E0599 compile error reachable only by the specific
    # combination `alloc-xthread`+`fastbin`+`alloc-decommit` WITHOUT
    # `alloc-segment-directory` — a combination none of `production`,
    # `--all-features`, nor any single hand-written `test-feature-isolation`
    # row (above) ever exercised, because `production` always turns
    # `alloc-segment-directory` on alongside the other three, and
    # `--all-features` turns every feature on together. That class of bug —
    # "compiles under every combination a human happened to write down, fails
    # under one nobody did" — is exactly what a structural powerset sweep
    # catches without anyone having to anticipate the specific pairing.
    #
    # Evaluation (documented per the task brief, since this is new CI
    # surface): `cargo hack check --feature-powerset --depth 2 --no-dev-deps`
    # against this crate's top-level Cargo.toml features resolves to a few
    # hundred distinct `cargo check` invocations (308 at adoption, 365 as of
    # 2026-08-20 — the count drifts upward as features accrete, so re-derive
    # it via `cargo hack ... --print-command-list | grep -c '^cargo check'`
    # rather than quoting either figure, per this repo's no-hardcoded-counts
    # convention, task #776/F10; the adoption figure was measured with
    # `cargo hack ... --dry-run`, a flag current cargo-hack no longer ships
    # — it is forwarded to cargo, which rejects it — and
    # `--print-command-list` is today's equivalent). Depth-2 keeps the sweep
    # polynomial — on the order of C(n,2)+n+1 invocations, where n is the
    # count of `[features]` entries in the root Cargo.toml (29 as of
    # 2026-08-20; re-derive via `awk '/^\[features\]/{f=1;next} /^\[/{f=0}
    # f && /^[a-z0-9-]+ *=/{c++} END{print c}' Cargo.toml`) — not the full
    # 2^n exponential powerset `--depth` unbounded would be.
    # `cargo check` (not `build`/`test`) per combination keeps each individual
    # invocation cheap (typechecking only, no codegen/link/test-binary build),
    # but a few hundred of them is still substantial per-PR cost on top of
    # the existing ~13-job matrix. Decision: run this WEEKLY (mirroring the
    # `numa-real-kernel` job's established schedule-gated pattern above, same
    # `schedule`/`workflow_dispatch` trigger already wired into this
    # workflow's top-level `on:`) plus on-demand via `workflow_dispatch`, NOT
    # on every push/PR — the E0599-class bug this catches is a structural
    # feature-matrix gap, not a per-commit regression risk, so a bounded
    # weekly cadence closes the actual gap (this bug lived unnoticed for an
    # entire round, not a single day) without taxing every PR with ~300 extra
    # check invocations. `--no-dev-deps` keeps the powerset scoped to the
    # library's own feature graph (dev-dependencies would otherwise force
    # every combination to also resolve the test/bench dependency set, which
    # is unrelated to what this job is checking).
    name: cargo-hack feature-powerset (depth 2, check-only, weekly)
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-hack
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-hack
      - name: cargo hack check --feature-powerset --depth 2
        run: cargo hack check --feature-powerset --depth 2 --no-dev-deps
      # Task #856/W14-3: aligned-vmem crate feature-powerset check. 5 features
      # (lazy-commit, alloc-lazy-commit alias, huge-pages, fault-injection,
      # bench-internals) — mock is no longer a Cargo feature (task #962,
      # converted to the build-time --cfg aligned_vmem_mock flag, outside
      # cargo-hack's feature space entirely). Invocation count shrank
      # accordingly; re-derive via --print-command-list if a specific number
      # is needed (this repo's convention avoids hardcoded counts per task
      # #776/F10; --dry-run, named in this comment before task #1242, no
      # longer exists in current cargo-hack — it is forwarded to cargo, which
      # rejects it). Added to the same weekly cadence as the root crate's
      # powerset job for consistency.
      #
      # Task #1242 (acting on task #1240's measurement,
      # docs/reviews/2026-08-20-feature-powerset-test-target-gap.md):
      # --no-dev-deps was REPLACED by --all-targets — cargo-hack
      # hard-rejects the pair ("--no-dev-deps may not be used together with
      # --all-targets"), and the dropped flag protected nothing here
      # (aligned-vmem has an empty [dependencies] section). The step now
      # also typechecks tests/benches/examples per combination — the #1231
      # class (gate mismatches visible only under feature combinations no
      # hand-written row builds) — at measured-trivial cost (same invocation
      # count; ~1.45x wall in #1240's local measurement). The ROOT step
      # above deliberately KEEPS --no-dev-deps: the root crate is born-red
      # under --all-targets (one ungated test file — `concurrent_stress.rs`,
      # no `#![cfg]` at all — one WRONGLY-gated test file, and a deliberate
      # compile-fail example tripwire) — that is a decision, not an
      # oversight; see docs/CORRECTNESS_OPEN_ITEMS.md item 95 before
      # "finishing" this.
      - name: cargo hack check --feature-powerset --depth 2 (aligned-vmem)
        run: cargo hack check --feature-powerset --depth 2 -p aligned-vmem --all-targets
