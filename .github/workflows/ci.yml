          guard=$(grep '^error:' /tmp/tis_thumbv6m_check.log | grep -c 'requires a target with native 64-bit atomics' || true)
          echo "numbered cascade errors: $cascade / named error lines: $named / named-guard hits: $guard"
          if [ "$cascade" != "0" ] || [ "$named" != "1" ] || [ "$guard" != "1" ]; then
