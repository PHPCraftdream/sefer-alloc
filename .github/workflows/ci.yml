  licenses:
    name: license compatibility (only when dependencies changed)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: Self-test the fingerprint and the coverage check
        run: |
          node scripts/license-check-fingerprint.mjs --selftest
          node scripts/license-check-workspaces.mjs --selftest
      - name: Every Cargo workspace and third-party action is covered
        run: node scripts/license-check-workspaces.mjs --check
      - name: Dependency-set fingerprint
        id: fp
        run: |
          set -euo pipefail
          cargo metadata --locked --no-deps --format-version 1 > "$RUNNER_TEMP/members.json"
          node scripts/license-check-fingerprint.mjs --metadata "$RUNNER_TEMP/members.json" --tool "$(cargo deny --version)"
      - name: Did this dependency set already pass?
        id: seen
        uses: actions/cache/restore@v4
        with:
          path: .license-check-pass
          key: license-check-${{ steps.fp.outputs.fingerprint }}
          lookup-only: true
      - name: cargo deny check licenses bans sources (every Cargo workspace)
        if: steps.seen.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          node scripts/license-check-workspaces.mjs --list > "$RUNNER_TEMP/workspaces.txt"
          while read -r dir; do
            echo "::group::$dir"
            cargo deny --manifest-path "$dir/Cargo.toml" --locked check licenses bans sources
            echo "::endgroup::"
          done < "$RUNNER_TEMP/workspaces.txt"
      - name: Record the passed fingerprint
        if: steps.seen.outputs.cache-hit != 'true'
        env:
          FINGERPRINT: ${{ steps.fp.outputs.fingerprint }}
        run: |
          mkdir -p .license-check-pass
          printf '%s\n' "$FINGERPRINT" > .license-check-pass/fingerprint
      - if: steps.seen.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .license-check-pass
          key: license-check-${{ steps.fp.outputs.fingerprint }}
      - name: Report
        env:
          HIT: ${{ steps.seen.outputs.cache-hit }}
          FINGERPRINT: ${{ steps.fp.outputs.fingerprint }}
        run: |
          if [ "$HIT" = "true" ]; then
            msg="license check skipped: dependency set $FINGERPRINT already passed"
          else
            msg="license check ran and passed for dependency set $FINGERPRINT"
          fi
          echo "$msg" | tee -a "$GITHUB_STEP_SUMMARY"

