name: CI

# Phase 5 hardening + publish-prep gate. Runs the full verification matrix the
# PLAN calls for: fmt, clippy (pedantic), the test suite across feature sets,
# miri on the invariant + byte tests, a no_std build, and a multi-arch matrix
# (x86_64 + aarch64) for weak-memory coverage. The cargo-fuzz and the
# multi-arch cross runs are documented intent here; cargo-fuzz has its own
# scheduled/nightly cadence (see fuzz/README.md) because it is CPU-hour heavy.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'   # NUMA real-kernel job (weekly Monday 06:00 UTC)
  workflow_dispatch:

# SEC-4 (task #201): least-privilege token scope. No job in this workflow
# performs any write to the repo contents (no `git push`, no release creation,
# no PR/issue comment) — every job is a read-only check (checkout + cargo).
# Pin the workflow-level GITHUB_TOKEN to read-only contents so the job default
# cannot widen it even if the repo default token were read/write.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # `-D warnings` is the strict-CI policy (Phase F3, task #124). Re-enabled
  # after a dedicated warnings-cleanup pass: the 6 pre-existing lib findings
  # (needless_range_loop in `refill_class`, manual_is_multiple_of in
  # `class_for`, 4x doc_lazy_continuation in the `tcache` doc comment) plus
  # a handful of test-file / sibling-crate findings (manual_is_multiple_of
  # in `crates/numa-shim`, manual_dangling_ptr in `tests/numa_seam.rs`,
  # zero_repeat_side_effects / assertions_on_constants in two other test
  # files, annotated `#[allow]` with rationale where the lint's suggested
  # fix would have changed test semantics) were fixed or explicitly
  # annotated. Verified clean under `cargo clippy --all-targets <features>
  # -- -D warnings` for every feature combination in the `clippy` and
  # `test` matrices below at the time this was re-enabled.

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  sefer-region-gates:
    # Task #793/F15: permanent release-gating checks for sefer-region beyond
    # what test-workspace already covers (that job already runs `cargo test
    # -p sefer-region` default-features and the `--no-default-features`
    # bare-metal `thumbv7em-none-eabi` build -- not duplicated here).
    name: sefer-region package gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo clippy -p sefer-region --all-features --all-targets -- -D warnings
      - run: cargo clippy -p sefer-region --no-default-features --all-targets -- -D warnings
      - run: RUSTDOCFLAGS="-D warnings" cargo doc -p sefer-region --all-features --no-deps
      # F15's "host tests under --no-default-features" -- the existing
      # test-workspace job only cross-BUILDS this configuration for the
      # bare-metal target; it never TESTS it on a host target with std
      # (SyncRegion, all `#[cfg(feature = "std")]` code) compiled out.
      - run: cargo test -p sefer-region --no-default-features
      # Packaging verification -- confirms the crate packages and its
      # isolated build succeeds against the published manifest. This is
      # NOT the same guarantee as F14's "run the benchmark from an
      # extracted tarball with no ancestor workspace" concern (that
      # would additionally require extracting the tarball to a scratch
      # directory and running `cargo bench` there, which is not automated
      # here -- see region_bench.rs's own comment on why: bench-scale-tool
      # 0.1.0 exposes no public API to redirect its manifest path, so the
      # exposure the finding describes is upstream, not fixable from this
      # step).
      - run: cargo publish --dry-run -p sefer-region
      - name: Install cargo-semver-checks
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-semver-checks
      # sefer-region 0.1.0 is published on crates.io (task #785/F1's own
      # finding); cargo-semver-checks fetches that baseline from the
      # registry automatically, no local tag needed.
      #
      # Scope of this gate (task #806/F3 -- corrected from an earlier comment
      # that overstated it): cargo-semver-checks compares the *shape* of the
      # public API from rustdoc JSON -- signatures, item presence/absence,
      # trait impls -- against the last published baseline. It does NOT
      # analyze runtime/behavioral semantics (e.g. task #802/F2's Handle<T>
      # cross-Region-identity change was a real breaking change in behavior
      # that this tool reported as "no change; assume minor" / "no semver
      # update required", because the public signatures involved did not
      # change shape). It also does NOT check whether the version in
      # Cargo.toml has already been published -- that is a distinct concern
      # checked separately by the named step below so the two failure
      # classes are distinguishable in the Actions UI. A real failure from
      # this step is still a real gate for the class of bug it DOES cover --
      # no `|| true` swallowing it.
      - run: cargo semver-checks check-release --package sefer-region
      - name: Check whether this version is already published
        # Distinct concern from cargo-semver-checks above (see that step's
        # comment): this checks whether the version currently in
        # crates/sefer-region/Cargo.toml is already present in the crates.io
        # sparse index, which cargo-semver-checks does not check and a
        # rustdoc-shape-only "no change" verdict can coexist with.
        #
        # Non-blocking by design (task #865-followup): sefer-region 0.2.0
        # was published between rounds, and this job runs on every push to
        # `main`, not just on a release commit -- a hard `exit 1` here made
        # every ordinary post-release push permanently red until the next
        # intentional version bump, which is the expected steady state, not
        # a regression. Downgraded to a `::warning::` annotation: the actual
        # backstop against publishing an already-taken version still exists
        # independent of this step -- `cargo publish` itself rejects an
        # already-taken version at crates.io, so nothing is unguarded by
        # making this informational. Bump the version in
        # crates/sefer-region/Cargo.toml only when actually preparing a new
        # release, not to silence this warning.
        run: |
          set -euo pipefail
          version=$(cargo metadata --format-version=1 --no-deps \
            | jq -r '.packages[] | select(.name == "sefer-region") | .version')
          echo "Local sefer-region version: $version"
          index_json=$(curl -sSf https://index.crates.io/se/fe/sefer-region)
          if echo "$index_json" | jq -e --arg v "$version" 'select(.vers == $v)' >/dev/null; then
            echo "::warning::sefer-region $version is already published on crates.io. This is expected on ordinary commits after a release -- CI does not block on it (an actual \`cargo publish\` of an already-taken version fails at crates.io itself regardless). Bump the version in crates/sefer-region/Cargo.toml only when preparing an actual new release."
          else
            echo "OK: sefer-region $version is not yet on crates.io."
          fi

  aligned-vmem-gates:
    # Task #847/V18: clippy coverage for the aligned-vmem crate. Previously
    # only `cargo test -p aligned-vmem --no-run` compiled library + integration
    # tests; `benches/vmem_bench.rs` was never compiled in CI, so renaming any
    # public API used by the bench left CI green. Task #846 proved two clippy
    # rows are required: --all-features (covers all optional features) and
    # default (caught the inverted #[cfg_attr] dead_code bug that #846 fixed);
    # a third row exercises the explicit named full feature set (identical backend
    # coverage to --all-features minus the compat alias). Mock-arm clippy coverage
    # moved to its own dedicated RUSTFLAGS row after task #962 (mock is now the
    # --cfg aligned_vmem_mock build flag, not a Cargo feature).
    # Task #851: miri compilation check — catches E0308 tuple-arity mismatches
    # that block publication but are invisible to the other checks.
    name: aligned-vmem package gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # Task #846 proved this combination catches the inverted #[cfg_attr]
      # dead_code bug that shipped undetected when only --all-features ran.
      - run: cargo clippy -p aligned-vmem --all-targets -- -D warnings
      # Task #1231: `huge-pages` WITHOUT `bench-internals`, on a Unix target.
      # This runner IS the unix target, which is the whole point — the local
      # gate's `--features huge-pages` row runs on the host (Windows), where
      # the linux/android-gated tests are compiled out, so it is vacuous for
      # this class.
      #
      # Every other row in this job that names `huge-pages` also names
      # `bench-internals`, and so did every row in every other job (verified
      # by enumeration, task #1231). That blind spot was not theoretical: a
      # `SERIAL.lock()` use with no `#[cfg]` of its own, inside a test gated
      # only on `any(linux, android) + huge-pages`, referenced a `static
      # SERIAL` gated on `bench-internals` — E0425 in exactly this row,
      # continuously from `2828e04` (task #1174, which introduced the test)
      # until `5979275` (task #1223) closed it. Nothing built this row for
      # that entire window.
      #
      # `--all-targets` is load-bearing: the weekly `feature-powerset` job
      # DOES compile this feature combination for this crate, but with
      # `--no-dev-deps`, so it builds lib+bins only and never `tests/` —
      # blind to this defect class by construction.
      - run: cargo check -p aligned-vmem --all-targets --features huge-pages
      # R1/Q3: Mock is no longer a Cargo feature (converted to the build-time
      # --cfg aligned_vmem_mock flag in task #962), so --all-features no longer lints
      # the MOCK arm instead. Both this named-feature row and the --all-features
      # row above lint the real backend; the mock arm gets its own RUSTFLAGS row below.
      - run: cargo clippy -p aligned-vmem --features "lazy-commit huge-pages fault-injection bench-internals" --all-targets -- -D warnings
      # Full feature set: lazy-commit (incl. the alloc-lazy-commit compat alias),
      # huge-pages, fault-injection, bench-internals (all "off by default", so
      # --all-features is the union). Real backend only — mock unreachable via
      # features since task #962 (--cfg aligned_vmem_mock flag instead).
      - run: cargo clippy -p aligned-vmem --all-features --all-targets -- -D warnings
      # Task #962: mock-arm clippy coverage. `mock` is no longer a Cargo
      # feature (converted to the build-time `--cfg aligned_vmem_mock` flag —
      # cfg flags do not unify across the dependency graph, unlike features),
      # so `--all-features` no longer compiles the mock backend. This row
      # lints the mock cfg arm explicitly, mirroring the rows below.
      - run: cargo clippy -p aligned-vmem --features "lazy-commit huge-pages fault-injection bench-internals" --all-targets -- -D warnings
        env:
          RUSTFLAGS: "--cfg aligned_vmem_mock"
      # Basic sanity check that the crate's tests pass (library + integration
      # tests; does NOT run benchmarks -- bench targets are not #[test] functions).
      # Now runs the REAL backend since mock is cfg-gated off (task #962).
      - run: cargo test -p aligned-vmem --all-features
      # Task #962: mock-backend test coverage under the `--cfg aligned_vmem_mock`
      # build flag (previously this coverage came from `--all-features`, which
      # can no longer turn on mock — it is not a Cargo feature anymore).
      # Task #1101: tee + grep postcondition, same self-verifying shape as
      # the mock-release row below — tests/mock.rs and
      # tests/mock_reentrancy.rs are BOTH `#![cfg(aligned_vmem_mock)]`-gated
      # at the top level, so a typo'd cfg compiles them to ZERO tests with
      # exit 0 (green-and-dead); the two greps require one named test per
      # FILE. `shell: bash` for -o pipefail (see the mock-release row).
      - run: |
          cargo test -p aligned-vmem --features "lazy-commit huge-pages fault-injection bench-internals" 2>&1 | tee "$RUNNER_TEMP/vmem-mock-debug.log"
          grep -F "test records_reserve_and_decommit ... ok" "$RUNNER_TEMP/vmem-mock-debug.log"
          grep -F "test reentrancy_is_silently_dropped_with_outer_record_intact ... ok" "$RUNNER_TEMP/vmem-mock-debug.log"
        shell: bash
        env:
          RUSTFLAGS: "--cfg aligned_vmem_mock"
      # Task #1086 (L10): the RELEASE half of the mock decommit-contract
      # oracle — `method_records_nothing_for_a_violated_range_in_release_mock`
      # (tests/reservation_decommit_contract.rs) is gated
      # all(aligned_vmem_mock, not(debug_assertions)), and before this row no
      # row anywhere combined the mock cfg with --release, so it executed
      # nowhere. Scoped to the one test target to keep the release-compile
      # cost minimal; the grep keeps the row self-verifying the same way the
      # forced-page rows above are. Explicit `shell: bash` for `-o pipefail`
      # (the linux default shell runs without it, which would let a cargo
      # failure hide behind the tee pipeline's exit status).
      - run: |
          cargo test --release -p aligned-vmem --features "lazy-commit huge-pages fault-injection bench-internals" --test reservation_decommit_contract 2>&1 | tee "$RUNNER_TEMP/reservation-decommit-release-mock.log"
          grep -F "test method_records_nothing_for_a_violated_range_in_release_mock ... ok" "$RUNNER_TEMP/reservation-decommit-release-mock.log"
        shell: bash
        env:
          RUSTFLAGS: "--cfg aligned_vmem_mock"
      # Task #1141 (L2): the row above was the ONLY release-profile coverage
      # this crate had, and it runs under `--cfg aligned_vmem_mock` against a
      # single test target — so every `not(debug_assertions)` behaviour of the
      # REAL Unix/Windows backends went untested in release. That gap matters
      # more here than it would elsewhere: this crate's contract-violation
      # tripwires are `debug_assert!`, i.e. precisely the code whose behaviour
      # DIFFERS between profiles, and several public methods document a
      # "silent no-op in release" half that no debug row can ever exercise.
      # Kept as a SEPARATE row rather than folded into the mock one above: the
      # mock row tests a different property (a violated contract must never
      # reach the recorder), which the real backend cannot express.
      # Self-verifying (tee + `grep -F`) for the same reason as its
      # neighbours — a row that compiled zero tests would pass green and dead.
      # The sentinel names a test present in EVERY feature configuration, so a
      # feature change cannot silence it, and `scripts/verify-ci-sentinels.mjs`
      # (task #1150) checks the string against that test's real attributes.
      - run: |
          cargo test -p aligned-vmem --all-features --release --no-fail-fast 2>&1 | tee "$RUNNER_TEMP/vmem-release-real.log"
          grep -F "test reserve_is_aligned_and_writable ... ok" "$RUNNER_TEMP/vmem-release-real.log"
        shell: bash
      # Task #1095 (H1): the page-size-override FLOOR test — the only test
      # pinning the task #1085 fix (set_page_size_override must reject a page
      # below the host's real one; a declared publication blocker). The test
      # file is `#![cfg(aligned_vmem_page_size_override)]`-gated at the top
      # level, so without the cfg it compiles ZERO tests and passes
      # green-and-dead. The test-windows forced-page rows set that cfg but
      # build only ROOT-crate test targets, and this job's -p aligned-vmem
      # rows build the package's own test targets without the cfg — so before
      # this row the test executed in no CI row anywhere (plain `cargo test
      # -p aligned-vmem --all-features --test page_size_override` prints
      # "running 0 tests"). Same task #1086 self-verifying shape as the
      # mock-release row above (tee + grep -F under `shell: bash`, so
      # -o pipefail applies); ubuntu's $RUNNER_TEMP is a clean POSIX path,
      # so the Windows mixed-separator note in test-windows does not apply
      # to this row.
      - run: |
          cargo test -p aligned-vmem --all-features --test page_size_override 2>&1 | tee "$RUNNER_TEMP/page-size-override.log"
          grep -F "test override_floor_is_the_real_os_page_size ... ok" "$RUNNER_TEMP/page-size-override.log"
        shell: bash
        env:
          RUSTFLAGS: "--cfg aligned_vmem_page_size_override"
      # Task #1139: the failed-OS-page-size-query oracle — the only test
      # pinning the fail-CLOSED poison (a failed query must NOT be folded to
      # 4 KiB and cached as if it were a real answer). Same
      # `#![cfg(aligned_vmem_page_size_override)]` top-level gate, and
      # therefore the same green-and-dead hazard, as the floor row above, so
      # it carries the same self-verifying tee + grep -F shape: the named test
      # must actually RUN, not merely compile to an empty binary. It needs its
      # own row rather than folding into the row above because cargo builds
      # one `--test` target per invocation.
      - run: |
          cargo test -p aligned-vmem --all-features --test page_size_query_failure 2>&1 | tee "$RUNNER_TEMP/page-size-query-failure.log"
          grep -F "test failed_os_page_size_query_fails_closed ... ok" "$RUNNER_TEMP/page-size-query-failure.log"
        shell: bash
        env:
          RUSTFLAGS: "--cfg aligned_vmem_page_size_override"
      # Task #1173/L1: the poison-must-not-PANIC oracle — the third member of
      # this same family, and it arrived with the same hazard. Its file is
      # `#![cfg(aligned_vmem_page_size_override)]`-gated too, so without this
      # row `cargo test -p aligned-vmem --all-features --test
      # decommit_poison_no_panic` compiles to an EMPTY binary and prints
      # "running 0 tests" while reporting ok — measured, not assumed, before
      # this row was added. It pins the removal of a `debug_assert!(false,
      # ..)` that made `decommit` panic in debug builds under a poisoned
      # page-size query, contradicting both `page_size()`'s rustdoc and the
      # README's "never panics" list (which task #1145's own commit `4cba9c1`
      # had already recorded panicking as a REJECTED design option). Same
      # self-verifying tee + grep -F shape and its own row, for the same
      # one-`--test`-target-per-invocation reason as the two rows above.
      - run: |
          cargo test -p aligned-vmem --all-features --test decommit_poison_no_panic 2>&1 | tee "$RUNNER_TEMP/decommit-poison-no-panic.log"
          grep -F "test method_decommit_is_a_silent_no_op_under_poison ... ok" "$RUNNER_TEMP/decommit-poison-no-panic.log"
        shell: bash
        env:
          RUSTFLAGS: "--cfg aligned_vmem_page_size_override"
      # Task #851: miri compilation gate. NO miri interpreter required — this
      # is just `cargo check` with the `miri` cfg set, which catches the
      # E0308 tuple-arity mismatch that shipped in #844 and blocked 0.2.0.
      # Since task #962, the mock cfg rides along (--cfg aligned_vmem_mock)
      # to preserve the previously-incidental mock+miri type coverage.
      - run: RUSTFLAGS="--cfg miri --cfg aligned_vmem_mock" cargo check -p aligned-vmem --all-features
      # Finding II-14 (2026-08-16 prerelease audit): 32-bit Unix exact-size fast
      # path has zero CI coverage. Add at least a compile-only check for i686
      # to catch regressions in the cfg-gated `try_reserve_aligned_exact` path.
      # Finding II-1 (2026-08-16 closing review): add musl 32-bit target to compile-verify
      # that the correct `off_t` arm is selected (gated `not(target_env = "musl")`).
      # Finding II-14 (2026-08-16 closing review): extend coverage to tests and optional features.
      - run: rustup target add i686-unknown-linux-gnu
      - run: cargo check --target i686-unknown-linux-gnu --all-targets --features "lazy-commit huge-pages fault-injection bench-internals" -p aligned-vmem
      - run: rustup target add i686-unknown-linux-musl
      - run: cargo check --target i686-unknown-linux-musl --all-targets --features "lazy-commit huge-pages fault-injection bench-internals" -p aligned-vmem
      # R6-6 (2026-08-16 aligned-vmem prerelease audit): doc warnings, packaging, and
      # semver gates — matching sefer-region-gates' coverage. aligned-vmem has no
      # path dependencies (empty [dependencies]), so full `cargo publish --dry-run`
      # works without modification.
      - run: RUSTDOCFLAGS="-D warnings" cargo doc -p aligned-vmem --all-features --no-deps
      # Task #1142: `--all-features` above is the ONE feature set docs.rs never
      # actually builds with — `package.metadata.docs.rs.features` in
      # Cargo.toml deliberately pins a narrower, publication-facing set
      # (`lazy-commit`/`huge-pages`/`fault-injection`, excluding
      # `bench-internals`), so a warning-free `--all-features` row does not
      # prove the docs that actually render on docs.rs are warning-free. Four
      # `crate::bench_internals::huge_decommit_attempts` intra-doc links were
      # dead exactly under that narrower set (bench_internals is compiled only
      # under `bench-internals`) while invisible to both the row above and to
      # plain `cargo doc` with no features, because default features carries
      # two ADDITIONAL unrelated dead links (`reserve_aligned_huge`, gated on
      # `huge-pages`, which IS in the docs.rs set and so is NOT dead there) —
      # neither existing row is the configuration that ships. This row derives
      # the exact feature list from Cargo.toml via `cargo metadata` + `jq`
      # (both already available on `ubuntu-latest`; `jq` already used earlier
      # in this same workflow) rather than hardcoding a second copy of the
      # list, so the two cannot drift apart the way `Cargo.toml`'s own comment
      # on that key already warns readers to keep in sync manually.
      - name: docs.rs feature-set doc build (mirrors package.metadata.docs.rs, not --all-features)
        run: |
          set -euo pipefail
          FEATURES=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "aligned-vmem") | .metadata.docs.rs.features | join(",")')
          echo "Derived docs.rs feature set: $FEATURES"
          test -n "$FEATURES"
          RUSTDOCFLAGS="-D warnings" cargo doc -p aligned-vmem --no-deps --features "$FEATURES"
      - run: cargo publish --dry-run -p aligned-vmem
      - name: Install cargo-semver-checks
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-semver-checks
      # aligned-vmem 0.1.0 is published on crates.io; cargo-semver-checks fetches
      # that baseline from the registry automatically, no local tag needed.
      #
      # HONEST SCOPE FOR THE CURRENT 0.1.0 -> 0.2.0 DELTA: this step runs ZERO
      # of its 254 lints today and therefore cannot fail today. Measured
      # locally at task #1039 (verbatim output):
      #
      #   Checking aligned-vmem v0.1.0 -> v0.2.0 (major change)
      #    Checked [   0.000s] 0 checks: 0 pass, 254 skip
      #    Summary no semver update required
      #
      # The reason is structural, not a misconfiguration: for a 0.x crate a
      # minor bump IS the major bump, so once the version is already 0.2.0
      # every major-breaking lint is skipped as "already accounted for" --
      # exactly what 0.2.0's documented BREAKING change
      # (`Reservation::from_raw_parts` gained a `granted_huge` parameter, see
      # crates/aligned-vmem/CHANGELOG.md) requires. The step is kept anyway because it
      # becomes discriminating the moment 0.2.0 is the published baseline: a
      # later 0.2.1/0.2.x that breaks API shape then fails here. Until then,
      # do NOT read a green result from this step as "no unintended breaking
      # changes" -- it is not evidence of that.
      #
      # Scope limit that survives the version bump (same caveat as the
      # sefer-region step above): cargo-semver-checks compares the SHAPE of
      # the public API from rustdoc JSON -- signatures, item presence/absence,
      # trait impls. It does NOT analyze runtime/behavioral semantics, and it
      # does NOT check whether the version in Cargo.toml is already published.
      # No `|| true` and no `continue-on-error` here: when it does have teeth,
      # it is a real gate.
      - run: cargo semver-checks check-release --package aligned-vmem

  aligned-vmem-hugetlb-real:
    # Task #1151: the ONLY row anywhere that gives `reserve_aligned_huge` a
    # real HugeTLB pool to draw from. Without it, every huge-page test on
    # every runner takes the "no pool configured" fallback and the crate's
    # actual `MAP_HUGETLB` path is never executed.
    #
    # It FAILS LOUDLY if the pool cannot be configured, rather than skipping.
    # A skip would reproduce this repository's most-repeated defect exactly —
    # a row that runs, reports success, and proves nothing (see item 80, and
    # tasks #1086/#1101/#1131). If a future runner image stops permitting
    # `nr_hugepages`, this job going red IS the intended signal: the coverage
    # it claims would otherwise have silently evaporated.
    #
    # Task #1152 (F1): the row originally added by task #1151 ran only
    # `--test huge_pages`, which contains ZERO decommit tests (verified:
    # `grep -c decommit crates/aligned-vmem/tests/huge_pages.rs` -> 0) — so
    # despite this job's own comment and commit `88c5f3c`'s message both
    # having claimed it turns task #1140's Linux >= 5.18
    # `MADV_DONTNEED`-on-HugeTLB claim into evidence, it never built or ran
    # the tests that claim depends on (`decommit_capability.rs`,
    # `reservation_decommit_contract.rs`). Fixed by adding both targets
    # below. Second, independent gap closed in the same task: even the
    # tests this job DID run never hard-asserted a real HugeTLB grant — the
    # sentinel test only checks that a well-formed request is not rejected
    # as invalid, so the job was green whether or not `MAP_HUGETLB` actually
    # succeeded (a silently-broken pool — cgroup limit, NUMA placement, a
    # future runner-image change — would still show every host-adaptive
    # `if reservation.is_huge() { ... }` test as `ok`, having silently taken
    # the fallback branch). Closed by
    # `ci_hugetlb_real_pool_oracle_refuses_ordinary_page_fallback` in
    # `decommit_capability.rs`: a path-activation oracle (CLAUDE.md's R30-8
    # rule) gated on `ALIGNED_VMEM_REQUIRE_REAL_HUGETLB=1`, set only by this
    # job's own test step below, that hard-asserts `is_huge()` and refuses
    # the ordinary-page fallback outright. This job now genuinely proves:
    # (a) the huge-decommit test files actually build and run under a real
    # pool, and (b) that pool actually backed a `MAP_HUGETLB` grant during
    # this run — not just that the sysctl accepted a value.
    #
    # Not folded into `aligned-vmem-gates`: that job is Linux-generic, and
    # this one mutates a kernel sysctl, which should not be a side effect
    # other steps inherit.
    #
    # Task #1188 (perf-index item 57's P1 / correctness item 87's own
    # named next-trigger via task #1182's correction): every prior test in
    # this job reserved with `align == size` in a single, non-looped call
    # — never `align > size`, and never in a loop. `ci_hugetlb_real_pool_
    # align_greater_than_2mib_amplifies_pool_charge_and_skips_exact_path`
    # (`decommit_capability.rs`) closes that specific gap: a 4-reservation
    # loop with `size == align == 4 MiB` (2x LINUX_HUGE_PAGE_SIZE, item
    # 48's own worked example), hard-asserting the exact-size fast path is
    # never attempted (fallback-rate axis) and that release costs exactly
    # one `munmap` per reservation, no head/tail trim (syscall-cost axis).
    # See that test's own doc comment for the full three-axis measurement
    # design and the assert-vs-observation split, following the identical
    # precedent `ci_hugetlb_real_pool_decommit_actually_zeroes_memory_on_
    # reaccess` (task #1174) already established for this job.
    name: aligned-vmem (real hugetlb pool, Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Configure a real hugetlb pool (hard-asserted, never skipped)
        run: |
          set -euo pipefail
          # Task #1166 (F9): this job hard-depends on kernel >= 5.18 (see
          # `linux_huge_range_is_madvise_eligible`'s doc comment,
          # `crates/aligned-vmem/src/os/unix.rs`) and a working 2-MiB hugetlb
          # pool, but previously logged neither — a runner-image regression
          # (older kernel, hugepage size change) would show up only as a
          # downstream test failure with no diagnostic trail. Log both once,
          # unconditionally, before the pool is configured.
          uname -r
          grep -i Hugepagesize /proc/meminfo
          echo 64 | sudo tee /proc/sys/vm/nr_hugepages > /dev/null
          GOT=$(cat /proc/sys/vm/nr_hugepages)
          echo "nr_hugepages = $GOT"
          if [ "$GOT" -lt 8 ]; then
            echo "::error::could not reserve a hugetlb pool (nr_hugepages=$GOT)." \
                 "This job exists to execute the real MAP_HUGETLB path; skipping" \
                 "would make it pass while proving nothing. Fix the runner or" \
                 "delete the job — do not make it conditional."
            exit 1
          fi
        shell: bash
      # tee + `grep -F` for the same reason as every neighbouring row: the
      # huge-page tests are host-adaptive and degrade to a no-pool fallback,
      # so the row must prove each named test actually RAN.
      # `scripts/verify-ci-sentinels.mjs` (task #1150) checks these strings
      # against each test's real attributes.
      #
      # `ALIGNED_VMEM_REQUIRE_REAL_HUGETLB=1`: only this step, in this job,
      # sets this variable. It arms
      # `ci_hugetlb_real_pool_oracle_refuses_ordinary_page_fallback` (task
      # #1152), which hard-fails if `reserve_aligned_huge` took the
      # ordinary-page fallback instead of a real grant — turning a silently
      # broken pool into a red job instead of a green-and-dead one.
      #
      # Task #1162: the env var prefix above was pinned by NOTHING — armed
      # and unarmed both print the identical `test
      # ci_hugetlb_real_pool_oracle_refuses_ordinary_page_fallback ... ok`
      # line, so a future edit that drops the prefix (bad `env:` indent, a
      # lossy merge) would make the oracle silently no-op while this job
      # stayed green. The new `[oracle] ARMED: ...` `println!` marker + its
      # own `grep -F` line make the armed outcome observable in the log
      # itself, not just inferable from workflow text.
      #
      # Task #1164 (item 59a's own next-trigger): closes the kernel-response
      # half of item 59a. `ci_hugetlb_real_pool_kernel_actually_accepts_
      # eligible_madvise` (`decommit_capability.rs`) re-proves the real grant
      # (its own `is_huge()` assert), then hard-asserts
      # `unix_madvise_successes()` actually increased on an eligible range —
      # i.e. the kernel returned 0, not just that the crate dispatched to the
      # real backend. Its own `[oracle] ARMED: kernel accepted ...` marker
      # follows the identical armed/unarmed-must-differ-in-OUTPUT reasoning
      # task #1162 established immediately above, and needs no additional
      # `--test`/feature flag: it lives in the same `decommit_capability`
      # binary, already built with `bench-internals` by this step.
      #
      # Task #1166 (F1): `-- --nocapture` on the FULL multi-threaded run below
      # was corrupting its own sentinel lines, not merely leaving them
      # unaffected. libtest's default (parallel, multi-worker-thread) runner
      # writes each `test <name> ... ok` line as THREE SEPARATE writes from
      # the aggregating main thread: `"test {name} ... "`, then the outcome
      # word, then the trailing newline. Under `--nocapture`, a worker
      # thread's `println!` (this job has three: the `[oracle] ARMED: ...`
      # markers) is not synchronized against that triple-write, so it can
      # land BETWEEN them and split the exact line every `grep -F` below
      # depends on (observed both as `test <name> ... [oracle] ARMED:
      # ...\nok` and `test <name> ... ok[oracle] ARMED: ...` in a 400-run
      # local counterfactual against a 9/10-test harness mirroring this
      # job's shape, 11/400 runs corrupting at least one sentinel line —
      # `--test-threads=1` does NOT fix this, it makes the corruption of a
      # printing test's OWN line deterministic instead of rare, since the
      # print still lands between that same test's three writes; verified
      # 5/5 runs). The fix: run the seven `test <name> ... ok` sentinels
      # WITHOUT `--nocapture` (libtest captures a passing test's stdout by
      # default, so the "... ok" lines are written intact and the three
      # `println!`s are simply swallowed — verified 400/400 runs, zero
      # corruption), then run each of the three ARMED-marker tests in its own
      # single-test invocation (`--exact <name> -- --nocapture`, no other
      # test running concurrently to interleave with) to observe its marker
      # line (verified 400/400 runs each, zero corruption).
      #
      # Task #1174: item 87's own gap — this job proved the kernel DISPATCHED
      # and ACCEPTED the madvise(2) call, never that the underlying memory
      # was actually returned/zeroed. `ci_hugetlb_real_pool_decommit_
      # actually_zeroes_memory_on_reaccess` (`decommit_capability.rs`) closes
      # the deterministic half of that gap: write a non-zero pattern, decommit
      # an eligible huge-aligned range, hard-assert every byte reads back as
      # zero. Its own `[oracle] ARMED: ...` marker follows the identical
      # armed/unarmed-must-differ-in-OUTPUT reasoning as the two siblings
      # above and needs no additional `--test`/feature flag beyond `huge-pages`
      # (it does not read the `bench-internals`-only counters).
      #
      # The OTHER half of "was memory returned" -- how many huge pages came
      # back to the pool -- is deliberately NOT folded into that same hard
      # assert (see the test's own doc comment for why: `HugePages_Free` is a
      # kernel-global counter shared with every other huge-page reservation
      # this job's other targets make, so it cannot be attributed to one
      # test's own decommit() call without racing them). It is instead an
      # OBSERVATION only, logged around the isolated marker invocation below:
      # informative for a human reading the log, never a pass/fail gate.
      #
      # Task #1189 (coverage gap C2 from
      # docs/reviews/2026-08-19-2148-aligned-vmem-publication-audit-Сол-кодекс.md):
      # this job proved dispatch (madvise accepted) and content
      # (decommitted range reads zero), but never checked that RELEASE
      # (`munmap` on `Drop`) was even attempted for a real HugeTLB mapping --
      # `UNIX_MUNMAP_FAILURES` existed but nothing in this job read it around
      # a `Drop`, and a failures-only check cannot tell "release ran and
      # succeeded" apart from "the release call site was deleted and never
      # ran" (both read zero failures). `ci_hugetlb_real_pool_release_is_
      # attempted_exactly_once_and_does_not_fail` (`decommit_capability.rs`)
      # closes this with the NEW `UNIX_MUNMAP_ATTEMPTS` counter (added this
      # same task, mirroring the existing `UNIX_MADVISE_ATTEMPTS` pairing):
      # snapshot attempts/failures, `drop()` a real HugeTLB reservation, hard
      # assert the attempts delta is exactly 1 and the failures delta is 0.
      # Unlike `HugePages_Free`, `UNIX_MUNMAP_ATTEMPTS` is THIS PROCESS's own
      # counter (this test's binary is a separate OS process from this job's
      # other two test binaries), so a hard assert here is sound, not a
      # repeat of the pool-count flakiness this job's comments elsewhere
      # warn against -- see the test's own doc comment for the full
      # reasoning. Needs `bench-internals` (already on for this whole step).
      - run: |
          ALIGNED_VMEM_REQUIRE_REAL_HUGETLB=1 cargo test -p aligned-vmem --features "huge-pages bench-internals" \
            --test huge_pages --test decommit_capability --test reservation_decommit_contract \
            2>&1 | tee "$RUNNER_TEMP/vmem-hugetlb-real.log"
          grep -F "test reserve_aligned_huge_accepts_huge_page_aligned_request ... ok" "$RUNNER_TEMP/vmem-hugetlb-real.log"
          grep -F "test huge_decommit_attempts_increments_on_huge_reservation ... ok" "$RUNNER_TEMP/vmem-hugetlb-real.log"
          grep -F "test huge_aligned_range_takes_the_real_backend_path_not_the_skip_path ... ok" "$RUNNER_TEMP/vmem-hugetlb-real.log"
          grep -F "test method_try_decommit_huge_skip_returns_ok_and_counts ... ok" "$RUNNER_TEMP/vmem-hugetlb-real.log"
          grep -F "test ci_hugetlb_real_pool_oracle_refuses_ordinary_page_fallback ... ok" "$RUNNER_TEMP/vmem-hugetlb-real.log"
          grep -F "test ci_hugetlb_real_pool_kernel_actually_accepts_eligible_madvise ... ok" "$RUNNER_TEMP/vmem-hugetlb-real.log"
          grep -F "test ci_hugetlb_real_pool_decommit_actually_zeroes_memory_on_reaccess ... ok" "$RUNNER_TEMP/vmem-hugetlb-real.log"
          grep -F "test ci_hugetlb_real_pool_release_is_attempted_exactly_once_and_does_not_fail ... ok" "$RUNNER_TEMP/vmem-hugetlb-real.log"
          grep -F "test ci_hugetlb_real_pool_align_greater_than_2mib_amplifies_pool_charge_and_skips_exact_path ... ok" "$RUNNER_TEMP/vmem-hugetlb-real.log"
          ALIGNED_VMEM_REQUIRE_REAL_HUGETLB=1 cargo test -p aligned-vmem --features "huge-pages bench-internals" \
            --test decommit_capability \
            -- --exact ci_hugetlb_real_pool_oracle_refuses_ordinary_page_fallback --nocapture \
            2>&1 | tee "$RUNNER_TEMP/vmem-hugetlb-real-marker1.log"
          grep -F "[oracle] ARMED: real MAP_HUGETLB grant confirmed" "$RUNNER_TEMP/vmem-hugetlb-real-marker1.log"
          ALIGNED_VMEM_REQUIRE_REAL_HUGETLB=1 cargo test -p aligned-vmem --features "huge-pages bench-internals" \
            --test decommit_capability \
            -- --exact ci_hugetlb_real_pool_kernel_actually_accepts_eligible_madvise --nocapture \
            2>&1 | tee "$RUNNER_TEMP/vmem-hugetlb-real-marker2.log"
          grep -F "[oracle] ARMED: kernel accepted eligible madvise(2) on real MAP_HUGETLB grant" "$RUNNER_TEMP/vmem-hugetlb-real-marker2.log"
          # Task #1174: best-effort, PRINTED-NOT-ASSERTED observation of the
          # pool's own free-page count around the isolated marker invocation
          # below. Not a gate (see the step's own leading comment and the
          # test's doc comment for why a shared, external kernel counter
          # cannot safely be a hard assert here) -- purely informative log
          # output for a human reviewing this job's run.
          echo "HugePages_Free before decommit-content test:"
          grep -i HugePages_Free /proc/meminfo
          ALIGNED_VMEM_REQUIRE_REAL_HUGETLB=1 cargo test -p aligned-vmem --features "huge-pages bench-internals" \
            --test decommit_capability \
            -- --exact ci_hugetlb_real_pool_decommit_actually_zeroes_memory_on_reaccess --nocapture \
            2>&1 | tee "$RUNNER_TEMP/vmem-hugetlb-real-marker3.log"
          grep -F "[oracle] ARMED: decommitted range read back as all-zero on real MAP_HUGETLB grant" "$RUNNER_TEMP/vmem-hugetlb-real-marker3.log"
          echo "HugePages_Free after decommit-content test (observation only, not a gate -- see step comment above):"
          grep -i HugePages_Free /proc/meminfo
          # Task #1189: isolated marker invocation for the release-attempt
          # oracle, same shape as marker1-3 above (no other test running
          # concurrently in this process to interleave with its `println!`).
          ALIGNED_VMEM_REQUIRE_REAL_HUGETLB=1 cargo test -p aligned-vmem --features "huge-pages bench-internals" \
            --test decommit_capability \
            -- --exact ci_hugetlb_real_pool_release_is_attempted_exactly_once_and_does_not_fail --nocapture \
            2>&1 | tee "$RUNNER_TEMP/vmem-hugetlb-real-marker4.log"
          grep -F "[oracle] ARMED: real MAP_HUGETLB release attempted exactly once and did not fail" "$RUNNER_TEMP/vmem-hugetlb-real-marker4.log"
          # Task #1188: isolated marker invocation for the align > 2 MiB
          # pool-amplification oracle, same shape as marker1-4 above. Its
          # own HugePages_Free before/after bracket (best-effort, PRINTED
          # NOT ASSERTED — identical reasoning to the marker3 bracket
          # above): this test holds 4 simultaneous 8-MiB-charged mappings
          # (RESERVATION_COUNT * over-reserve size) at peak before releasing
          # any of them, a materially different pool-pressure shape from
          # marker3's single 2-MiB exact-fit reservation, so it gets its own
          # log bracket even though neither is a pass/fail gate.
          echo "HugePages_Free before align>2MiB pool-amplification test:"
          grep -i HugePages_Free /proc/meminfo
          ALIGNED_VMEM_REQUIRE_REAL_HUGETLB=1 cargo test -p aligned-vmem --features "huge-pages bench-internals" \
            --test decommit_capability \
            -- --exact ci_hugetlb_real_pool_align_greater_than_2mib_amplifies_pool_charge_and_skips_exact_path --nocapture \
            2>&1 | tee "$RUNNER_TEMP/vmem-hugetlb-real-marker5.log"
          grep -F "[oracle] ARMED: align > 2 MiB reservation loop skipped exact-size path, charged 1 mmap + 1 munmap per reservation" "$RUNNER_TEMP/vmem-hugetlb-real-marker5.log"
          echo "HugePages_Free after align>2MiB pool-amplification test (observation only, not a gate -- see step comment above):"
          grep -i HugePages_Free /proc/meminfo
        shell: bash

  aligned-vmem-miri:
    # Task #1057 — closes docs/CORRECTNESS_OPEN_ITEMS.md items 41 and 61: this
    # crate had NO step anywhere in CI that ran `cargo miri test -p
    # aligned-vmem` — only the compile-only `RUSTFLAGS="--cfg miri
    # --cfg aligned_vmem_mock" cargo check` step in the `aligned-vmem-gates`
    # job above (added by task #851), which catches type/cfg errors under the
    # miri cfg but never executes the interpreter, so it cannot catch UB in
    # the FFI/pointer code paths the way item 61 phrased the gap. This job is
    # the missing interpreter run. Modeled on `numa-shim-macos-miri` (the
    # workflow's other small-crate per-PR miri job) with three deliberate
    # differences, each documented in the task #1057 commit message:
    # - `ubuntu-latest`, not `macos-latest`: unlike numa-shim's job (which
    #   existed to cross macOS x miri for a cfg-collision bug), this crate's
    #   miri fallback backend (crates/aligned-vmem/src/os/miri.rs) is built on
    #   std::alloc and platform-independent, so there is no macOS-specific
    #   reason to pay for a macOS runner.
    # - `MIRIFLAGS: -Zmiri-ignore-leaks`, not `-Zmiri-disable-isolation`: the
    #   ONLY intentional-leak case is tests/smoke.rs's
    #   `leak_zeroed_pages_is_zeroed_and_static` — the function under test
    #   `leak_zeroed_pages` core::mem::forget-leaks by design (process-lifetime
    #   sidecar), which miri's default leak checker reports as a failure with
    #   no bug present. Verified locally that this flag alone suffices.
    # - Per-PR cadence (no `schedule:`/`workflow_dispatch` keys), matching
    #   numa-shim-macos-miri: this crate's suite is small enough that miri's
    #   interpreter overhead is affordable on every PR (~45 s default /
    # ~2 min --all-features measured locally on the committer's host).
    name: aligned-vmem under miri (interpreter, not just --cfg miri check)
    runs-on: ubuntu-latest
    env:
      MIRIFLAGS: "-Zmiri-ignore-leaks"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      # Two runs: default features and --all-features (lazy-commit +
      # alloc-lazy-commit compat + huge-pages + fault-injection +
      # bench-internals). No additional single-feature runs: every feature's
      # cfg-gated code (including src/os/miri.rs's lazy-commit and huge-pages
      # arms) is compiled and exercised under --all-features, so narrower runs
      # would re-interpret overlapping suites at full cost for no unique
      # coverage; fault-injection is API-layer (feature-gated in
      # src/api/commit_range.rs, pre-backend) and runs green under miri.
      - run: cargo miri test -p aligned-vmem
      - run: cargo miri test -p aligned-vmem --all-features

  once-ptr-cell-gates:
    # Publication readiness review, run 5 (Sol-codex), F7, task #1396: every
    # other standalone crate with its own package-gates job (sefer-region,
    # aligned-vmem) has one that actually packages/publish-dry-runs the
    # crate on every PR; once-ptr-cell did not, so a tarball-content,
    # manifest-normalization, or packaged-dependency-resolution regression
    # would surface for the first time at tag/release time instead of here.
    # This crate's clippy/rustdoc/test rows already live in the big
    # test-workspace job below — not duplicated here, same convention the
    # sefer-region job's own header comment states. No
    # `cargo semver-checks check-release` step: unlike sefer-region and
    # aligned-vmem, once-ptr-cell has never been published, so there is no
    # baseline on crates.io to diff against yet — add that step once the
    # first `cargo publish -p once-ptr-cell` has actually landed.
    name: once-ptr-cell package gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      # Packaging verification only, per the finding: confirms the crate
      # packages and the packaged tarball's own isolated build succeeds
      # against the published manifest (no reliance on workspace-inherited
      # lints/deps that would not exist for a real crates.io consumer).
      - run: cargo publish --dry-run -p once-ptr-cell

