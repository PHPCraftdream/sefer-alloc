name: r20-gates

# R20 pre-registered Ir gates (PRF-01/PRF-03/...): dispatch-only driver for the
# scripts/r20_*_run.mjs stage runners. The owner moved ALL heavy runs (cargo,
# valgrind) off the local machine to GitHub CI (2026-10); the automatic perf
# triggers were already disabled on 2026-08-18 (see perf-gate.yml), so
# workflow_dispatch is the ONLY trigger here — nothing runs on push/PR/schedule.
#
# SECURITY: the `runner` input is a path, never a command. It is validated in
# two steps before use — a strict regex (`^scripts/r20_[a-z0-9_]+_run\.mjs$`)
# AND an on-disk existence check — and is then invoked as
# `node "$RUNNER" --<stage>`, quoted, with no shell evaluation of the input.
# The `stages` input is likewise restricted to a fixed whitelist.
#
# SEC-4 (least-privilege, mirrors ci.yml): contents: read is sufficient — the
# job never pushes, never comments; actions/upload-artifact uses its own
# scoped backend and needs no extra token scope. Nothing in this workflow
# commits or pushes anything back to the repository.
permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      runner:
        description: 'Runner script under scripts/, must match scripts/r20_[a-z0-9_]+_run.mjs'
        required: false
        type: string
        default: 'scripts/r20_prf01_sidecar_summary_run.mjs'
      stages:
        description: 'Comma-separated stage order, subset of: prepare,build,oracle,measure,rehearsal,cleanup'
        required: false
        type: string
        default: 'prepare,build,oracle,measure'
      slop:
        description: 'Pass --slop (only to the rehearsal/measure stages)'
        required: false
        type: boolean
        default: false
      note:
        description: 'Free-form comment, echoed into the run summary'
        required: false
        type: string
        default: ''

concurrency:
  group: r20-gates-${{ github.ref }}
  # Two dispatches on the same ref must queue, not trample each other's
  # measurements (the gates are instruction-count deterministic, but the
  # runner stages share the checkout and target/).
  cancel-in-progress: false

jobs:
  gates:
    name: r20 gate runner
    # ubuntu-24.04 pins valgrind 3.22 — the same version the local WSL
    # environment ran the pre-registered PRF measurements on.
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      RUNNER_INPUT: ${{ inputs.runner }}
      STAGES_INPUT: ${{ inputs.stages }}
      SLOP_INPUT: ${{ inputs.slop }}
    steps:
      # fetch-depth: 0 — the stage runners must see the full git history to
      # cherry-pick the candidate commit; persist-credentials: false so the
      # checkout token never reaches the runner's environment (SEC-4 shape).
      # No `git clean`/re-checkout is performed anywhere below: the runners
      # require a pristine working tree.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install valgrind
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y valgrind

      - name: Install iai-callgrind-runner
        # Same caret pin as perf-gate.yml — must match the iai-callgrind
        # library version in Cargo.toml (0.14.x).
        run: cargo install iai-callgrind-runner --version "^0.14" --locked

      - name: Validate inputs
        run: |
          set -euo pipefail
          # A shell glob's `*` would match `/`, `;` and `..`; use a real regex.
          if ! [[ "$RUNNER_INPUT" =~ ^scripts/r20_[a-z0-9_]+_run\.mjs$ ]]; then
            echo "::error::runner input must match ^scripts/r20_[a-z0-9_]+_run\.mjs$, got: $RUNNER_INPUT"
            exit 1
          fi
          if [ ! -f "$RUNNER_INPUT" ]; then
            echo "::error::runner file not found in this checkout: $RUNNER_INPUT"
            exit 1
          fi
          echo "RUNNER=$RUNNER_INPUT" >> "$GITHUB_ENV"
          # Rebuild the stage list from the whitelist so only allowed names
          # can ever reach the invocation loop, preserving input ORDER.
          stages=""
          IFS=',' read -ra raw_stages <<< "$STAGES_INPUT"
          for s in "${raw_stages[@]}"; do
            s="$(printf '%s' "$s" | tr -d '[:space:]')"
            case "$s" in
              '') : ;;
              prepare|build|oracle|measure|rehearsal|cleanup) stages="$stages $s" ;;
              *) echo "::error::invalid stage: $s (allowed: prepare, build, oracle, measure, rehearsal, cleanup)"; exit 1 ;;
            esac
          done
          stages="${stages# }"
          if [ -z "$stages" ]; then
            echo "::error::no valid stages in: $STAGES_INPUT"
            exit 1
          fi
          echo "STAGES=$stages" >> "$GITHUB_ENV"
          echo "Validated runner: $RUNNER_INPUT"
          echo "Validated stages (in order): $stages"

      - name: Environment
        env:
          NOTE: ${{ inputs.note }}
        run: |
          {
            echo '## r20-gates environment'
            echo ''
            echo '```'
            uname -a
            rustc -Vv
            valgrind --version
            lscpu | grep 'Model name'
            echo "HEAD: $(git rev-parse HEAD)"
            echo "node: $(node --version)"
            echo '```'
            if [ -n "$NOTE" ]; then
              echo ''
              echo "Note: $NOTE"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run stages
        # Inputs reach bash only through the validated env vars above, never
        # via direct ${{ }} interpolation into this script body.
        run: |
          set -euo pipefail
          for stage in $STAGES; do
            args=(--"$stage")
            case "$stage" in
              rehearsal|measure)
                if [ "$SLOP_INPUT" = "true" ]; then args+=(--slop); fi
                ;;
            esac
            echo "::group::node $RUNNER ${args[*]}"
            node "$RUNNER" "${args[@]}"
            echo "::endgroup::"
          done

      - name: Summary
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          {
            echo '## r20-gates result'
            echo ''
            echo "- runner: \`$RUNNER\`"
            echo "- stages: \`$STAGES\`"
            echo "- HEAD: \`$(git rev-parse HEAD)\`"
            echo ''
          } >> "$GITHUB_STEP_SUMMARY"
          # The runners deposit their judge's verdict under
          # docs/perf/R20_*_RUN01/ (measured gates) or target/r20*-rehearsal/
          # (rehearsals). Echo verdict.txt when one was produced; a missing
          # verdict on a green run is a rehearsal, not an error.
          found=0
          for v in docs/perf/R20_*_RUN01/verdict.txt target/r20*-rehearsal/verdict.txt; do
            if [ -f "$v" ]; then
              found=1
              echo "### $v" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
              cat "$v" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          if [ "$found" = 0 ]; then
            echo '(no verdict.txt found — rehearsal-style run or earlier-stage failure)' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload run artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: r20-gates-${{ github.run_id }}
          path: |
            docs/perf/R20_*_RUN01/
            target/r20*-rehearsal/
          if-no-files-found: warn
          retention-days: 30
