name: Release

# Publish a crate from the workspace to crates.io.
#
# ## Two triggers
#
# **Tag push (automatic)** — push a tag matching `<crate-name>-v<version>`,
# e.g. `sefer-alloc-v0.1.0`, `aligned-vmem-v0.2.0`. The workflow parses the
# tag, picks the matching crate, and publishes it.
#
# ```sh
# # bump the version in crates/foo/Cargo.toml + commit + push, then:
# git tag sefer-alloc-v0.1.1
# git push origin sefer-alloc-v0.1.1
# ```
#
# **Manual dispatch (interactive)** — open Actions → Release → Run workflow,
# pick the crate from the dropdown, optionally tick "dry-run" to test the
# publish path without pushing to crates.io.
#
# ## Prerequisites
#
# - Repository secret **`CARGO_REGISTRY_TOKEN`** is set with a crates.io API
#   token that has at least `publish-update` scope on every crate listed
#   below (and `publish-new` for the first-time publish of any crate that is
#   not yet on crates.io). Set it once:
#
#   ```sh
#   echo <TOKEN> | gh secret set CARGO_REGISTRY_TOKEN --repo PHPCraftdream/sefer-alloc
#   ```
#
# - The version in `Cargo.toml` of the target crate matches the tag (the
#   workflow does NOT auto-bump versions — it publishes whatever the crate's
#   Cargo.toml currently declares; mismatches are a manual mistake).
#
# - For sub-crates that depend on each other (`numa-shim` depends on
#   `aligned-vmem`, `sefer-alloc` depends on `sefer-region` + `aligned-vmem`
#   + `numa-shim`), the upstream version MUST already be on crates.io
#   before the dependent crate's publish is triggered. Standard
#   `cargo publish` validation will fail loudly if not.
#
# ## Future improvements
#
# - Move to crates.io **trusted publishing** (OIDC) — removes the
#   long-lived `CARGO_REGISTRY_TOKEN` secret. Requires configuring the
#   trust relationship on crates.io UI per crate. Tracked as a follow-up.

on:
  push:
    tags:
      - 'aligned-vmem-v*'
      - 'sefer-region-v*'
      - 'malloc-bench-rs-v*'
      - 'numa-shim-v*'
      - 'sefer-alloc-v*'
  workflow_dispatch:
    inputs:
      crate:
        description: 'Crate to publish'
        type: choice
        required: true
        options:
          - aligned-vmem
          - sefer-region
          - malloc-bench-rs
          - numa-shim
          - sefer-alloc
      dry-run:
        description: 'Dry-run only (do not push to crates.io)'
        type: boolean
        default: false

# Serialise simultaneous publishes for the same crate / tag. crates.io itself
# rejects double-publish of an existing version, so this is belt-and-braces:
# it keeps the Actions UI cleaner when a tag is re-pushed.
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

# SEC-4 (task #201): least-privilege token scope. The publish step uploads to
# crates.io via the separate `CARGO_REGISTRY_TOKEN` secret, NOT via the
# `GITHUB_TOKEN`; no step creates a GitHub Release, pushes a git ref, or
# comments on a PR/issue. The `$GITHUB_STEP_SUMMARY` writes are to a file the
# runner hands the step via env, not a contents API call. So the whole
# workflow is read-only with respect to repo contents.
permissions:
  contents: read
  # K8 (task #603): the CI-status guard below reads workflow-run state for
  # this same commit via `gh api` (GitHub Actions API), to confirm the `CI`
  # workflow (.github/workflows/ci.yml) is green for `github.sha` before
  # publishing. That is a read of Actions run metadata, not of repo
  # contents, so it needs its own scope alongside `contents: read` above.
  actions: read

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # SEC-6 (task #203): SHA-pinned to the commit `v5` points at
      # (verified via `git ls-remote https://github.com/actions/checkout.git refs/tags/v5`).
      # This is the only workflow carrying the crates.io publish token, so the
      # tag-rewrite supply-chain vector is removed here specifically. Bump the
      # SHA when intentionally moving to a new checkout major/minor.
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      # SEC-6 (task #203): deliberately NOT SHA-pinned. `@stable` is a moving
      # branch by design (the audit flagged this as "acceptable, but worth a
      # conscious decision") — it exists precisely to resolve to the latest
      # stable Rust toolchain at run time. Pinning a SHA would freeze it to
      # whatever stable was current when this comment was written and silently
      # stop tracking new stable releases. The supply-chain risk is also lower
      # here: this action only installs a toolchain, it never touches the
      # `CARGO_REGISTRY_TOKEN`. Left tag-pinned by conscious decision.
      - uses: dtolnay/rust-toolchain@stable

      - name: Resolve target crate
        id: target
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            CRATE='${{ inputs.crate }}'
            DRY_RUN='${{ inputs.dry-run }}'
          else
            # Tag form: <crate>-v<version>. Strip the trailing `-v*` suffix.
            REF='${{ github.ref_name }}'
            CRATE="${REF%-v*}"
            DRY_RUN='false'
          fi
          echo "name=$CRATE" >> "$GITHUB_OUTPUT"
          echo "dry_run=$DRY_RUN" >> "$GITHUB_OUTPUT"
          echo "Target crate: $CRATE  (dry-run: $DRY_RUN)"

      - name: Show version that will be published
        id: version
        shell: bash
        run: |
          set -euo pipefail
          # `cargo pkgid` output has two shapes depending on the crate:
          #   path+file:///path/to/crate#crate-name@1.2.3   (member crates)
          #   path+file:///path/to/crate#1.2.3              (the root package,
          #                                                  name implicit)
          # First strip up to and including '#', then strip a leading `name@`
          # if present. `${X##*@}` alone is WRONG for the root form (no '@',
          # it would return the whole path).
          PKGID=$(cargo pkgid -p '${{ steps.target.outputs.name }}')
          AFTER_HASH="${PKGID##*#}"
          VERSION="${AFTER_HASH##*@}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Crate ${{ steps.target.outputs.name }} version: $VERSION"
          # Surface in the job summary too.
          echo "## Release target" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- crate: \`${{ steps.target.outputs.name }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- version: \`$VERSION\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- dry-run: \`${{ steps.target.outputs.dry_run }}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Guard — tag version must match Cargo.toml
        # For a tag push, the tag encodes the version (`<crate>-v<version>`).
        # The Cargo.toml version is NOT auto-bumped by this workflow, so a stale
        # Cargo.toml would silently publish the wrong version (the comment at the
        # top of this file flags this as a "manual mistake" risk). Fail loudly if
        # the tag version and the resolved crate version disagree.
        #
        # Keyed on `dry_run`, NOT `github.event_name` (K5, task #600): a manual
        # `workflow_dispatch` with dry-run=false reaches the exact same
        # irreversible `cargo publish` as a tag push (see the Test gate below,
        # which already uses this same condition), so it must clear the same
        # guards. Only genuine dry-runs (packaging exercises, not real
        # publishes) skip this — there the tag-shaped input this guard checks
        # (`github.ref_name`) may not even exist as a real version-encoding tag.
        if: ${{ steps.target.outputs.dry_run != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" != "push" ]]; then
            echo "Guard skipped: manual dispatch has no version-encoding tag to check the resolved crate version against." >> "$GITHUB_STEP_SUMMARY"
            echo "Guard skipped (workflow_dispatch, non-dry-run): no tag to compare against."
            exit 0
          fi
          REF='${{ github.ref_name }}'
          TAG_VERSION="${REF##*-v}"        # `<crate>-v<version>` -> `<version>`
          CRATE_VERSION='${{ steps.version.outputs.version }}'
          echo "tag version:   $TAG_VERSION"
          echo "crate version: $CRATE_VERSION"
          if [[ "$TAG_VERSION" != "$CRATE_VERSION" ]]; then
            echo "::error::tag version ($TAG_VERSION) does not match Cargo.toml version ($CRATE_VERSION) for crate ${{ steps.target.outputs.name }}" >&2
            exit 1
          fi

      - name: Guard — CHANGELOG must be consolidated before publish
        # Before publishing a version, verify that CHANGELOG.md has a proper
        # dated section for that version (not just "(unreleased)"). This prevents
        # releasing a version whose CHANGELOG entry is still in the [Unreleased]
        # section, which would indicate incomplete release notes or a missed
        # merge step.
        # (Sol-F2, release-readiness review finding F2: CHANGELOG.md's
        # `## [0.3.0] - 2026-07-04` section falsely implied a release that
        # never happened -- no `sefer-alloc-v0.3.0` git tag existed and
        # crates.io was still on 0.2.1.)
        #
        # Keyed on `dry_run`, NOT `github.event_name` (K5, task #600): see the
        # comment on the guard above -- a non-dry-run manual dispatch is just
        # as irreversible as a tag push and must clear the same guards.
        #
        # Crate-scoped (L4, task #617): CHANGELOG.md is the ROOT crate's
        # changelog only -- its `## [X.Y.Z]` sections describe sefer-alloc
        # releases, not member-crate releases. Checking it for any other
        # crate is wrong in both directions: a root-crate section can
        # coincidentally share a version number with an unrelated member-crate
        # tag (false pass), or a member crate can have no matching root
        # section even though its own release is fine (false fail). None of
        # the member crates (aligned-vmem, sefer-region, malloc-bench-rs,
        # numa-shim) has a per-crate changelog yet, so for them this guard is
        # skipped with an explicit reason rather than inventing a per-crate
        # changelog scheme here.
        if: ${{ steps.target.outputs.dry_run != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          NAME='${{ steps.target.outputs.name }}'
          if [[ "$NAME" != "sefer-alloc" ]]; then
            {
              echo "## CHANGELOG guard skipped"
              echo ""
              echo "CHANGELOG guard only applies to the root \`sefer-alloc\` crate;"
              echo "member crate \`$NAME\` has no per-crate changelog yet -- see task L4/#617."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "Guard skipped: CHANGELOG.md is sefer-alloc's changelog only; $NAME has no per-crate changelog yet (task L4/#617)."
            exit 0
          fi
          VERSION='${{ steps.version.outputs.version }}'
          CHANGELOG_SECTIONS=$(grep -E "^## \[${VERSION}\]" CHANGELOG.md || true)

          # Count matching sections
          MATCH_COUNT=$(echo "$CHANGELOG_SECTIONS" | grep -c "${VERSION}" || true)

          echo "Checking CHANGELOG.md for version $VERSION..."
          echo "Found $MATCH_COUNT section(s) matching [${VERSION}]"

          # Require exactly ONE matching section
          if [[ "$MATCH_COUNT" -ne 1 ]]; then
            echo "::error::Expected exactly one CHANGELOG section for version $VERSION, found $MATCH_COUNT" >&2
            echo "::error::Ensure CHANGELOG.md has been consolidated from [Unreleased] into a dated [${VERSION}] section before publishing" >&2
            exit 1
          fi

          # Verify that the matching section is NOT marked as "(unreleased)"
          if echo "$CHANGELOG_SECTIONS" | grep -q "(unreleased)"; then
            echo "::error::CHANGELOG section for version $VERSION is marked as (unreleased)" >&2
            echo "::error::Consolidate CHANGELOG.md by moving [Unreleased] content into [${VERSION}] and remove the '(unreleased)' marker" >&2
            exit 1
          fi

          echo "✓ CHANGELOG.md has proper dated section for version $VERSION"

      - name: Guard — main CI workflow must be green for this commit
        # K8 (task #603): `publish` has no `needs:` on the main `CI` workflow
        # (.github/workflows/ci.yml, ~30 jobs — fmt, 6 clippy rows,
        # all-features test, feature isolation, workspace members, docs,
        # cargo-deny, MSRV, no_std, miri, loom, TSan, ASan, multi-arch, ...).
        # A tag push or workflow_dispatch on a commit whose `CI` run is red
        # (or hasn't run/finished yet) would sail straight through to
        # `cargo publish` unblocked -- this happened for real: a push to
        # `42d4206` triggered `CI` and it came back red on two jobs (fixed
        # separately as tasks L1/L8), and nothing in `release.yml` would
        # have stopped a release tag on that same SHA at the time.
        #
        # Variant chosen: an API poll (`gh api`) inside this job, not a
        # `workflow_run` retrigger. A `workflow_run`-triggered `publish`
        # would only be reachable as a continuation of a `CI` run, which
        # conflicts with this workflow's two existing entry points (tag
        # push, manual dispatch with a crate dropdown + dry-run checkbox)
        # -- `workflow_run` carries neither of those inputs, so preserving
        # them would need a second workflow file plus a handoff mechanism
        # (artifacts or `repository_dispatch`) to pass `crate`/`dry-run`
        # across the boundary. The poll approach is a same-file, additive
        # step: no existing trigger, input, or job structure changes.
        #
        # Looks up the run FOR THIS COMMIT specifically (`head_sha=
        # ${{ github.sha }}`), not "the latest CI run on main" -- a tag can
        # (and often does) point at a commit that is not the tip of `main`,
        # so "latest on main" would silently check the wrong commit's
        # result. Only enforced when NOT a dry-run, same condition already
        # used by the guards above (K5, task #600) -- a dry-run is a
        # packaging exercise, not a real publish, and does not need to wait
        # on CI.
        #
        # Behavior:
        #   - no `CI` run found for this SHA yet            -> fail, clear message
        #   - run found but still queued/in_progress          -> fail, clear message
        #     (no long poll/timeout here deliberately: CI takes much longer
        #     than this job's own 15-minute timeout budget allows to sit
        #     idle waiting, and a hard fail with "re-run once CI finishes"
        #     is a clearer operator signal than a job that times out itself
        #     partway through a poll loop)
        #   - run found, completed, conclusion != 'success'   -> fail, clear message
        #   - run found, completed, conclusion == 'success'   -> pass
        if: ${{ steps.target.outputs.dry_run != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          REPO='${{ github.repository }}'
          SHA='${{ github.sha }}'

          RUNS_JSON=$(gh api \
            "repos/${REPO}/actions/workflows/ci.yml/runs?head_sha=${SHA}&per_page=10" \
            --jq '.workflow_runs')

          RUN_COUNT=$(echo "$RUNS_JSON" | jq 'length')
          if [[ "$RUN_COUNT" -eq 0 ]]; then
            {
              echo "## CI-status guard: FAILED"
              echo ""
              echo "No \`CI\` workflow run found for commit \`${SHA}\`."
              echo "Push/land this commit on a branch \`ci.yml\` runs on and wait for it to complete before publishing."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::No CI workflow run found for commit $SHA. Wait for CI to run and go green before publishing." >&2
            exit 1
          fi

          # Most recent run for this SHA (API returns newest first).
          STATUS=$(echo "$RUNS_JSON" | jq -r '.[0].status')
          CONCLUSION=$(echo "$RUNS_JSON" | jq -r '.[0].conclusion')
          RUN_URL=$(echo "$RUNS_JSON" | jq -r '.[0].html_url')

          echo "CI run for $SHA: status=$STATUS conclusion=$CONCLUSION ($RUN_URL)"

          if [[ "$STATUS" != "completed" ]]; then
            {
              echo "## CI-status guard: FAILED"
              echo ""
              echo "\`CI\` workflow run for \`${SHA}\` has not finished yet (status: \`${STATUS}\`)."
              echo "Run: ${RUN_URL}"
              echo ""
              echo "Wait for CI to finish, then re-run this release job -- do not publish mid-run."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::CI workflow run for $SHA is not completed yet (status: $STATUS). Wait for CI to finish before publishing. Run: $RUN_URL" >&2
            exit 1
          fi

          if [[ "$CONCLUSION" != "success" ]]; then
            {
              echo "## CI-status guard: FAILED"
              echo ""
              echo "\`CI\` workflow run for \`${SHA}\` completed with conclusion \`${CONCLUSION}\` (not \`success\`)."
              echo "Run: ${RUN_URL}"
              echo ""
              echo "Fix CI and get it green on this commit before publishing."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::CI workflow run for $SHA concluded '$CONCLUSION', not 'success'. Fix CI before publishing. Run: $RUN_URL" >&2
            exit 1
          fi

          {
            echo "## CI-status guard: passed"
            echo ""
            echo "\`CI\` workflow run for \`${SHA}\` completed successfully."
            echo "Run: ${RUN_URL}"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "✓ CI workflow run for $SHA completed successfully."

      - name: Test gate — do not publish a red tree
        # A tag must never publish an untested tree. Run the default suite and
        # the flagship `production` bundle for the target crate before the
        # irreversible upload. Skipped on dry-run (the dry-run path is for
        # exercising packaging, not a full pre-publish gate).
        if: ${{ steps.target.outputs.dry_run != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          NAME='${{ steps.target.outputs.name }}'
          # Default-feature suite for whichever crate is being released.
          cargo test -p "$NAME" --no-fail-fast
          # `production` is a root-crate-only feature bundle; only add it when
          # the target IS the root crate (member crates have no such feature).
          if [[ "$NAME" == "sefer-alloc" ]]; then
            # R34-3 (task #522, finding B1): `alloc_core`/`global`/`registry`
            # moved behind the new `internals` feature (additive over
            # `alloc-core`/`alloc-global`, NOT implied by `production`) — the
            # published crate's LIBRARY surface under plain `production` is
            # exactly what a downstream consumer builds, so verify that
            # compiles/links/tests clean with `--lib` (matches
            # `scripts/check-matrix.mjs`'s `clippy-production` row). Then also
            # run this repo's own internals-facing `tests/` suite under
            # `production internals` — a red tree there is still a red tree
            # this release gate must not publish, even though `internals` is
            # not part of what a downstream consumer sees.
            cargo test -p "$NAME" --lib --features production --no-fail-fast
            cargo test -p "$NAME" --features "production internals" --no-fail-fast
          fi

      - name: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          ARGS=(publish -p '${{ steps.target.outputs.name }}')
          if [[ '${{ steps.target.outputs.dry_run }}' == 'true' ]]; then
            ARGS+=(--dry-run)
          fi
          # Verify is ON (CI runner has a fresh target dir; no lock contention
          # like a local workspace target). This re-builds the packaged crate
          # standalone — catches packaging mistakes (missing files in `include`,
          # unresolved deps, etc.) before the upload is final.
          cargo "${ARGS[@]}"
