name: CI loom-misc
description: Original loom-misc job steps
runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@stable
    - name: registry free slots and maintenance lease
      run: |
        cargo test --release --features "alloc-global alloc-xthread internals tagged-index-stack/loom" \
          --test loom_registry_free_slots \
          --test loom_r8_maintenance_lease \
          --test loom_active_kind_index \
          --test loom_r11_registry_claim \
          --test loom_r6_selector_model \
          --test loom_r19_registry_free_set \
          --test loom_r20_heap_reuse_spill \
          --test loom_registry_hints_actual \
          --test loom_r11_ph4a_heap_lease \
          --test loom_depot_recycle_handoff \
          --test loom_r11_ph4b_publish_recycle_drain 2>&1 | tee "$RUNNER_TEMP/loom-registry.log"
        grep -F "test registry_free_slots_claim_recycle_is_conservative_under_contention ... ok" "$RUNNER_TEMP/loom-registry.log"
        grep -F "test publication_racing_summary_clear_is_never_lost_or_duplicated ... ok" "$RUNNER_TEMP/loom-registry.log"
        grep -F "test publications_in_two_words_both_stay_reachable ... ok" "$RUNNER_TEMP/loom-registry.log"
        grep -F "test saturation_is_committed_only_after_every_completed_publication ... ok" "$RUNNER_TEMP/loom-registry.log"
        grep -F "test claim_maintenance_and_recycle_have_one_mutator_and_publish_payload ... ok" "$RUNNER_TEMP/loom-registry.log"
        grep -F "test lease_drop_release_pairs_with_claim_and_maintenance_acquires ... ok" "$RUNNER_TEMP/loom-registry.log"
        grep -F "test depot_drained_before_release_is_seen_empty_by_next_owner ... ok" "$RUNNER_TEMP/loom-registry.log"
        grep -F "test negative_relaxed_release_races_on_depot - should panic ... ok" "$RUNNER_TEMP/loom-registry.log"
        grep -F "test negative_release_before_drain_leaks_parked_state - should panic ... ok" "$RUNNER_TEMP/loom-registry.log"
        grep -F "test publication_survives_recycle_and_is_consumed_exactly_once ... ok" "$RUNNER_TEMP/loom-registry.log"
        grep -F "test owner_only_membership_survives_late_terminal_publication ... ok" "$RUNNER_TEMP/loom-registry.log"
        grep -F "test clean_bit_clear_mutant_is_rejected ... ok" "$RUNNER_TEMP/loom-registry.log"
        grep -F "test completed_free_publication_cannot_leave_false_full_or_two_owners ... ok" "$RUNNER_TEMP/loom-registry.log"
        grep -F "test two_releasers_spill_hint_claim_and_maintenance_preserve_availability ... ok" "$RUNNER_TEMP/loom-registry.log"
        grep -F "test ctor_oom_bitmap_slot_does_not_starve_initialised_recovery ... ok" "$RUNNER_TEMP/loom-registry.log"
        grep -F "test release_swap_spills_displaced_hint_into_bitmap ... ok" "$RUNNER_TEMP/loom-registry.log"
        grep -F "test negative_release_store_loses_displaced_hint - should panic ... ok" "$RUNNER_TEMP/loom-registry.log"
        grep -F "test free_cas_precedes_bitmap_publication ... ok" "$RUNNER_TEMP/loom-registry.log"
        grep -F "test negative_bitmap_publication_before_free_cas_loses_availability - should panic ... ok" "$RUNNER_TEMP/loom-registry.log"
        grep -F "test take_checks_previous_bit_once ... ok" "$RUNNER_TEMP/loom-registry.log"
        grep -F "test negative_take_ignores_old_bit_duplicate_candidate_not_ownership - should panic ... ok" "$RUNNER_TEMP/loom-registry.log"
        grep -F "test three_slot_two_release_claim_maintenance_preserve_availability_and_unique_ownership ... ok" "$RUNNER_TEMP/loom-registry.log"
        grep -F "test quiet_summary_uses_bounded_state_scan ... ok" "$RUNNER_TEMP/loom-registry.log"
        grep -F "test summary_clear_recheck_preserves_concurrent_bit_publication ... ok" "$RUNNER_TEMP/loom-registry.log"
        grep -F "test selector_bump_before_scan_never_certifies_a_claimable_slot ... ok" "$RUNNER_TEMP/loom-registry.log"
        grep -F "test stale_hint_at_or_above_count_is_never_a_heap ... ok" "$RUNNER_TEMP/loom-registry.log"
        grep -F "test negative_hint_without_count_guard_hands_out_an_unminted_slot - should panic ... ok" "$RUNNER_TEMP/loom-registry.log"
        grep -F "test chunk_oom_minted_index_is_retryable_but_never_handed_out ... ok" "$RUNNER_TEMP/loom-registry.log"
        grep -F "test negative_chunk_oom_minted_index_hands_out_without_materialisation - should panic ... ok" "$RUNNER_TEMP/loom-registry.log"
      shell: bash
    # NL-3: reclaim and owner teardown without the per-block liveness byte (the
    # byte only rejects misuse). The models mount the production sidecar and
    # bitmap sources; they do not cover the raw-pointer reclaim itself.
    - name: nl3 remote reclaim and owner teardown models
      run: |
        set -o pipefail
        cargo test --release --features "alloc-global alloc-xthread internals tagged-index-stack/loom"             --test loom_nl3_remote_reclaim             --test loom_nl3_owner_teardown 2>&1 | tee "$RUNNER_TEMP/loom-nl3.log"
        grep -F "test actual_cut_races_distinct_word_producers_and_reuses_taken_identity ... ok" "$RUNNER_TEMP/loom-nl3.log"
        grep -F "test prepublished_same_word_pair_is_cut_as_two_records ... ok" "$RUNNER_TEMP/loom-nl3.log"
        grep -F "test detached_record_keeps_credit_until_owner_insertion ... ok" "$RUNNER_TEMP/loom-nl3.log"
        grep -F "test teardown_credit_survives_cut_then_cross_thread_owner_drains_and_reuses_taken_block ... ok" "$RUNNER_TEMP/loom-nl3.log"
        grep -F "test prepublished_same_word_pair_preserves_both_outstanding_credits ... ok" "$RUNNER_TEMP/loom-nl3.log"
        grep -F "test modeled_double_retirement_negative_control - should panic ... ok" "$RUNNER_TEMP/loom-nl3.log"
        grep -F "test modeled_owner_double_retirement_negative_control - should panic ... ok" "$RUNNER_TEMP/loom-nl3.log"
      shell: bash
