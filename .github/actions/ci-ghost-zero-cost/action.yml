name: CI ghost-zero-cost
description: Original ghost-zero-cost job steps
runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@stable
    - uses: actions/setup-node@v5
      with:
        node-version: '22'
    - run: |
        . /etc/os-release
        test "$ID" = ubuntu
        test -n "${VERSION_CODENAME:-}"
        printf 'deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://archive.ubuntu.com/ubuntu %s main restricted universe multiverse\n' "$VERSION_CODENAME" "$VERSION_CODENAME-updates" "$VERSION_CODENAME-backports" > "$RUNNER_TEMP/ubuntu-ci.list"
        printf 'deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://security.ubuntu.com/ubuntu %s-security main restricted universe multiverse\n' "$VERSION_CODENAME" >> "$RUNNER_TEMP/ubuntu-ci.list"
        sudo apt-get -o Dir::Etc::sourcelist="$RUNNER_TEMP/ubuntu-ci.list" -o Dir::Etc::sourceparts="-" update -q
        sudo apt-get -o Dir::Etc::sourcelist="$RUNNER_TEMP/ubuntu-ci.list" -o Dir::Etc::sourceparts="-" install -y -q valgrind binutils
      # ci-default-shell: preserve original implicit runner shell
      shell: bash -e {0}
    - run: |
        BASE="${{ github.event.pull_request.base.sha }}"
        [ -z "$BASE" ] && BASE="${{ github.event.before }}"
        git cat-file -e "$BASE^{commit}" 2>/dev/null || BASE=HEAD^
        PR_HEAD="${{ github.event.pull_request.head.sha }}"
        [ -z "$PR_HEAD" ] && PR_HEAD=HEAD
        node scripts/ghost_zero_cost.mjs --base "$BASE" --allow-declared-runtime --head "$PR_HEAD" --require-ir --out "$RUNNER_TEMP/ghost_zero_cost.json"
      # ci-default-shell: preserve original implicit runner shell
      shell: bash -e {0}
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: ghost-zero-cost
        path: ${{ runner.temp }}/ghost_zero_cost.json
        if-no-files-found: ignore
