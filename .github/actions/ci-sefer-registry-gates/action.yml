name: CI sefer-registry-gates
description: sefer-registry package gates (P2.3 extraction)
runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy
    - run: cargo clippy -p sefer-registry --all-targets -- -D warnings
      # ci-default-shell: preserve original implicit runner shell
      shell: bash -e {0}
    - run: cargo clippy -p sefer-registry --no-default-features --all-targets -- -D warnings
      # ci-default-shell: preserve original implicit runner shell
      shell: bash -e {0}
    - run: cargo clippy -p sefer-registry --all-features --all-targets -- -D warnings
      # ci-default-shell: preserve original implicit runner shell
      shell: bash -e {0}
    - run: cargo check -p sefer-registry --all-features --all-targets
      # ci-default-shell: preserve original implicit runner shell
      shell: bash -e {0}
    - run: RUSTDOCFLAGS="-D warnings" cargo doc -p sefer-registry --all-features --no-deps
      # ci-default-shell: preserve original implicit runner shell
      shell: bash -e {0}
    # Packaging is deferred until the path dependencies are published.
