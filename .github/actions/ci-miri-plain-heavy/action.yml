name: CI miri-plain-heavy
description: miri-plain sharded by target — the single heaviest plain target, b4-r1 pin cache
runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@nightly
      with:
        components: miri
    # The b4-r1 cached-pin fast path (miss then same-base hit, TLS exit
    # release). Full owner and sidecar-miss workloads stay native; the tiny
    # owner-credit invariant runs separately.
    # Sharding note: this is the single heaviest plain target, measured
    # ~1041s (run 43984907030); it is one target and cannot be split further
    # without test-name filters (docs/perf/CI_LONG_JOBS.md). The large
    # free/no-leak regression runs in miri-plain-rest.
    - name: b4-r1 pin cache (plain provenance)
      # ci-default-shell: preserve original implicit runner shell
      shell: bash -e {0}
      run: cargo miri test --features "alloc-global alloc-xthread alloc-decommit internals bench-internals" --test b4_r1_pin_cache_miri
