name: CI miri-core-tb
description: Original miri-core-tb job steps
runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@nightly
      with:
        components: miri
    - name: b4-r1 pin cache narrow provenance under TreeBorrows
      env:
        MIRIFLAGS: "-Zmiri-strict-provenance -Zmiri-disable-isolation -Zmiri-tree-borrows -Zmiri-report-progress=10000000"
      # ci-default-shell: preserve original implicit runner shell
      shell: bash -e {0}
      run: |
        set -o pipefail
        cargo miri test --features "alloc-global internals bench-internals" --test b4_r1_pin_cache_miri -- narrow 2>&1 | tee "$RUNNER_TEMP/miri-b4-r1-pin-cache-tree.log"
        grep -F "[b4_r1_pin_cache_miri] COMPLETE narrow" "$RUNNER_TEMP/miri-b4-r1-pin-cache-tree.log"
