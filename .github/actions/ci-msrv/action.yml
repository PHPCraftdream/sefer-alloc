name: CI msrv
description: Original msrv job steps
runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@1.93
    - run: cargo check --all-features
      # ci-default-shell: preserve original implicit runner shell
      shell: bash -e {0}
    - run: cargo test --no-run --all-features
    # Members below declare their own 1.88 floor.
      # ci-default-shell: preserve original implicit runner shell
      shell: bash -e {0}
    - uses: dtolnay/rust-toolchain@1.88
      with:
        targets: thumbv7em-none-eabi
    # sefer-region-specific MSRV checks: make the no_std path and all-features
    # configuration explicitly verified on the pinned 1.88 toolchain (see
    # task #823 finding for why this is needed beyond the workspace-wide
    # checks above).
    - run: cargo check -p sefer-region --all-features
      # ci-default-shell: preserve original implicit runner shell
      shell: bash -e {0}
    - run: cargo check -p sefer-region --no-default-features
      # ci-default-shell: preserve original implicit runner shell
      shell: bash -e {0}
    - run: cargo test -p sefer-region --no-run --all-features
      # ci-default-shell: preserve original implicit runner shell
      shell: bash -e {0}
    - run: cargo check -p sefer-region --no-default-features --target thumbv7em-none-eabi
    # aligned-vmem-specific MSRV check (task #1173/L3, closing
    # docs/CORRECTNESS_OPEN_ITEMS.md item 88): the root manifest's feature
    # forwarding never turns on `aligned-vmem/huge-pages` (confirmed:
    # `grep -oE '"aligned-vmem\??/[a-z-]+"' Cargo.toml | sort -u` lists
    # bench-internals/fault-injection/lazy-commit only), so the workspace-
    # root `--all-features` step above never compiles it, on ANY toolchain
    # pinned to this job — every other job that DOES compile
    # `huge-pages` (`test` workspace-members' `--all-features` row,
    # `aligned-vmem-gates`) runs on `dtolnay/rust-toolchain@stable`, a
    # newer toolchain, not this pinned 1.88 one. Mirrors the `sefer-region`
    # rows above rather than adding `aligned-vmem/huge-pages` to the root
    # manifest's forwarding list (item 88's own card names both options and
    # recommends this one as the narrower fix: it does not change what any
    # OTHER job's plain root `--all-features` build compiles). `--all-features`
    # here also covers `bench-internals`, `lazy-commit`, and `fault-injection`
    # together with `huge-pages` in one compile, matching how the workspace-
    # root step above already exercises the other three.
      # ci-default-shell: preserve original implicit runner shell
      shell: bash -e {0}
    - run: cargo check -p aligned-vmem --all-features
      # ci-default-shell: preserve original implicit runner shell
      shell: bash -e {0}
    - run: cargo test -p aligned-vmem --no-run --all-features
    # numa-shim-specific MSRV checks (task #1282/E8, item 102 — the same
    # class item 88/task #1173 closed for aligned-vmem above): post-#1288 the
    # workspace-root `--all-features` steps at the top of this job reach
    # numa-shim with `vmem-integration` only and the real arms are ALWAYS
    # compiled (mock is a build flag, not a feature); the two rows keep their
    # value (default-feature cargo-add config + full test/dev graph at 1.88).
      # ci-default-shell: preserve original implicit runner shell
      shell: bash -e {0}
    - run: cargo check -p numa-shim
      # ci-default-shell: preserve original implicit runner shell
      shell: bash -e {0}
    - run: cargo test -p numa-shim --no-run --all-features
    # task #1299 (T12, item 103): closes the mock-arm MSRV gap the comment
    # above left open — `--all-features` can no longer reach the
    # `numa_shim_mock` cfg (it is a build flag, not a feature) post-#1288.
      # ci-default-shell: preserve original implicit runner shell
      shell: bash -e {0}
    - run: cargo test -p numa-shim --no-run
      env:
        RUSTFLAGS: "--cfg numa_shim_mock"
    # once-ptr-cell-specific MSRV checks (item 135/task #1410, the same
    # parity gap item 88/task #1173 and item 102/task #1282 already closed
    # for aligned-vmem/numa-shim above): the workspace-root `--all-features`
    # steps at the top of this job run without `-p`/`--workspace` in this
    # NON-virtual workspace (root package = `sefer-alloc`), so they act on
    # the root package only — `once-ptr-cell` reaches them merely as a
    # path-dependency LIBRARY (via the `alloc-core` feature), never as its
    # own tested workspace member. Its `tests/cell_unit.rs` and the
    # dev-dependency `bench-scale-tool` were never compiled on the pinned
    # 1.88 toolchain by anything in this job before this row. No
    # `--all-features` here: the crate declares no `[features]` table.
      # ci-default-shell: preserve original implicit runner shell
      shell: bash -e {0}
    - run: cargo check -p once-ptr-cell
      # ci-default-shell: preserve original implicit runner shell
      shell: bash -e {0}
    - run: cargo test -p once-ptr-cell --no-run
    # size-classes-specific MSRV checks (publication audit run 1,
    # Sol-codex, P3-3): the same parity gap the once-ptr-cell rows
    # immediately above already close -- the workspace-root
    # `--all-features` steps at the top of this job reach size-classes
    # only as a path-dependency LIBRARY (via `alloc-core`), never as its
    # own tested workspace member, so its `tests/builder.rs`/
    # `tests/proptest_builder.rs` and the `proptest` dev-dependency was
    # never compiled on the pinned 1.88 toolchain by anything in this job
    # before this row. No `--all-features` here: the crate declares no
    # `[features]` table.
      # ci-default-shell: preserve original implicit runner shell
      shell: bash -e {0}
    - run: cargo check -p size-classes
      # ci-default-shell: preserve original implicit runner shell
      shell: bash -e {0}
    - run: cargo test -p size-classes --no-run
    # `cargo test`'s default target set excludes bench targets entirely
    # (verified empirically, the same fact task #1395 established for
    # once-ptr-cell's identical bench shape) -- the exclusion is the
    # target KIND, not `harness = false` specifically, so it only
    # compiles `bench-scale-tool` itself as a library dependency, never
    # the bench FILE that calls its API. This row is the only thing in
    # any job that type-checks `benches/size_classes_bench.rs` on the
    # pinned 1.88 toolchain (rush-tests review finding T1).
      # ci-default-shell: preserve original implicit runner shell
      shell: bash -e {0}
    - run: cargo bench -p size-classes --no-run
    # The root `--all-features` rows reach this crate only as a path-
    # dependency library, not as its own test/bench targets. These explicit
    # rows compile its library, tests, and bench under the pinned 1.88
    # toolchain. The crate declares `rust-version = "1.79"`; `--all-features`
    # is intentionally omitted because `loom` needs its dedicated cfg+
    # feature job, while the repository-cfg rows have stable coverage above.
      # ci-default-shell: preserve original implicit runner shell
      shell: bash -e {0}
    - run: cargo check -p tagged-index-stack
      # ci-default-shell: preserve original implicit runner shell
      shell: bash -e {0}
    - run: cargo test -p tagged-index-stack --no-run
    # `cargo test` does not build bench targets; this row type-checks the
    # tagged-index-stack bench under the pinned 1.88 toolchain.
      # ci-default-shell: preserve original implicit runner shell
      shell: bash -e {0}
    - run: cargo bench -p tagged-index-stack --no-run
    # globalalloc-model-specific MSRV checks (pre-publish review run 1,
    # 2026-09-06, P2-8): the workspace-root `--all-features` steps at the top
    # of this job reach this crate only as a path-dependency LIBRARY (via the
    # root's dev-dependency feature forwarding), never as its own tested
    # workspace member — its four tests/ files and the `arbitrary` feature
    # (arbitrary_stream.rs + derive_arbitrary) were never compiled on the
    # pinned 1.88 toolchain by anything before these rows. The crate declares
    # `rust-version = "1.85"` (bounded by proptest 1.11's own MSRV, review
    # P3-23); 1.88 here is above that floor and matches the job's pin.
      # ci-default-shell: preserve original implicit runner shell
      shell: bash -e {0}
    - run: cargo check -p globalalloc-model --all-features
      # ci-default-shell: preserve original implicit runner shell
      shell: bash -e {0}
    - run: cargo test -p globalalloc-model --no-run --all-features
    # proc-probe-specific MSRV checks (Sol-codex round-2 review, P4-3;
    # corrected round-3 review P4-1): the workspace-root `--all-features`
    # rows at the top of this job reach proc-probe only as a
    # default-feature path-dependency LIBRARY (through the root's
    # dev-dependency graph), never as its own tested member — its
    # `tests/protocol.rs` was never compiled on the pinned 1.88 toolchain
    # by anything before these rows. The crate declares
    # `rust-version = "1.88"`, matching this job's pin exactly.
    # `--all-targets` is the point: a plain `cargo check` would compile
    # the library alone and miss the test target. These two rows are HOST
    # checks (default and `--no-default-features`) — round-3 review P4-1
    # caught that the round-2 CHANGELOG entry wrongly called the second
    # row "bare-metal": `--all-targets` compiles the host test binary, and
    # nothing here passes `--target`. These rows must stay ABOVE the
    # `dtolnay/rust-toolchain@1.79` switch below, while plain `cargo`
    # still resolves to 1.88.
      # ci-default-shell: preserve original implicit runner shell
      shell: bash -e {0}
    - run: cargo check -p proc-probe --all-targets
      # ci-default-shell: preserve original implicit runner shell
      shell: bash -e {0}
    - run: cargo check -p proc-probe --all-targets --no-default-features
    # The REAL bare-metal check (round-3 review P4-1): library ONLY (no
    # `--all-targets` — the host test binary uses std and doesn't belong
    # on bare metal) on the actual `thumbv7em-none-eabi` target, still on
    # the pinned 1.88 toolchain. Mirrors the `sefer-region` bare-metal row
    # above (`cargo check -p sefer-region --no-default-features --target
    # thumbv7em-none-eabi`); this job already installs that target
    # (`targets: thumbv7em-none-eabi` on the `dtolnay/rust-toolchain@1.88`
    # step above).
      # ci-default-shell: preserve original implicit runner shell
      shell: bash -e {0}
    - run: cargo check -p proc-probe --no-default-features --target thumbv7em-none-eabi
    # The published library surface has MSRV 1.79: `inline const`, used by
    # `ArrayLinks::new`, is stabilized there. The floor rows check the
    # library on both the host and the no_std `x86_64-unknown-none` target;
    # the latter is the MSRV × native-AtomicU64 intersection. The 1.88 rows
    # above cover test and bench compilation, and the stable loom job covers
    # the cfg+feature loom configuration.
      # ci-default-shell: preserve original implicit runner shell
      shell: bash -e {0}
    - uses: dtolnay/rust-toolchain@1.79
      with:
        targets: x86_64-unknown-none
    - run: cargo check -p tagged-index-stack
      # ci-default-shell: preserve original implicit runner shell
      shell: bash -e {0}
    - run: RUSTFLAGS="--cfg tagged_index_stack_test" cargo check -p tagged-index-stack
      # ci-default-shell: preserve original implicit runner shell
      shell: bash -e {0}
    - run: cargo check -p tagged-index-stack --target x86_64-unknown-none
    # P3-7 (pre-publish review run 2, 2026-09-06): the crate DECLARES
    # `rust-version = "1.85"` (bounded by proptest 1.11's own MSRV) but
    # the globalalloc-model rows above run on this job's 1.88 pin — above
    # that floor — so the published floor was verified only by manual
    # local runs. Same per-crate floor-toolchain pattern as
    # tagged-index-stack above: check the crate on exactly 1.85.
    # `--all-features` (both optional front-ends) is the right scope: it
    # compiles proptest and arbitrary as real dependencies, so a future
    # proptest 1.x whose rust-version rises above 1.85 fails THIS row,
    # not a user's build.
      # ci-default-shell: preserve original implicit runner shell
      shell: bash -e {0}
    - uses: dtolnay/rust-toolchain@1.85
    - run: cargo check -p globalalloc-model --all-features

      # ci-default-shell: preserve original implicit runner shell
      shell: bash -e {0}
