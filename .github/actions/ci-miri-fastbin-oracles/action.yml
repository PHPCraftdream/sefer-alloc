name: CI miri-fastbin-oracles
description: miri-fastbin sharded by step — the regression_merged magazine-oracles filter
runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@nightly
      with:
        components: miri
    # `internals` added (R34-3/task #522): regression_magazine_oracles.rs
    # (now tests/regression_merged/regression_magazine_oracles.rs under the
    # P0.2 `regression_merged` target) reaches
    # `sefer_alloc::registry::{bootstrap, HeapRegistry}` directly.
    - name: regression_merged magazine oracles
      # ci-default-shell: preserve original implicit runner shell
      shell: bash -e {0}
      run: |
        cargo miri test --features "alloc-global alloc-xthread alloc-decommit fastbin internals" --test regression_merged -- regression_magazine_oracles::
