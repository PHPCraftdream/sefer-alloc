name: CI miri-fastbin-integrity-rest
description: miri-fastbin sharded by step — the bump-direct-refill and NL-3 safe-integrity targets
runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@nightly
      with:
        components: miri
    - name: bump-direct refill and NL-3 safe-integrity suite
      # ci-default-shell: preserve original implicit runner shell
      shell: bash -e {0}
      run: cargo miri test --features "alloc-global alloc-xthread alloc-decommit fastbin internals" --test regression_bump_direct_refill --test nl3_safe_xthread_churn_integrity
