name: CI kani
description: Original kani job steps
runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@stable
    - name: Install kani-verifier
      # ci-default-shell: preserve original implicit runner shell
      shell: bash -e {0}
      run: cargo install --locked kani-verifier
    - name: cargo kani setup
      # ci-default-shell: preserve original implicit runner shell
      shell: bash -e {0}
      run: cargo kani setup
    - name: cargo kani (sefer-concurrent harnesses)
      # P1.2 moved the epoch `hand_proofs` (AtomicSlot vacant-slot facts) into
      # the sefer-concurrent crate together with the internals they prove
      # against.
      # ci-default-shell: preserve original implicit runner shell
      shell: bash -e {0}
      run: cargo kani -p sefer-concurrent
    # P2.4: run the 12 segment and 8 registry proofs in their owning crates.
    - name: cargo kani (sefer-segment harnesses)
      # ci-default-shell: preserve original implicit runner shell
      shell: bash -e {0}
      run: cargo kani -p sefer-segment --all-features
    - name: cargo kani (sefer-registry harnesses)
      # ci-default-shell: preserve original implicit runner shell
      shell: bash -e {0}
      run: cargo kani -p sefer-registry --all-features
