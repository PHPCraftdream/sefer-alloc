name: CI kani
description: Original kani job steps
runs:
  using: composite
  steps:
    # Card 289: three `kani proofs` runs lost their runner at 45:00-46:01
    # against an 18-24 min green norm. Sample runner state while proofs run.
    - name: Start runner telemetry
      shell: bash
      run: |
        set -euo pipefail
        log="$RUNNER_TEMP/kani-telemetry.log"
        : > "$log"
        nohup bash -c 'while :; do
            { date -u "+%Y-%m-%dT%H:%M:%SZ"; free -m | grep "^Mem:"; uptime;
              ps -eo pid,rss,etimes,args --sort=-rss | head -4 | cut -c1-220; } >> "$1" 2>&1
            sleep 30
          done' _ "$log" >/dev/null 2>&1 &
    - uses: dtolnay/rust-toolchain@stable
    - name: Install kani-verifier
      # ci-default-shell: preserve original implicit runner shell
      shell: bash -e {0}
      run: cargo install --locked kani-verifier
    - name: cargo kani setup
      # ci-default-shell: preserve original implicit runner shell
      shell: bash -e {0}
      run: cargo kani setup
    - name: cargo kani (sefer-concurrent harnesses)
      # P1.2 moved the epoch `hand_proofs` (AtomicSlot vacant-slot facts) into
      # the sefer-concurrent crate together with the internals they prove
      # against.
      # ci-default-shell: preserve original implicit runner shell
      shell: bash -e {0}
      run: cargo kani -p sefer-concurrent
    # P2.4: run the 12 segment and 8 registry proofs in their owning crates.
    - name: cargo kani (sefer-segment harnesses)
      # ci-default-shell: preserve original implicit runner shell
      shell: bash -e {0}
      run: cargo kani -p sefer-segment --all-features
    - name: cargo kani (sefer-registry harnesses)
      # ci-default-shell: preserve original implicit runner shell
      shell: bash -e {0}
      run: cargo kani -p sefer-registry --all-features
    - name: Runner telemetry tail
      if: always()
      shell: bash
      run: |
        set -euo pipefail
        log="$RUNNER_TEMP/kani-telemetry.log"
        if [ -f "$log" ]; then
          echo "--- last 150 lines of $log ---"
          tail -n 150 "$log"
        else
          echo "no runner telemetry was collected"
        fi
