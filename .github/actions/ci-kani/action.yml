name: CI kani
description: Original kani job steps
runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@stable
    - name: Install kani-verifier
      # ci-default-shell: preserve original implicit runner shell
      shell: bash -e {0}
      run: cargo install --locked kani-verifier
    - name: cargo kani setup
      # ci-default-shell: preserve original implicit runner shell
      shell: bash -e {0}
      run: cargo kani setup
    - name: cargo kani (all harnesses)
      # ci-default-shell: preserve original implicit runner shell
      shell: bash -e {0}
      run: cargo kani --features "alloc-core experimental alloc-global internals fastbin alloc-decommit"
    - name: cargo kani (sefer-concurrent harnesses)
      # P1.2 moved the epoch `hand_proofs` (AtomicSlot vacant-slot facts) into
      # the sefer-concurrent crate together with the internals they prove
      # against; the root invocation above no longer sees them.
      # ci-default-shell: preserve original implicit runner shell
      shell: bash -e {0}
      run: cargo kani -p sefer-concurrent
    # P2.1 moves segment proof harnesses with their crate; root harnesses do
    # not cover package-scoped proofs after the extraction.
    - name: cargo kani (sefer-segment harnesses)
      # ci-default-shell: preserve original implicit runner shell
      shell: bash -e {0}
      run: cargo kani -p sefer-segment --all-features
    # Alloc-core proofs still live in the ROOT crate's src/kani_proofs.rs
    # until the P2.4 workflow split moves them with the crate; this row is a
    # PACKAGE CHECK of sefer-alloc-core under kani, not migrated proofs. The
    # kani LANE itself stays in this composite (invoked root-scoped from
    # ci.yml) until P2.4; do not remove this step before that lands.
    - name: cargo kani (sefer-alloc-core harnesses)
      # ci-default-shell: preserve original implicit runner shell
      shell: bash -e {0}
      run: cargo kani -p sefer-alloc-core --all-features
