name: CI loom-xthread
description: Original loom-xthread job steps
runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@stable
    # NL-11: the producer-side class check of SidecarBitmap::publish is off in production; the model keeps
    # its never-issued-granule asserts in this row (`misuse-checks`), the next step runs the trusting mode.
    - name: loom sidecar bitmap model with misuse-checks
      # ci-default-shell: preserve original implicit runner shell
      shell: bash -e {0}
      run: |
        set -o pipefail
        cargo test --release --features "alloc-core alloc-xthread tagged-index-stack/loom misuse-checks" \
          --test loom_sidecar_bitmap_actual 2>&1 | tee "$RUNNER_TEMP/loom-sidecar-misuse.log"
        grep -F "test loom_actual_two_producers_same_word_two_discoveries_no_loss_no_dup ... ok" "$RUNNER_TEMP/loom-sidecar-misuse.log"
    - run: |
        set -o pipefail
        cargo test --release --features "alloc-core alloc-xthread tagged-index-stack/loom" \
          --test loom_sidecar_bitmap_actual \
          --test loom_sidecar_summary \
          --test loom_route_pin_unlink \
          --test loom_b4_r1_pin_cache \
          --test loom_terminal_owner_drain \
          --test loom_terminal_large \
          --test loom_exact_shard_actual \
          --test loom_fallback_actual \
          --test loom_b4_scan_skip_empty_publish             --test loom_g1_ingress_exact \
          --test loom_thp_tuple_cell \
          --test loom_thp_ledger \
          --test loom_thp_learning_cell 2>&1 | tee "$RUNNER_TEMP/loom-xthread.log"
        grep -F "test competing_observations_form_one_complete_serial_order_not_a_torn_pair ... ok" "$RUNNER_TEMP/loom-xthread.log"
        grep -F "test l1_publish_races_take_arm_drain ... ok" "$RUNNER_TEMP/loom-xthread.log"
        grep -F "test l2_fresh_route_notifies ... ok" "$RUNNER_TEMP/loom-xthread.log"
        grep -F "test l3_two_producers_one_owner_round ... ok" "$RUNNER_TEMP/loom-xthread.log"
        grep -F "test loom_actual_two_producers_same_word_two_discoveries_no_loss_no_dup ... ok" "$RUNNER_TEMP/loom-xthread.log"
        grep -F "test producer_owner_cut_and_duplicate_admission ... ok" "$RUNNER_TEMP/loom-xthread.log"
        grep -F "test owner_cache_or_release_is_exclusive ... ok" "$RUNNER_TEMP/loom-xthread.log"
        grep -F "test two_publishers_distinct_tuples_reader_never_torn ... ok" "$RUNNER_TEMP/loom-xthread.log"
        grep -F "test two_publishers_same_tuple_overcount_contract ... ok" "$RUNNER_TEMP/loom-xthread.log"
        grep -F "test reader_during_publication_sees_default_or_winner ... ok" "$RUNNER_TEMP/loom-xthread.log"
        grep -F "test racing_reserves_never_overshoot_budget ... ok" "$RUNNER_TEMP/loom-xthread.log"
        grep -F "test reserve_sequence_pins_exact_values ... ok" "$RUNNER_TEMP/loom-xthread.log"
        grep -F "test racing_insert_and_take_keep_the_shard_exact ... ok" "$RUNNER_TEMP/loom-xthread.log"
        grep -F "test racing_inserts_of_one_address_admit_one ... ok" "$RUNNER_TEMP/loom-xthread.log"
        grep -F "test fallback_init_and_lock_on_production_source ... ok" "$RUNNER_TEMP/loom-xthread.log"
        grep -F "test loom_actual_two_producers_distinct_words_two_discoveries_no_loss_no_dup ... ok" "$RUNNER_TEMP/loom-xthread.log"
        grep -F "test loom_actual_publish_racing_strict_trim_union_is_complete ... ok" "$RUNNER_TEMP/loom-xthread.log"
        grep -F "test loom_actual_leaves_prepare_race_publish_completed_issue_is_discoverable ... ok" "$RUNNER_TEMP/loom-xthread.log"
        grep -F "test loom_actual_leaves_two_producers_same_leaf_no_loss_no_dup ... ok" "$RUNNER_TEMP/loom-xthread.log"
        grep -F "test route_pin_under_lock_never_resurrects_unlinked_route ... ok" "$RUNNER_TEMP/loom-xthread.log"
        grep -F "test negative_pin_without_lock_resurrects_freed_route - should panic ... ok" "$RUNNER_TEMP/loom-xthread.log"
        # loom_b4_r1_pin_cache is the ACTUAL-SOURCE model of the b4-r1
        # cached-pin fast path (production route_pin_cache.rs / pin.rs /
        # directory.rs / small_sidecar.rs compiled onto loom atomics); the
        # should_panic rows are its negative shadow controls (gate
        # skip — M-A; relaxed/acquire gate false-read pair — the M-B
        # atomic mechanism, see the model header: production ordering
        # is NOT claimed necessary).
        grep -F "test loom_actual_cached_pin_publish_delivery_survives_unlink_race ... ok" "$RUNNER_TEMP/loom-xthread.log"
        grep -F "test loom_actual_negative_skip_linked_gate_writes_zombie_bit - should panic ... ok" "$RUNNER_TEMP/loom-xthread.log"
        grep -F "test loom_shadow_relaxed_gate_false_read_misses_index_unlink - should panic ... ok" "$RUNNER_TEMP/loom-xthread.log"
        grep -F "test loom_shadow_acquire_gate_false_read_sees_index_unlink ... ok" "$RUNNER_TEMP/loom-xthread.log"
        grep -F "test loom_actual_negative_cut_via_load_store_loses_concurrent_bit - should panic ... ok" "$RUNNER_TEMP/loom-xthread.log"
        grep -F "test loom_actual_negative_masked_cut_drops_pending_bits - should panic ... ok" "$RUNNER_TEMP/loom-xthread.log"
        grep -F "test loom_summary_conditional_two_words_no_loss ... ok" "$RUNNER_TEMP/loom-xthread.log"
        grep -F "test loom_summary_conditional_same_word_no_loss ... ok" "$RUNNER_TEMP/loom-xthread.log"
        grep -F "test loom_summary_pending_pause_strict_inclusion ... ok" "$RUNNER_TEMP/loom-xthread.log"
        grep -F "test loom_summary_spurious_bit_benign ... ok" "$RUNNER_TEMP/loom-xthread.log"
        grep -F "test loom_summary_negative_summary_before_pending - should panic ... ok" "$RUNNER_TEMP/loom-xthread.log"
        grep -F "test loom_summary_negative_clear_after_word_cut - should panic ... ok" "$RUNNER_TEMP/loom-xthread.log"
        grep -F "test loom_summary_negative_strict_uses_summary - should panic ... ok" "$RUNNER_TEMP/loom-xthread.log"
        grep -F "test loom_summary_negative_producer_never_sets_clean_summary - should panic ... ok" "$RUNNER_TEMP/loom-xthread.log"
        grep -F "test unpublished_and_detached_instances_hold_the_reservation_credit ... ok" "$RUNNER_TEMP/loom-xthread.log"
        grep -F "test negative_producer_retirement_allows_premature_release - should panic ... ok" "$RUNNER_TEMP/loom-xthread.log"
        grep -F "test loom_b4_publish_racing_zero_word_skip_found_by_later_scan ... ok" "$RUNNER_TEMP/loom-xthread.log"
      shell: bash
