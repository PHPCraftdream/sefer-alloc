[package]
name = "globalalloc-model"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
# MSRV decision, not a copy (review P3-23): this crate's own code is
# edition-2021 `core`+`alloc` with ancient stdlib usage, but the optional
# `proptest` front-end pins the effective floor through its dependency
# (proptest 1.11 declares `rust-version = "1.85"`). The workspace root's
# uniform `1.88` is one release train above that floor.
license = "MIT OR Apache-2.0"
description = "Reference-model and property-testing harness for Rust GlobalAlloc implementations."
readme = "README.md"
repository = "https://github.com/PHPCraftdream/sefer-alloc"
homepage = "https://github.com/PHPCraftdream/sefer-alloc/tree/main/crates/globalalloc-model"
documentation = "https://docs.rs/globalalloc-model"
keywords = ["allocator", "differential", "proptest", "fuzz", "globalalloc"]
categories = ["memory-management", "development-tools::testing", "no-std"]

# Without this, docs.rs builds with `default = []` (empty) and the published
# render would show neither `op_strategy` nor `OpStream` — both optional
# features, together, exactly equal `--all-features` for this crate's
# PUBLIC-API surface (the third feature, `internals`, is deliberately
# excluded: its only export stays `#[doc(hidden)]` even when enabled, so
# the rendered API is unchanged either way), so this is docs.rs's full
# public API surface, not a subset.
[package.metadata.docs.rs]
features = ["proptest", "arbitrary"]
rustdoc-args = ["--cfg", "docsrs"]

[features]
# The op-stream generator + reference model + oracles are always available and
# pull in NO dependencies (a normal build has zero non-dev deps). The two
# front-ends over that one model are behind optional features:
#   - `proptest`  — a `Strategy<Value = Vec<Op>>` for `cargo test` / miri
#     (no_std-compatible via `default-features = false, features =
#     ["alloc", "no_std"]`, which routes its float samplers through
#     num-traits/libm; verified on `thumbv7em-none-eabi`). NOTE: without
#     `std`, proptest seeds its RNG from a hardcoded constant — see
#     `[dev-dependencies]` below for how this crate's own tests avoid that.
#   - `arbitrary` — `impl Arbitrary for OpStream` for `cargo fuzz` / libFuzzer.
# Both are additive and independent; enable whichever front-end you need.
default = []
proptest = ["dep:proptest"]
arbitrary = ["dep:arbitrary"]
# Gates `peak_live_count`, `drive`'s own internal capacity-reservation
# pre-pass, which is `pub` (doc-hidden) ONLY so tests/peak_live_count.rs (a
# separate integration-test crate) can reach it directly. Off by default so a
# normal build (and `cargo package`'s published crate) exposes no such symbol
# at all — `#[doc(hidden)]` alone only hides an item from rustdoc, it does not
# restrict reachability (see the root sefer-alloc crate's R34-3/task #522
# finding B1 for the same lesson learned one crate over). Deliberately NOT
# listed in [package.metadata.docs.rs] above, so the published docs.rs render
# never shows it either.
internals = []

[dependencies]
proptest = { version = "1", optional = true, default-features = false, features = ["alloc", "no_std"] }
arbitrary = { version = "1", features = ["derive"], optional = true }

[dev-dependencies]
# Review run 2, P2-1: this crate's OWN property test must run on proptest's
# default (std-enabled) feature set. Without `std`, proptest 1.11's
# `TestRng::default_rng` takes its `#[cfg(not(feature = "std"))]` branch and
# seeds from a hardcoded constant, which silently turned
# `system_matches_reference_model` into a fixed-seed regression suite. The
# `[dependencies]` entry above stays no_std-only for the bare-metal proof;
# resolver v2 keeps dev-dependency features out of non-test builds, so
# `cargo build -p globalalloc-model --features proptest --target
# thumbv7em-none-eabi` still proves the no_std claim. A consumer who enables
# the `proptest` feature WITHOUT their own std-featured proptest still gets
# that deterministic seeding (documented in README).
proptest = { version = "1" }
