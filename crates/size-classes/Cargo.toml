[package]
name = "size-classes"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
description = "Const-built mimalloc-style size-class tables with an O(1) size->class lookup and an alignment-aware classifier. no_std, zero deps, #![forbid(unsafe_code)]."
readme = "README.md"
repository = "https://github.com/PHPCraftdream/sefer-alloc"
homepage = "https://github.com/PHPCraftdream/sefer-alloc/tree/main/crates/size-classes"
documentation = "https://docs.rs/size-classes"
keywords = ["allocator", "size-class", "slab", "alignment", "no-std"]
categories = ["memory-management", "data-structures", "no-std::no-alloc"]

[lints]
# size-classes publication audit run 1 (Sol-codex, P3-3): inherits the
# workspace's shared lint policy, matching once-ptr-cell's own
# `[lints] workspace = true` (crates/once-ptr-cell/Cargo.toml). This
# crate declares no unused cfg of its own (no `loom`/`kani` dependency),
# so the workspace's shared `[workspace.lints.rust]` check-cfg entries
# are simply inert here -- inheriting the policy itself, not any specific
# cfg allowance, is the point: a future workspace-wide lint tightening
# reaches this crate automatically instead of silently excluding it.
workspace = true

[dependencies]

[dev-dependencies]
bench-scale-tool = "0.1"
proptest = "1"

[[bench]]
name = "size_classes_bench"
harness = false
