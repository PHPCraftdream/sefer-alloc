[package]
name = "numa-shim"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
description = "100% Rust NUMA detection and reservation — no C/C++ libraries (no libnuma, no hwloc). Linux mbind(2) via raw syscall(2), Windows VirtualAllocExNuma, sysfs cpumap reader. Zero crate deps by default; the public API is fully forbid(unsafe_code)-friendly."
readme = "README.md"
repository = "https://github.com/PHPCraftdream/sefer-alloc"
homepage = "https://github.com/PHPCraftdream/sefer-alloc/tree/main/crates/numa-shim"
documentation = "https://docs.rs/numa-shim"
keywords = ["numa", "mbind", "scheduling", "memory", "sysfs"]
categories = ["os", "memory-management"]

# Platform support scope: Windows is supported on 64-bit targets ONLY
# (`x86_64-pc-windows-msvc` and equivalent). 32-bit Windows is explicitly
# OUT OF SCOPE — an owner policy decision (task #1313, 2026-08-24,
# fifteenth review finding F11), not an untested "might work" gap: the
# crate's Windows FFI test layout has always assumed a 64-bit pointer
# width and CI has only ever covered 64-bit `windows-latest`.
# Documentation-only policy — no `cfg(target_pointer_width)` gate is
# enforced in code. The same statement lives in README.md's platform
# table and src/lib.rs's crate-doc platform matrix; keep the three in
# sync.

# docs.rs: render with `vmem-integration` on so `reserve_preferred_on_node` — one of
# this crate's two headline capabilities, and the thing the README documents
# at length — actually appears on the published docs page; the default
# feature set is empty (see `[features]` below), so a plain `cargo doc`
# render omits it entirely (task #644). Deliberately an explicit list, NOT
# `all-features = true`: `mock` is no longer a Cargo feature (converted to
# the build-time `--cfg numa_shim_mock` flag in task #1288, mirroring
# aligned-vmem's task #962), so `all-features` CANNOT turn it on at all —
# the explicit list is kept for clarity and future-proofing.
[package.metadata.docs.rs]
features = ["vmem-integration"]

[features]
default = []
vmem-integration = ["dep:aligned-vmem"]
# NOTE: this used to be a Cargo feature whose unification hazard was
# documented as an open risk (task #726, rust-intel audit §C10; docs/CORRECTNESS_OPEN_ITEMS.md
# item 42). RESOLVED 2026-08-23 (task #1288) by converting it to the
# build-time `--cfg numa_shim_mock` flag — mirroring aligned-vmem's task #962.
# The cfg still applies build-graph-wide once set — what changed is WHO can set
# it: only the top-level build invoker via an explicit `RUSTFLAGS="--cfg numa_shim_mock"`
# (or build-script) choice, never a transitive dependency through Cargo's
# additive feature-unification, and never `--all-features`/docs.rs/`cargo add` by
# accident. The `numa_shim::mock` module, its API, and the dispatch behavior are
# unchanged; only the activation mechanism moved. Removing the feature is
# semver-breaking against published 0.1.0 (see CHANGELOG "Removed"); see
# docs/NUMA_TESTING_OPTIONS.md Phase 1 for the original design note.
#
[dependencies]
aligned-vmem = { version = "0.2", path = "../aligned-vmem", optional = true }

# `numa_shim_mock` is a build-time cfg (set via `RUSTFLAGS="--cfg numa_shim_mock"`),
# NOT a Cargo feature — cfg flags do not unify across the build's dependency
# graph, which is the whole point of the task #1288 conversion (mirroring
# aligned-vmem's task #962). Declaring it here keeps `unexpected_cfgs` silent
# for this crate (same pattern as `crates/aligned-vmem/Cargo.toml`'s own
# `[lints.rust]` table; this crate has no `[lints] workspace = true`).
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(numa_shim_mock)'] }

[lib]
name = "numa_shim"
path = "src/lib.rs"

[dev-dependencies]
bench-scale-tool = "0.1"

[[bench]]
name = "numa_bench"
harness = false
# This bench is NOT gated on `required-features` — the bench target is built
# (but never run) by `cargo test` / `cargo clippy --all-targets` / `cargo bench` rows,
# but it fails LOUDLY at runtime (see the panic in
# `benches/numa_bench.rs`) when invoked without `RUSTFLAGS="--cfg numa_shim_mock"`.
# A silently-skipped or no-op-passing bench is the vacuous-green hazard that
# burned this repo before (task #1070 "Breakage B"); a runtime panic (rather
# than `compile_error!`) is used so that real-backend `cargo test` / `cargo clippy
# --all-targets` rows — which BUILD this bench target but never RUN it — stay green.
