# hook-call-requires-unsafe compile-fail fixture — compiled ONLY by
# tests/compile_fail.rs (never by the workspace: the detached
# [workspace] table below opts it out, and cargo does not auto-discover nested
# test dirs). Deliberately dependency-free apart from the path dep, so
# `cargo build --offline` needs no network.
[workspace]

[package]
name = "tis_compile_fail_hook_call_requires_unsafe"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
tagged-index-stack = { path = "../../.." }
