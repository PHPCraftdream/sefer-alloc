[package]
name = "tagged-index-stack"
version = "0.1.0"
edition = "2021"
# MSRV is a LIBRARY-SURFACE floor (the published library's newest API, never
# the dev-dependency graph's) — see README.md's "MSRV" section for the full
# measured rationale.
rust-version = "1.79"
license = "MIT OR Apache-2.0"
description = "Lock-free, allocation-free, no_std free-list of small indices (a slot recycler) with a strictly monotonic, non-wrapping ABA-eliminating tag packed into one atomic word."
readme = "README.md"
repository = "https://github.com/PHPCraftdream/sefer-alloc"
homepage = "https://github.com/PHPCraftdream/sefer-alloc/tree/main/crates/tagged-index-stack"
documentation = "https://docs.rs/tagged-index-stack"
keywords = ["lock-free", "aba", "free-list", "slab", "no-std"]
categories = ["concurrency", "data-structures", "no-std::no-alloc"]
# tests/compile_fail/ fixture crates auto-exclude via the nested-manifest rule;
# explicit so the .crate never depends on that default (the shipped driver +
# tests/common/ skip when fixtures are absent). scripts/ and the scratch-guard
# test that drives it are repository-only measurement infrastructure.
exclude = ["tests/compile_fail/", "scripts/", "tests/tis_p3_ab_runner_scratch_guard.rs"]

# Crate-local `unexpected_cfgs` declaration, deliberately NOT the
# workspace-inherited table (`[lints] workspace = true`): the workspace
# allowlist also carries root-crate-only cfgs (`kani`,
# `aligned_vmem_page_size_override`, `numa_shim_mock`) that would otherwise
# ship in this crate's published, normalized manifest looking like this
# crate's own. `loom` is the only non-standard cfg this crate's source uses
# (same pattern as `crates/aligned-vmem/Cargo.toml`'s `[lints.rust]` table).
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)'] }

# Allowed: dev-only tests use APIs newer than the library-surface MSRV floor
# (`std::panic::PanicHookInfo`, stable 1.81); the floor's real oracle is the
# msrv job's pinned `cargo +1.79 check` rows in `.github/workflows/ci.yml`.
# MSRV policy + measured re-derivation:
# docs/adr/2026-09-01-tagged-index-stack-doc-consolidation-and-review-history.md.
[lints.clippy]
incompatible-msrv = "allow"

[dependencies]
# `loom` is optional so a NORMAL build has zero loom entries in `Cargo.lock`
# (a non-optional `cfg(loom)` target dep would still be resolved and locked
# into every consumer). Running the loom suite needs BOTH `--cfg loom` in
# RUSTFLAGS and `--features loom`; the cfg alone fails fast with a named
# `compile_error!` in `src/lib.rs`.

[target.'cfg(loom)'.dependencies]
loom = { workspace = true, optional = true }

[dev-dependencies]
proptest = "1"
# Fixed-iteration bench harness (dev-only — never reaches published
# consumers). See benches/tagged_index_stack_bench.rs.
bench-scale-tool = "0.1"

[features]
# Gates the CAS-retry/backoff activation counters, their `#[doc(hidden)]`
# accessors, and the test-only raw probes (all read-only) — instrumentation
# with no production caller, off by default; the loom build compiles the same
# counters without this feature. The link-cell WRITE probe
# `store_next_for_test` is deliberately NOT gated here — it is
# `#[cfg(loom)]`-only, since a safe write probe would let a consumer corrupt
# the link chain.
test-internals = []

[[bench]]
name = "tagged_index_stack_bench"
harness = false
# Stated explicitly rather than left to cargo's default: `cargo test` must
# not treat this bench as a test target. ci.yml's clippy row relies on that
# (it is why `--all-targets` is the step that covers the bench at all), and
# an implicit default is not something a workflow comment should be citing.
test = false
