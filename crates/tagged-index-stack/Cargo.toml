[package]
name = "tagged-index-stack"
version = "0.1.0"
edition = "2021"
# LIBRARY-SURFACE floor (Sol-codex review run 4, finding P2-3): the MSRV
# covers the PUBLISHED LIBRARY only, never the dev-dependency/test target
# set — a library consumer never builds this crate's dev-dependencies, so
# dev-only API usage must not raise the floor. MEASURED, not assumed:
# `cargo +1.79 check -p tagged-index-stack` (default AND `--features
# test-internals`) compiles the library clean; `cargo +1.78 check` fails
# `error[E0658]: inline-const is experimental` at the ONE post-1.78 API in
# `src/`: the inline `const` block in the array-repeat of `ArrayLinks::new`
# (`next: [const { AtomicU32::new(0) }; N]`, `src/imp.rs` — inline-const
# stabilized in Rust 1.79, rust-lang/rust#76001). Every other API the
# library uses is older (`compare_exchange` 1.53, `spin_loop` 1.49, const
# generics 1.51, const `assert!` 1.57, inline format-args 1.58,
# `core::array::from_fn` 1.63; the `target_has_atomic` cfg evaluates fine
# at 1.78/1.79). Two measured, out-of-library caveats, for honesty: below
# 1.80 cargo emits an `unused manifest key` warning for the crate-local
# `[lints.rust] unexpected_cfgs` entry (cosmetic; the build succeeds); and
# NEITHER the test/clippy target set (dev-dep graph hard-blocked by
# `proptest -> getrandom 0.4.3` edition2024, verified live at 1.79) NOR the
# `--cfg loom` build (blocked by loom's third-party Windows transitive
# `windows-result 0.4.1` using `#[expect]`, stable 1.81) can run at this
# floor — which is why CI's msrv job oracle's this floor with a
# library-only check. The crate-local `[lints.clippy] incompatible-msrv`
# allow below is part of this same policy — see its comment.
rust-version = "1.79"
license = "MIT OR Apache-2.0"
description = "Lock-free, allocation-free, no_std free-list of small indices (a slot recycler) with an ABA-mitigating tag packed into one atomic word."
readme = "README.md"
repository = "https://github.com/PHPCraftdream/sefer-alloc"
homepage = "https://github.com/PHPCraftdream/sefer-alloc/tree/main/crates/tagged-index-stack"
documentation = "https://docs.rs/tagged-index-stack"
keywords = ["lock-free", "aba", "free-list", "slab", "no-std"]
categories = ["concurrency", "data-structures", "no-std::no-alloc"]
# The compile-fail fixture crates under tests/compile_fail/ (count drifts as
# new hazards get pinned — re-derive via `ls tests/compile_fail/ | wc -l`,
# do not trust a number quoted here) each have their own Cargo.toml, so
# cargo's nested-manifest packaging rule already auto-excludes them — this
# states that EXPLICITLY so the published .crate does not silently depend
# on that default. The compile_fail_*.rs driver files (`ls tests/ | grep
# ^compile_fail_ | wc -l`) are plain .rs files directly under tests/ and DO
# ship; each documents (and implements) its own skip-when-fixture-absent
# behavior for the packaged suite.
exclude = ["tests/compile_fail/"]

# A crate-local `unexpected_cfgs` declaration, deliberately NOT the
# workspace-inherited table (`[lints] workspace = true`): the workspace
# allowlist also carries root-crate-only cfgs (`kani`,
# `aligned_vmem_page_size_override`, `numa_shim_mock`) that would otherwise
# ship in this crate's published, normalized manifest looking like this
# crate's own. `loom` is the only non-standard cfg this crate's source uses
# (same pattern as `crates/aligned-vmem/Cargo.toml`'s `[lints.rust]` table).
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)'] }

# `incompatible_msrv` reads the DECLARED `rust-version` against a
# stabilization table for EVERY target — `tests/` included — so with the
# floor declared at its measured LIBRARY value above, this repo's
# `cargo clippy --all-targets -D warnings` convention fires the lint on
# `tests/stack_unit.rs`'s `std::panic::PanicHookInfo` (stable 1.81):
# dev-only code a library consumer never builds, which the library-surface
# MSRV policy (see `rust-version` above; Sol-codex review run 4, finding
# P2-3) refuses to let raise the floor. The floor's real oracle is the msrv
# job's pinned `cargo +1.79 check` rows in `.github/workflows/ci.yml` — a
# hard toolchain boundary, strictly stronger than this stabilization-table
# lint — so the lint is allowed instead of holding the declared number
# hostage to dev-only API usage.
[lints.clippy]
incompatible-msrv = "allow"

[dependencies]
# Zero non-std deps in a NORMAL build — enforced by Cargo's RESOLVER, not just
# by rustc's cfg evaluation. `loom` below is `optional = true`, which gives it
# an implicit `loom` feature; because Cargo's resolver is cfg-agnostic when
# producing `Cargo.lock`, a NON-optional `cfg(loom)` target dependency would
# still be resolved, locked, vendored and audited into every consumer's
# lockfile even though its cfg never holds in their build (a crate whose only
# dependency is this one goes from 31 locked packages down to 2 once `loom` is
# optional). Marking it optional means a normal build (no `--features loom`)
# has ZERO loom-related entries in `Cargo.lock` — not merely zero compiled
# code.
#
# Running the loom suite therefore requires BOTH:
#   1. `--cfg loom` in RUSTFLAGS, so the `#[cfg(loom)]` source lines compile —
#      the stack aliases its atomics to `loom::sync::atomic` ONLY under that
#      cfg (see `src/imp.rs`), so the shipped loom tests exercise the REAL
#      type, which is why `loom` is a `cfg(loom)`-gated LIBRARY dependency
#      (not merely a dev-dependency): the crate's own `src/imp.rs` references
#      it; AND
#   2. `--features loom`, so Cargo actually resolves and links the loom
#      dependency those lines reference.
# `--cfg loom` without the feature fails fast with a named `compile_error!`
# (adjacent to the `target_has_atomic` guard in `src/lib.rs`) instead of the
# cryptic unresolved-import error.

[target.'cfg(loom)'.dependencies]
loom = { workspace = true, optional = true }

[dev-dependencies]
proptest = "1"
# Fixed-iteration bench harness (dev-only — never reaches published
# consumers). See benches/tagged_index_stack_bench.rs.
bench-scale-tool = "0.1"

[features]
# Gates the crate's CAS-retry/backoff activation counters (`POP_RETRY_COUNT`,
# `PUSH_RETRY_COUNT`, the two backoff-cap-reach counters) and their
# `#[doc(hidden)]` accessors (`retry_counts_for_test`,
# `backoff_cap_reached_for_test`): instrumentation with no production caller,
# so per this crate's minimality pitch ("allocation-free, no_std") it must
# not ride the default build (round-9 review P3-4: an earlier revision
# compiled all of it unconditionally into every published build). Off by
# default. The loom build does NOT need this feature: under `--cfg loom` the
# same counters compile (the loom suite's `pop_retry_count_for_test` /
# `push_retry_count_for_test` read them), so the documented loom invocation
# is unchanged. `tests/threaded_conservation.rs` compiles its activation-
# oracle assertions only when this feature is on (its conservation and drain
# checks still run without it).
test-internals = []

[[bench]]
name = "tagged_index_stack_bench"
harness = false
# Stated explicitly rather than left to cargo's default: `cargo test` must
# not treat this bench as a test target. ci.yml's clippy row relies on that
# (it is why `--all-targets` is the step that covers the bench at all), and
# an implicit default is not something a workflow comment should be citing.
test = false
