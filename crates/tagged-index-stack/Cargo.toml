[package]
name = "tagged-index-stack"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
description = "Lock-free, allocation-free, no_std free-list of small indices (a slot recycler) with an ABA-defeating tag packed into one atomic word."
readme = "README.md"
repository = "https://github.com/PHPCraftdream/sefer-alloc"
homepage = "https://github.com/PHPCraftdream/sefer-alloc/tree/main/crates/tagged-index-stack"
documentation = "https://docs.rs/tagged-index-stack"
keywords = ["lock-free", "aba", "free-list", "slab", "no-std"]
categories = ["concurrency", "data-structures", "no-std::no-alloc"]

[lints]
# The `unexpected_cfgs` allowlist (several cfgs, including `loom`) is shared
# at the workspace root (`[workspace.lints.rust]`); most entries there are
# root-crate-only and harmlessly unused here.
workspace = true

[dependencies]
# Zero non-std deps in a NORMAL build — enforced by Cargo's RESOLVER, not just
# by rustc's cfg evaluation. `loom` below is `optional = true`, which gives it
# an implicit `loom` feature; because Cargo's resolver is cfg-agnostic when
# producing `Cargo.lock`, a NON-optional `cfg(loom)` target dependency would
# still be resolved, locked, vendored and audited into every consumer's
# lockfile even though its cfg never holds in their build (a crate whose only
# dependency is this one goes from 31 locked packages down to 2 once `loom` is
# optional). Marking it optional means a normal build (no `--features loom`)
# has ZERO loom-related entries in `Cargo.lock` — not merely zero compiled
# code.
#
# Running the loom suite therefore requires BOTH:
#   1. `--cfg loom` in RUSTFLAGS, so the `#[cfg(loom)]` source lines compile —
#      the stack aliases its atomics to `loom::sync::atomic` ONLY under that
#      cfg (see `src/lib.rs`), so the shipped loom tests exercise the REAL
#      type, which is why `loom` is a `cfg(loom)`-gated LIBRARY dependency
#      (not merely a dev-dependency): the crate's own `src/lib.rs` references
#      it; AND
#   2. `--features loom`, so Cargo actually resolves and links the loom
#      dependency those lines reference.
# `--cfg loom` without the feature fails fast with a named `compile_error!`
# (adjacent to the `target_has_atomic` guard in `src/lib.rs`) instead of the
# cryptic unresolved-import error.

[target.'cfg(loom)'.dependencies]
loom = { workspace = true, optional = true }

[dev-dependencies]
proptest = "1"
# Fixed-iteration bench harness (dev-only — never reaches published
# consumers). See benches/tagged_index_stack_bench.rs.
bench-scale-tool = "0.1"

[[bench]]
name = "tagged_index_stack_bench"
harness = false
# Stated explicitly rather than left to cargo's default: `cargo test` must
# not treat this bench as a test target. ci.yml's clippy row relies on that
# (it is why `--all-targets` is the step that covers the bench at all), and
# an implicit default is not something a workflow comment should be citing.
test = false
