[package]
name = "sefer-region"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
description = "Typed, generational handle-addressed store over slotmap — zero own unsafe, no C/C++, no_std + alloc capable."
readme = "README.md"
repository = "https://github.com/PHPCraftdream/sefer-alloc"
homepage = "https://github.com/PHPCraftdream/sefer-alloc/tree/main/crates/region"
documentation = "https://docs.rs/sefer-region"
keywords = ["slotmap", "arena", "handle", "generational", "no-std"]
categories = ["data-structures", "memory-management", "no-std"]

# docs.rs: render with all features so SyncRegion appears with the std feature badge
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["std"]
std = ["slotmap/std"]

[dependencies]
slotmap = { version = "1", default-features = false }

[lints.rust]
unsafe_code = "forbid"

[dev-dependencies]
# Fixed-iteration bench harness (dev-only — never reaches published
# consumers). See benches/region_bench.rs.
bench-scale-tool = "0.1"
# Capacity telemetry (dev-only). `slotmap::SlotMap` is not one of captrack's
# natively-wrapped collection types, so tests/captrack_probe.rs drives its
# public registry API (record_creation/record_sample) directly rather than
# via the CapInspect trait/macros. `telemetry` is required for the registry
# module to exist at all.
captrack = { version = "0.1", features = ["telemetry"] }
# Note: captrack is intentionally heavy (proc macro, supply-chain side effects)
# but accepted as a known cost for one ignored diagnostic probe. The workspace-local
# .cargo/config.toml sets CAPTRACK_AUTODUMP=0 to mitigate autodump side effects.

[[bench]]
name = "region_bench"
harness = false
required-features = ["std"]

[[example]]
name = "contended_reads"
required-features = ["std"]
