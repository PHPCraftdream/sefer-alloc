[package]
name = "aligned-vmem"
version = "0.2.0"
edition = "2021"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
description = "Cross-platform aligned anonymous virtual memory: reserve, commit, decommit, and release power-of-two-aligned spans via mmap/VirtualAlloc. Zero dependencies, miri-friendly."
readme = "README.md"
repository = "https://github.com/PHPCraftdream/sefer-alloc"
homepage = "https://github.com/PHPCraftdream/sefer-alloc/tree/main/crates/aligned-vmem"
documentation = "https://docs.rs/aligned-vmem"
keywords = ["mmap", "virtualalloc", "memory", "decommit", "aligned"]
categories = ["memory-management", "os"]

# docs.rs: render with the real, publication-facing optional features so the
# API this crate's own README advertises (lazy-commit / huge-pages /
# fault-injection) actually appears on the published docs page — the default
# feature set is intentionally empty (see `[features]` below), so a plain
# `cargo doc` render would omit all of it (task #644). Deliberately an
# explicit list, NOT `all-features = true`: `mock` is no longer a Cargo
# feature (converted to the build-time `--cfg aligned_vmem_mock` flag in
# task #962, per docs/CORRECTNESS_OPEN_ITEMS.md item 42) so `all-features`
# CANNOT turn it on. `bench-internals` is excluded — it is a diagnostic
# counter surface with no consumer-facing purpose. Mirrors the same decision
# made for `numa-shim` (`crates/numa-shim/Cargo.toml` — note that numa-shim's
# own `mock` has since ALSO been converted to the build-time `--cfg numa_shim_mock`
# flag, task #1288, 2026-08-23).
[package.metadata.docs.rs]
features = ["lazy-commit", "huge-pages", "fault-injection"]
rustdoc-args = ["--cfg", "docsrs"]

[features]
# Incremental-commit primitives: `reserve_aligned_lazy` (reserve VA + commit
# only an initial sub-range) and `commit_range` (commit additional pages within
# an existing reservation). Windows-only optimisation: on non-Windows and under
# miri the lazy path falls back to the eager `reserve_aligned` (all pages
# committed up front, identical observable behaviour). Off by default — NOT part
# of any default bundle. Feature-OFF builds are byte-for-byte identical.
#
# 0.2: renamed from the sefer-internal `alloc-lazy-commit` (allocator feature-
# bundle vocabulary) to the crate-local `lazy-commit`. The `alloc-lazy-commit`
# alias below is kept for one release to allow downstream consumers pinning the
# old name to continue building. It will be removed in the next semver-major
# release (0.3.0 or 1.0.0). Consumers should migrate to `lazy-commit` now.
lazy-commit = []
alloc-lazy-commit = ["lazy-commit"]

# Optional huge/large pages: `reserve_aligned_huge` requesting OS large pages
# (Linux `MAP_HUGETLB`, Windows `MEM_LARGE_PAGES`). Transparent-huge-page
# hinting (Linux `MADV_HUGEPAGE`) is not used: it cannot affect an already
# explicitly-huge `MAP_HUGETLB` mapping, so issuing it would be a wasted syscall.
# Currently a no-op on macOS and other non-Linux Unix (falls back to an ordinary
# reservation) — there is no `VM_FLAGS_SUPERPAGE` implementation yet. Off by
# default so the zero-deps core stays tiny. The reservation transparently
# falls back to ordinary pages when the OS refuses the large-page request, so
# the API never fails purely because huge pages are unavailable.
huge-pages = []

# Recording mock + fault injection: replaces the real OS syscalls with a
# thread-local recording backend (mirrors `numa-shim`'s `mock` feature) plus
# `mock::fail_next_reserve(n)` / `mock::fail_next_commit(n)` fault injectors.
# Lets any consumer deterministically test its OOM-handling on any target
# (including macOS and miri) without exhausting real commit charge. Off by
# default; NOT part of any bundle.
#
# NOTE: this used to be a Cargo feature whose unification hazard was documented
# as an open risk (task #715, rust-intel audit MEDIUM §C10). RESOLVED before
# the first 0.2.0 publish (task #962, docs/CORRECTNESS_OPEN_ITEMS.md item 42)
# by converting it to the build-time `--cfg aligned_vmem_mock` flag — cfg flags
# are passed only explicitly per-build via `RUSTFLAGS="--cfg aligned_vmem_mock"`
# and do not unify across the dependency graph, so no downstream crate can
# silently turn the mock backend on for anyone else. Same pattern as the repo's
# `cfg(loom)`/`cfg(kani)` precedent. The flag is declared in this crate's
# `[lints.rust unexpected_cfgs]` below so it produces no `unexpected cfg`
# warnings.

# Real-path fault injection, PUBLIC, PROCESS-GLOBAL, opt-in: armed "fail the
# next N / fail exactly the k-th" hooks on TWO real syscall paths —
# `try_commit_range` (`lazy-commit`) and, since task #1219, decommit's
# `dispatch_try_decommit` (reached by both the free `try_decommit` and
# `Reservation::try_decommit`) — DISTINCT from `mock` — `mock` replaces the
# whole backend (reservations still hit the OS, but commit/decommit/recommit
# never do), so a consumer that needs the real backend under test (real
# segment reservations, real commit accounting) cannot use `mock`.
# `fault-injection` changes nothing about which backend runs; it only splices
# a check in front of the real commit/decommit syscall so a test can
# deterministically force it to report OS-refused. Implies `lazy-commit` (the
# commit-side hook's only consumer is in `try_commit_range`, which is only
# compiled when `lazy-commit` is enabled). Off by default; NOT part of any
# bundle; zero cost when disabled (the hook bodies are compiled out entirely,
# not just branched around at runtime).
#
# WHY THIS STAYS A CARGO FEATURE while `mock` above became a `--cfg` flag
# (task #1144/N3 — the asymmetry was previously undocumented, which is the
# actual defect that task found; it is a deliberate choice, not an oversight):
# Cargo features DO unify across the dependency graph, so any crate anywhere
# in a build that enables `aligned-vmem/fault-injection` enables it for every
# other consumer too, and the arming functions in `src/fault_injection.rs` are
# safe and process-global. That is real cross-crate influence and it is why
# `mock` was moved off features. The two hazards are NOT the same size:
#   - `mock` REPLACES the backend. A silently-unified `mock` means a consumer
#     believes it is exercising real `mmap`/`VirtualAlloc` when it is not —
#     the failure is invisible and the consumer's own test suite goes green
#     against a fiction. That is unacceptable at any probability.
#   - `fault-injection` only ADDS a check in front of the real backend call.
#     It is DISARMED unless someone explicitly arms it, and the worst it can
#     do when armed is make `try_commit_range` or decommit's fallible entry
#     points (the free `try_decommit` / `Reservation::try_decommit`) report an
#     error the caller is already obliged to handle (both return `Result`).
#     No allocation becomes fake, no memory-safety property is weakened, and
#     the real syscall path is unchanged when disarmed.
# So the cost of unification here is a liveness/robustness surprise a caller
# must already be prepared for, not a silently-wrong test result. Converting
# it to a `--cfg` would remove a documented feature from the public surface
# immediately before the crate's first publish, for a hazard of a materially
# smaller class. REVISIT if `fault-injection` ever gains a hook that changes
# what memory a caller actually gets, rather than only which `Result` it sees.
fault-injection = ["lazy-commit"]

# Diagnostic-only path-activation counters (task #504, F11 step 1): a Unix
# hit/total pair around `try_reserve_aligned_exact` (settles the "coin flip"
# question from
# https://github.com/PHPCraftdream/sefer-alloc/blob/main/docs/perf/SPEEDUP_OPPORTUNITY_SURVEY_2026-07-31.md
# F11 with
# a real number) plus Windows-side counters for `win_reserve_commit` calls
# split by fast/slow path (`aligned_vmem::windows_reserve_commit_single_calls()` /
# `aligned_vmem::windows_reserve_commit_two_call_pairs()` — the fast path
# issues a single syscall for alignments within the fast-path condition on a full-span commit
# (`commit_len == size`), the traditional path issues two syscalls for
# larger alignments or a partial initial commit), for cross-platform comparison,
# plus (round-6, task #882) a Unix `madvise(2)` attempt/success pair
# (`aligned_vmem::unix_madvise_attempts()` / `unix_madvise_successes()`) that
# settles whether a `decommit`/`decommit_lazy` call's underlying syscall
# actually succeeded — see
# https://github.com/PHPCraftdream/sefer-alloc/blob/main/docs/CORRECTNESS_OPEN_ITEMS.md
# item 48, plus Windows `VirtualFree(MEM_DECOMMIT)` attempt/failure counters
# (`aligned_vmem::windows_virtualfree_decommit_attempts()` /
# `aligned_vmem::windows_virtualfree_decommit_failures()`), Unix `munmap`
# failures (`aligned_vmem::unix_munmap_failures()`), Windows `VirtualFree(MEM_RELEASE)`
# failures (`aligned_vmem::windows_virtualfree_release_failures()`), and three Windows
# large-page counters (R4-5/R5-4, R7-3): `windows_large_page_retry_failures()` (initial
# large-page attempt AND ordinary-page retry BOTH failed),
# `windows_large_page_alignment_failures()` (allocation succeeded but base was
# misaligned, forcing fallback), and
# `windows_large_page_plain_fallback_successes()` (initial large-page attempt
# failed but ordinary-page retry succeeded — closes the observability gap where
# `windows_reserve_commit_single_calls()` cannot distinguish between "single-call
# with large pages succeeded" and "single-call failed with large pages, retry with
# plain pages succeeded"). All three measure syscall overhead that
# `windows_reserve_commit_single_calls()` does NOT capture, and
# `aligned_vmem::huge_decommit_attempts()` (R4-4) counting the EARLY-EXIT decommit
# calls on huge-page reservations — the safe methods skip the syscall there because
# it is provably useless (task #1040/R6-7), so this counts skips, NOT an upper bound
# on a huge-page incompatibility rate as it did before that change. Keep this
# wording in step with the counter's own rustdoc in `src/lib.rs`; the two drifted
# apart once already (task #1045, finding R7-9). Shares sefer-alloc's
# `bench-internals` feature NAME (`AtomicU64` storage and
# increments both gated on `bench-internals`; the statics are `#[doc(hidden)]`,
# the accessor functions are public — sefer-alloc's own convention is the
# inverse attribute placement: private statics wrapped by `#[doc(hidden)]`
# accessor functions), which is what lets sefer-alloc's own `bench-internals`
# forward into it via `aligned-vmem/bench-internals`. Off by default; NOT part of any bundle;
# zero cost when disabled (increments compiled out entirely).
bench-internals = []

# `aligned_vmem_mock` and `aligned_vmem_page_size_override` are build-time
# cfgs (set via `RUSTFLAGS="--cfg aligned_vmem_mock"` /
# `RUSTFLAGS="--cfg aligned_vmem_page_size_override"`), NOT Cargo features
# — cfg flags do not unify across the build's dependency graph, which is the
# whole point of the task #962 conversion. The second entry is the test-only
# page-size injection cfg (task #1080): the same task-#962 rationale — a
# Cargo feature would unify across the dependency graph, while the cfg is
# turned on ONLY by the explicit per-build invocations that pass it
# (`RUSTFLAGS="--cfg aligned_vmem_page_size_override"` — the check-all step
# and the ci.yml `test-windows` row). Declaring both here keeps
# `unexpected_cfgs` silent for this crate (same pattern as the root
# workspace's `loom`/`kani` declaration, which this crate does not inherit —
# it has no `[lints] workspace = true`).
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(aligned_vmem_mock)', 'cfg(aligned_vmem_page_size_override)'] }

[dependencies]

[dev-dependencies]
bench-scale-tool = "0.1"

[[bench]]
name = "vmem_bench"
harness = false

[[example]]
name = "v20_849_unix_exact_reserve_hit_rate"
required-features = ["bench-internals"]

# task #1189's Windows large-page profiling probe. It imports both the
# `bench-internals` counters and `reserve_aligned_huge`, so it needs BOTH
# features declared here: without them `cargo test -p aligned-vmem` (which
# builds examples) fails to compile with E0432 in every row that does not
# happen to enable both. Its sibling above needs only `bench-internals`.
[[example]]
name = "v1189_windows_large_page_native_profile"
required-features = ["bench-internals", "huge-pages"]
