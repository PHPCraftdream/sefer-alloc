[package]
name = "proc-memstat"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
description = "Single-read self-probe of a process's own memory: RSS + commit charge + virtual size + peak RSS, in bytes, from ONE snapshot call. Commit charge (rarely surfaced elsewhere) is a separate axis from RSS, and virtual size is a separate axis again — each is reported under its own name, absent rather than substituted where the platform API does not provide it. 100% Rust with zero crate dependencies (no sysinfo, no libc) — native OS APIs are still called, via locally-declared FFI: Linux /proc parsing, Windows K32GetProcessMemoryInfo, macOS task_info, all via locally-declared FFI. Zero crate deps."
readme = "README.md"
repository = "https://github.com/PHPCraftdream/sefer-alloc"
homepage = "https://github.com/PHPCraftdream/sefer-alloc/tree/main/crates/proc-memstat"
documentation = "https://docs.rs/proc-memstat"
keywords = ["rss", "memory", "commit-charge", "process", "peak-rss"]
categories = ["os", "memory-management", "development-tools::profiling"]

[dependencies]
