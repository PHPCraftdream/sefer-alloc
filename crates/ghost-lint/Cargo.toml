[package]
name = "ghost-lint"
version = "0.1.0"
edition = "2021"
rust-version = "1.93"
license = "MIT OR Apache-2.0"
description = "Repository tool: per-site semantic lint rules (R1-R10) for sefer-alloc's ghost-checks plan (docs/GHOST_CHECKS_PLAN.md). Not published."
publish = false

[lints]
workspace = true

# Versions are the ones already in Cargo.lock (transitive before this crate); no
# new versions. `span-locations` gives line numbers for `spans` and messages.
[dependencies]
syn = { version = "2.0.118", default-features = false, features = ["full", "visit", "parsing", "printing", "clone-impls"] }
proc-macro2 = { version = "1.0.106", default-features = false, features = ["span-locations"] }
quote = { version = "1.0.46", default-features = false }
serde_json = { version = "1.0.150" }
regex = { version = "1.12.4" }
