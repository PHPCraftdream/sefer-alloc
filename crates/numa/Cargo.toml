[package]
name = "numa-shim"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
description = "100% Rust NUMA detection and binding — no C/C++ libraries (no libnuma, no hwloc). Linux mbind(2) via raw syscall(2), Windows VirtualAllocExNuma, sysfs cpumap reader. macOS/miri no-op. Zero crate deps by default. forbid(unsafe_code)-friendly for consumers."
readme = "README.md"
repository = "https://github.com/PHPCraftdream/sefer-alloc"
homepage = "https://github.com/PHPCraftdream/sefer-alloc/tree/main/crates/numa"
documentation = "https://docs.rs/numa-shim"
keywords = ["numa", "mbind", "scheduling", "memory", "sysfs"]
categories = ["os", "memory-management"]

# docs.rs: render with `vmem-integration` on so `reserve_on_node` — one of
# this crate's two headline capabilities, and the thing the README documents
# at length — actually appears on the published docs page; the default
# feature set is empty (see `[features]` below), so a plain `cargo doc`
# render omits it entirely (task #644). Deliberately an explicit list, NOT
# `all-features = true`: `all-features` would also turn on `mock`, which
# REPLACES the real platform backend (not merely additive) and would surface
# the test-only recording module as if it were ordinary reference API — same
# reasoning applied consistently to `aligned-vmem`'s own `mock` feature
# (`../vmem/Cargo.toml`).
[package.metadata.docs.rs]
features = ["vmem-integration"]

[features]
default = []
vmem-integration = ["dep:aligned-vmem"]
# Test-only: replace platform syscalls with a recording mock.  Lets every
# CI run (any target) assert the wrapping logic without touching the real
# kernel.  See docs/NUMA_TESTING_OPTIONS.md Phase 1.
#
# CARGO FEATURE-UNIFICATION HAZARD (task #726, rust-intel audit §C10) — read
# before enabling: this is a NON-ADDITIVE, backend-REPLACING feature. Cargo
# unifies features across a build's WHOLE dependency graph, not per edge —
# so if ANY crate anywhere downstream of your build (including a sibling
# workspace member's own `[dev-dependencies]`) enables `numa-shim/mock`,
# every OTHER consumer in that SAME build silently gets the mock backend
# too: `current_node`/`bind_range`/`reserve_on_node` stop touching the real
# OS for THEM as well, with no compile error and no warning. Enable this
# feature ONLY in a leaf test/dev target (a `[[test]]`, an integration-test
# crate, or a `[dev-dependencies]` entry in a binary that is never itself a
# library dependency of anything else) — never in a library's own
# `[dependencies]`, and never in a `[dev-dependencies]` entry reachable from
# more than one build target in the same workspace. Same policy as
# `aligned-vmem`'s own `mock` feature (`../vmem/Cargo.toml`, task #715): a
# stronger fix (a build-time `--cfg` flag instead of a Cargo feature,
# matching this repo's `cfg(loom)`/`cfg(kani)` precedent — cfg flags do not
# unify) was evaluated and DEFERRED for the same reason — this crate has not
# yet had its first crates.io publish (task #657), so removing `mock` as a
# Cargo feature later remains possible without an immediate breaking-change
# cost, and converting now would be a large mechanical change for a hazard
# that, today, has zero real external consumers to protect. Revisit if/when
# this crate gains external consumers and the hazard is reported for real.
mock = []

[dependencies]
aligned-vmem = { version = "0.2", path = "../vmem", optional = true }
