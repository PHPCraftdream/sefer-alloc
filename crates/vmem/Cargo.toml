[package]
name = "aligned-vmem"
version = "0.2.0"
edition = "2021"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
description = "Cross-platform aligned anonymous virtual memory: reserve a power-of-two-aligned span (exact-size mmap fast path on Unix, over-reserve on Windows), commit/decommit pages, release — mmap/madvise on Unix, VirtualAlloc/MEM_DECOMMIT on Windows. 100% Rust, zero crate deps, no C/C++ libraries pulled in, miri-friendly."
readme = "README.md"
repository = "https://github.com/PHPCraftdream/sefer-alloc"
homepage = "https://github.com/PHPCraftdream/sefer-alloc/tree/main/crates/vmem"
documentation = "https://docs.rs/aligned-vmem"
keywords = ["mmap", "virtualalloc", "memory", "decommit", "aligned"]
categories = ["memory-management", "os"]

# docs.rs: render with the real, publication-facing optional features so the
# API this crate's own README advertises (lazy-commit / huge-pages /
# fault-injection) actually appears on the published docs page — the default
# feature set is intentionally empty (see `[features]` below), so a plain
# `cargo doc` render would omit all of it (task #644). Deliberately an
# explicit list, NOT `all-features = true`: `all-features` would also turn on
# `mock`, which REPLACES the real syscall backend (not merely additive) and
# would surface the test-only recording module (`src/mock.rs`) as if it were
# ordinary reference API. `bench-internals` is likewise excluded — it is a
# diagnostic counter surface with no consumer-facing purpose. Mirrors the
# same decision made for `numa-shim` (`crates/numa/Cargo.toml`).
[package.metadata.docs.rs]
features = ["lazy-commit", "huge-pages", "fault-injection"]

[features]
# Incremental-commit primitives: `reserve_aligned_lazy` (reserve VA + commit
# only an initial sub-range) and `commit_range` (commit additional pages within
# an existing reservation). Windows-only optimisation: on non-Windows and under
# miri the lazy path falls back to the eager `reserve_aligned` (all pages
# committed up front, identical observable behaviour). Off by default — NOT part
# of any default bundle. Feature-OFF builds are byte-for-byte identical.
#
# 0.2: renamed from the sefer-internal `alloc-lazy-commit` (allocator feature-
# bundle vocabulary) to the crate-local `lazy-commit`. `alloc-lazy-commit` is
# kept as a thin alias for one release so downstream consumers pinning the old
# name keep building.
lazy-commit = []
alloc-lazy-commit = ["lazy-commit"]

# Optional huge/large pages: `reserve_aligned_huge` requesting OS large pages
# (Linux `MAP_HUGETLB` + `MADV_HUGEPAGE`, Windows `MEM_LARGE_PAGES`). Currently
# a no-op on macOS and other non-Linux Unix (falls back to an ordinary
# reservation) — there is no `VM_FLAGS_SUPERPAGE` implementation yet. Off by
# default so the zero-deps core stays tiny. The reservation transparently
# falls back to ordinary pages when the OS refuses the large-page request, so
# the API never fails purely because huge pages are unavailable.
huge-pages = []

# Recording mock + fault injection: replaces the real OS syscalls with a
# thread-local recording backend (mirrors `numa-shim`'s `mock` feature) plus
# `mock::fail_next_reserve(n)` / `mock::fail_next_commit(n)` fault injectors.
# Lets any consumer deterministically test its OOM-handling on any target
# (including macOS and miri) without exhausting real commit charge. Off by
# default; NOT part of any bundle.
mock = []

# Real-path commit fault injection: an armed "fail the next N / fail exactly
# the k-th" hook on the REAL `try_commit_range` syscall path (`lazy-commit`),
# DISTINCT from `mock` — `mock` replaces the whole backend (reservations still
# hit the OS, but commit/decommit/recommit never do), so a consumer that needs
# the real backend under test (real segment reservations, real commit
# accounting) cannot use `mock`. `fault-injection` changes nothing about which
# backend runs; it only splices two checks in front of the real commit syscall
# so a test can deterministically force it to report OS-refused. Off by
# default; NOT part of any bundle; zero cost when disabled (the hook body is
# compiled out entirely, not just branched around at runtime).
fault-injection = []

# Diagnostic-only path-activation counters (task #504, F11 step 1): a Unix
# hit/total pair around `try_reserve_aligned_exact` (settles the "coin flip"
# question from `docs/perf/SPEEDUP_OPPORTUNITY_SURVEY_2026-07-31.md` F11 with
# a real number) plus a Windows-side count of `win_reserve_commit` calls (2
# syscalls each: one `MEM_RESERVE` + one `MEM_COMMIT`), for cross-platform
# comparison. Mirrors sefer-alloc's own `bench-internals` convention
# (`AtomicU64` storage, always compiled; `#[doc(hidden)]` accessors) — this
# crate has no such feature of its own yet, so it is introduced here with the
# same name for the sefer-alloc `bench-internals` feature to forward into via
# `aligned-vmem/bench-internals`. Off by default; NOT part of any bundle;
# zero cost when disabled (increments compiled out entirely).
bench-internals = []

[dependencies]
