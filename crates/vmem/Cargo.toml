[package]
name = "aligned-vmem"
version = "0.2.0"
edition = "2021"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
description = "Cross-platform aligned anonymous virtual memory: reserve a power-of-two-aligned span (exact-size mmap fast path on Unix; on fast-path miss or Windows with align > 64 KiB, over-reserve size+align and keep the full mapping; Windows with align <= 64 KiB uses single-call fast path with no over-reserve), commit/decommit pages, release — mmap/madvise on Unix, VirtualAlloc/MEM_DECOMMIT on Windows. 100% Rust, zero crate deps, no C/C++ libraries pulled in, miri-friendly."
readme = "README.md"
repository = "https://github.com/PHPCraftdream/sefer-alloc"
homepage = "https://github.com/PHPCraftdream/sefer-alloc/tree/main/crates/vmem"
documentation = "https://docs.rs/aligned-vmem"
keywords = ["mmap", "virtualalloc", "memory", "decommit", "aligned"]
categories = ["memory-management", "os"]

# docs.rs: render with the real, publication-facing optional features so the
# API this crate's own README advertises (lazy-commit / huge-pages /
# fault-injection) actually appears on the published docs page — the default
# feature set is intentionally empty (see `[features]` below), so a plain
# `cargo doc` render would omit all of it (task #644). Deliberately an
# explicit list, NOT `all-features = true`: `all-features` would also turn on
# `mock`, which REPLACES the real syscall backend (not merely additive) and
# would surface the test-only recording module (`src/mock.rs`) as if it were
# ordinary reference API. `bench-internals` is likewise excluded — it is a
# diagnostic counter surface with no consumer-facing purpose. Mirrors the
# same decision made for `numa-shim` (`crates/numa/Cargo.toml`).
[package.metadata.docs.rs]
features = ["lazy-commit", "huge-pages", "fault-injection"]
rustdoc-args = ["--cfg", "docsrs"]

[features]
# Incremental-commit primitives: `reserve_aligned_lazy` (reserve VA + commit
# only an initial sub-range) and `commit_range` (commit additional pages within
# an existing reservation). Windows-only optimisation: on non-Windows and under
# miri the lazy path falls back to the eager `reserve_aligned` (all pages
# committed up front, identical observable behaviour). Off by default — NOT part
# of any default bundle. Feature-OFF builds are byte-for-byte identical.
#
# 0.2: renamed from the sefer-internal `alloc-lazy-commit` (allocator feature-
# bundle vocabulary) to the crate-local `lazy-commit`. The `alloc-lazy-commit`
# alias below is kept for one release to allow downstream consumers pinning the
# old name to continue building. It will be removed in the next semver-major
# release (0.3.0 or 1.0.0). Consumers should migrate to `lazy-commit` now.
lazy-commit = []
alloc-lazy-commit = ["lazy-commit"]

# Optional huge/large pages: `reserve_aligned_huge` requesting OS large pages
# (Linux `MAP_HUGETLB` + `MADV_HUGEPAGE`, Windows `MEM_LARGE_PAGES`). Currently
# a no-op on macOS and other non-Linux Unix (falls back to an ordinary
# reservation) — there is no `VM_FLAGS_SUPERPAGE` implementation yet. Off by
# default so the zero-deps core stays tiny. The reservation transparently
# falls back to ordinary pages when the OS refuses the large-page request, so
# the API never fails purely because huge pages are unavailable.
huge-pages = []

# Recording mock + fault injection: replaces the real OS syscalls with a
# thread-local recording backend (mirrors `numa-shim`'s `mock` feature) plus
# `mock::fail_next_reserve(n)` / `mock::fail_next_commit(n)` fault injectors.
# Lets any consumer deterministically test its OOM-handling on any target
# (including macOS and miri) without exhausting real commit charge. Off by
# default; NOT part of any bundle.
#
# CARGO FEATURE-UNIFICATION HAZARD (task #715, rust-intel audit MEDIUM §C10)
# — read before enabling: this is a NON-ADDITIVE, backend-REPLACING feature.
# Cargo unifies features across a build's WHOLE dependency graph, not per
# edge — so if ANY crate anywhere downstream of your build (including a
# sibling workspace member's own `[dev-dependencies]`) enables
# `aligned-vmem/mock`, every OTHER consumer in that SAME build silently gets
# the mock backend too: `reserve_aligned`/`recommit`/`decommit`/etc. stop
# touching the real OS for THEM as well, with no compile error and no
# warning. Enable this feature ONLY in a leaf test/dev target (a `[[test]]`,
# an integration-test crate, or a `[dev-dependencies]` entry in a binary that
# is never itself a library dependency of anything else) — never in a
# library's own `[dependencies]`, and never in a `[dev-dependencies]` entry
# that could be reached from more than one build target in the same
# workspace. A stronger fix (a build-time `--cfg` flag instead of a Cargo
# feature, matching this repo's own `cfg(loom)`/`cfg(kani)` precedent — cfg
# flags do not unify) was evaluated and DEFERRED: `mock` (and `Call`, and
# `src/mock.rs`) is new in 0.2.0 and has never been published — 0.1.0 had no
# `mock` feature at all. Removing or converting `mock` is therefore still
# free today and stays free only until 0.2.0 ships (task #658); the deferral
# rests on the mechanical cost of the conversion (every test file, `ci.yml`,
# this crate's whole feature-powerset CI matrix) plus the absence of real
# external consumers today, not on any already-incurred breaking-change
# cost. Revisit if/when this crate gains external consumers and the hazard
# is reported for real — but settle the `--cfg` question before 0.2.0
# publishes if it is going to be settled at all.
mock = []

# Real-path commit fault injection: an armed "fail the next N / fail exactly
# the k-th" hook on the REAL `try_commit_range` syscall path (`lazy-commit`),
# DISTINCT from `mock` — `mock` replaces the whole backend (reservations still
# hit the OS, but commit/decommit/recommit never do), so a consumer that needs
# the real backend under test (real segment reservations, real commit
# accounting) cannot use `mock`. `fault-injection` changes nothing about which
# backend runs; it only splices two checks in front of the real commit syscall
# so a test can deterministically force it to report OS-refused. Off by
# default; NOT part of any bundle; zero cost when disabled (the hook body is
# compiled out entirely, not just branched around at runtime).
fault-injection = []

# Diagnostic-only path-activation counters (task #504, F11 step 1): a Unix
# hit/total pair around `try_reserve_aligned_exact` (settles the "coin flip"
# question from `docs/perf/SPEEDUP_OPPORTUNITY_SURVEY_2026-07-31.md` F11 with
# a real number) plus Windows-side counters for `win_reserve_commit` calls
# split by fast/slow path (`aligned_vmem::windows_reserve_commit_single_calls()` /
# `aligned_vmem::windows_reserve_commit_two_call_pairs()` — the fast path
# issues a single syscall for `align <= 64 KiB` on a full-span commit
# (`commit_len == size`), the traditional path issues two syscalls for
# larger alignments or a partial initial commit), for cross-platform comparison,
# plus (round-6, task #882) a Unix `madvise(2)` attempt/success pair
# (`aligned_vmem::unix_madvise_attempts()` / `unix_madvise_successes()`) that
# settles whether a `decommit`/`decommit_lazy` call's underlying syscall
# actually succeeded — see `docs/CORRECTNESS_OPEN_ITEMS.md` item 48. Mirrors
# sefer-alloc's own `bench-internals` feature NAME (`AtomicU64` storage and
# increments both gated on `bench-internals`; the statics are `#[doc(hidden)]`,
# the accessor functions are public — sefer-alloc's own convention is the
# inverse attribute placement: private statics wrapped by `#[doc(hidden)]`
# accessor functions) — this crate has no such feature
# of its own yet, so it is introduced here with the same name for the
# sefer-alloc `bench-internals` feature to forward into via
# `aligned-vmem/bench-internals`. Off by default; NOT part of any bundle;
# zero cost when disabled (increments compiled out entirely).
bench-internals = []

[dependencies]

[dev-dependencies]
bench-scale-tool = "0.1"

[[bench]]
name = "vmem_bench"
harness = false

[[example]]
name = "v20_849_unix_exact_reserve_hit_rate"
required-features = ["bench-internals"]
