[package]
name = "racy-ptr-cell"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
description = "Allocation-free, no_std lazy CAS-published pointer cell (UNINIT -> INITIALIZING -> READY over one AtomicPtr) with fallible init: OOM rolls the sentinel back and losers RE-RACE (unlike OnceLock, which poisons/blocks). Success paths are safe inside a #[global_allocator] (no std sync, no heap); its two panic paths allocate under std and are not reentrancy-safe. Ships executable loom proofs run against the real type, with #[should_panic] counterfactuals."
readme = "README.md"
repository = "https://github.com/PHPCraftdream/sefer-alloc"
homepage = "https://github.com/PHPCraftdream/sefer-alloc/tree/main/crates/racy-ptr-cell"
documentation = "https://docs.rs/racy-ptr-cell"
keywords = ["oncelock", "spin", "allocator", "cas", "no-std"]
categories = ["memory-management", "concurrency", "no-std::no-alloc"]

[lints]
# `loom` / `kani` cfg declarations are shared at the workspace root
# (`[workspace.lints.rust]`); `kani` is root-only and harmlessly unused here.
workspace = true

[dependencies]
# Zero non-std deps in a NORMAL build. Under `--cfg loom` ONLY, the cell aliases
# its atomics to `loom::sync::atomic` so the shipped loom tests exercise the
# REAL `RacyPtrCell` type — so `loom` is a `cfg(loom)`-gated LIBRARY dependency
# (not merely a dev-dependency): the cell's own `src/lib.rs` references it. A
# normal `cargo build` (no `--cfg loom`) pulls in zero non-std deps.

[target.'cfg(loom)'.dependencies]
loom = { workspace = true }

[dev-dependencies]
# Fixed-iteration bench harness (dev-only — never reaches published
# consumers). See benches/racy_ptr_cell_bench.rs.
bench-scale-tool = "0.1"

[[bench]]
name = "racy_ptr_cell_bench"
harness = false
